format: 1
id: doc/meeting-minutes
title: Committee Meeting Minutes
summary: Minutes of a society's committee meeting, with a details table, numbered agenda headings and an action-item table.
category: Letters & Memos
tags: [minutes, table, numbered-headings, table-style]
features: [doc.text.typing, doc.format.paragraph, doc.lists.bullets-numbering, doc.tables.edit, doc.styles.manage, doc.headers.footers]
description: |
  A borderless two-column table carries the meeting details. Each agenda item is a Heading 2
  numbered by a list linked to the style, so new items number themselves. The action items sit in
  a table with a custom table style: a dark header row with white bold text and light banded rows.
document: { name: meeting-minutes.docx, width: 816, height: 1056 }
fonts:
  - bricolage-grotesque/BricolageGrotesque-Variable.ttf
  - carlito/Carlito-Regular.ttf
  - carlito/Carlito-Bold.ttf
  - carlito/Carlito-Italic.ttf
steps:
  - { command: review.proofing }
  - { command: design.themeFonts, params: { heading: Bricolage Grotesque, body: Carlito } }
  - { command: styles.modify, params: { style: Normal, chr: { size: 10.5 }, para: { spaceAfter: 6, lineSpacing: { rule: multiple, value: 1.15 } } } }
  - { command: styles.modify, params: { style: Heading 2, chr: { size: 13, bold: true, color: { Rgb: [28, 43, 36] } }, para: { spaceBefore: 12, spaceAfter: 4 } } }
  - { command: layout.margins, params: { top: 54, bottom: 54, left: 72, right: 72 } }
  # Title block, from two styles so no direct formatting runs on into the body.
  - { command: styles.modify, params: { style: Subtitle, chr: { font: Carlito, size: 9, bold: true, spacing: 1.5, color: { Rgb: [46, 125, 91] } }, para: { spaceAfter: 2 } } }
  - { command: styles.modify, params: { style: Title, chr: { font: Bricolage Grotesque, size: 24, bold: true, spacing: 0, color: { Rgb: [28, 43, 36] } }, para: { spaceAfter: 10, borders: { bottom: { style: single, width: 2.25, color: [46, 125, 91], space: 4 } } } } }
  - { command: para.style, params: { style: Subtitle } }
  - { command: text.insert, params: { text: RIVERSIDE ALLOTMENT SOCIETY } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Title } }
  - { command: text.insert, params: { text: Committee Meeting Minutes } }
  - { command: text.newParagraph }
  - { command: para.normal }
  # Meeting details.
  - { command: insert.table, params: { rows: 5, cols: 2 }, as: details }
  - { command: table.columnWidth, params: { width: 84 } }
  - { command: text.tab }
  - { command: table.columnWidth, params: { width: 384 } }
  - { command: text.backTab }
  - { command: format.bold, params: { value: true } }
  - { command: text.insert, params: { text: Date } }
  - { command: text.tab }
  - { command: format.bold, params: { value: false } }
  - { command: text.insert, params: { text: "Tuesday 3 November 2026, 19:00–20:40" } }
  - { command: text.tab }
  - { command: format.bold, params: { value: true } }
  - { command: text.insert, params: { text: Venue } }
  - { command: text.tab }
  - { command: format.bold, params: { value: false } }
  - { command: text.insert, params: { text: "Pavilion hut, Plot 1, Riverside Allotments" } }
  - { command: text.tab }
  - { command: format.bold, params: { value: true } }
  - { command: text.insert, params: { text: Present } }
  - { command: text.tab }
  - { command: format.bold, params: { value: false } }
  - { command: text.insert, params: { text: "Marguerite Okafor (Chair), Tobias Wren (Treasurer), Priya Raman (Secretary), Alun Hughes, Dorota Malinowska, Sam Ferreira" } }
  - { command: text.tab }
  - { command: format.bold, params: { value: true } }
  - { command: text.insert, params: { text: Apologies } }
  - { command: text.tab }
  - { command: format.bold, params: { value: false } }
  - { command: text.insert, params: { text: "Keith Ambrose, Yusuf Demir" } }
  - { command: text.tab }
  - { command: format.bold, params: { value: true } }
  - { command: text.insert, params: { text: Minutes } }
  - { command: text.tab }
  - { command: format.bold, params: { value: false } }
  - { command: text.insert, params: { text: Priya Raman } }
  - { command: table.selectTable }
  - { command: table.borders, params: { kind: none } }
  - { command: table.borders, params: { kind: bottom, width: 0.5, color: "C9D6CF" } }
  - { command: para.spacing, params: { before: 0, after: 0 } }
  - { command: table.cellMargins, params: { top: 3, bottom: 3, left: 0, right: 4 } }
  - { command: caret.docEnd }
  # Agenda items, numbered through Heading 2.
  - { command: para.heading2 }
  - { command: list.define, params: { levels: [ { format: decimal, text: "%1.", style: Heading 2, alignedAt: 0, indentAt: 22 } ] }, as: agenda }
  - { command: text.insert, params: { text: Minutes of the last meeting } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "The minutes of 6 October were agreed as a true record, proposed by Alun Hughes and seconded by Sam Ferreira." } }
  - { command: text.newParagraph }
  - { command: para.heading2 }
  - { command: text.insert, params: { text: "Treasurer's report" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Tobias reported a balance of £4,812 after the autumn seed order. Rent for 61 of the 64 plots has been paid; reminders will go to the remaining three holders this week. The water bill rose by 18 per cent, mostly from the leak by the east gate that has now been repaired." } }
  - { command: text.newParagraph }
  - { command: para.heading2 }
  - { command: text.insert, params: { text: Composting toilet } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Two quotes were compared. The committee preferred the timber kit from the community workshop, which members can assemble over two weekends, to the ready-built cabin, which costs three times as much." } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Decision: buy the timber kit (£1,150) and apply to the parish fund for half of the cost. Agreed unanimously." } }
  - { command: select.text, params: { text: "Decision:" } }
  - { command: format.bold, params: { value: true } }
  - { command: caret.docEnd }
  - { command: text.newParagraph }
  - { command: para.heading2 }
  - { command: text.insert, params: { text: Spring open day } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "The open day will be held on Saturday 18 April with a seedling swap, a soup stall and guided walks for the primary school. Dorota will coordinate volunteers; plot holders are asked to tidy shared paths beforehand." } }
  - { command: text.newParagraph }
  - { command: para.heading2 }
  - { command: text.insert, params: { text: Actions } }
  - { command: text.newParagraph }
  - { command: insert.table, params: { rows: 6, cols: 3 }, as: actions }
  - { command: table.newStyle, params: { name: Minutes Actions, wholeTable: { borders: false, size: 10 }, headerRow: { fill: "2E7D5B", color: "FFFFFF", bold: true }, bandedRows: { fill: "EEF4F0" }, apply: true } }
  - { command: table.columnWidth, params: { width: 268 } }
  - { command: text.tab }
  - { command: table.columnWidth, params: { width: 116 } }
  - { command: text.tab }
  - { command: table.columnWidth, params: { width: 84 } }
  - { command: text.backTab }
  - { command: text.backTab }
  - { command: text.insert, params: { text: Action } }
  - { command: text.tab }
  - { command: text.insert, params: { text: Owner } }
  - { command: text.tab }
  - { command: text.insert, params: { text: Due } }
  - { command: text.tab }
  - { command: text.insert, params: { text: "Send rent reminders to plots 12, 37 and 58" } }
  - { command: text.tab }
  - { command: text.insert, params: { text: Tobias Wren } }
  - { command: text.tab }
  - { command: text.insert, params: { text: 10 November } }
  - { command: text.tab }
  - { command: text.insert, params: { text: Order the composting toilet kit } }
  - { command: text.tab }
  - { command: text.insert, params: { text: Alun Hughes } }
  - { command: text.tab }
  - { command: text.insert, params: { text: 20 November } }
  - { command: text.tab }
  - { command: text.insert, params: { text: Submit the parish fund application } }
  - { command: text.tab }
  - { command: text.insert, params: { text: Priya Raman } }
  - { command: text.tab }
  - { command: text.insert, params: { text: 1 December } }
  - { command: text.tab }
  - { command: text.insert, params: { text: Draw up the open day volunteer rota } }
  - { command: text.tab }
  - { command: text.insert, params: { text: Dorota Malinowska } }
  - { command: text.tab }
  - { command: text.insert, params: { text: 15 January } }
  - { command: text.tab }
  - { command: text.insert, params: { text: Invite the primary school to the open day } }
  - { command: text.tab }
  - { command: text.insert, params: { text: Sam Ferreira } }
  - { command: text.tab }
  - { command: text.insert, params: { text: 31 January } }
  - { command: table.selectTable }
  - { command: para.spacing, params: { before: 0, after: 0 } }
  - { command: table.cellMargins, params: { top: 4, bottom: 4, left: 6, right: 6 } }
  - { command: table.properties, as: actionTable }
  - { command: caret.docEnd }
  - { command: para.spacing, params: { before: 12 } }
  - { command: format.italic, params: { value: true } }
  - { command: format.color, params: { color: "55615B" } }
  - { command: text.insert, params: { text: "Next meeting: Tuesday 1 December 2026 at 19:00 in the pavilion hut." } }
  - { command: insert.footer, params: { text: "Riverside Allotment Society · Committee minutes, 3 November 2026 · Draft until approved" } }
  - { command: layout.section, as: section }
  - { command: list.get, params: { num: $agenda.num }, as: agendaList }
  - { command: document.inspect, as: structure }
expected:
  - actual: inspect
    values:
      pages: { count: 1 }
      words: { min: 280, max: 420 }
  - actual: results
    values:
      agendaList.levels.0: { format: decimal, text: "%1.", style: Heading 2 }
      actionTable.style: MinutesActions
      section.footers.default: { exists: true }
      actionTable.look.headerRow: true
      structure.blocks: { any: { type: table, rows: 6, cols: 3 } }
diagnostics: []
since: "2026-11-09"

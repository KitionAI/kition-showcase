format: 1
id: doc/registration-form
title: Club Registration Form
summary: A one-page membership form with shaded section bands, underscore tab-leader blanks, tick boxes and an emergency-contact table.
category: Contracts & Forms
tags: [form, tab-stops, paragraph-shading, borders, table]
features: [doc.text.typing, doc.format.character, doc.format.paragraph, doc.tables.edit]
description: |
  A printable form built from paragraph formatting alone: the title band is a teal-shaded
  paragraph pair with white type, each section heading a pale band with a thick left border, and
  every write-in blank a right-aligned tab stop with an underscore leader, so two fields share a
  line and both blanks end exactly where they should. Tick boxes are the □ character from Carlito
  set a size larger. The emergency contacts go in a lightly ruled table, and the office-use box is
  a bordered, shaded paragraph group.
document: { name: registration-form.docx, width: 816, height: 1056 }
fonts:
  - carlito/Carlito-Regular.ttf
  - carlito/Carlito-Bold.ttf
  - carlito/Carlito-Italic.ttf

format: 1
id: doc/two-column-resume
title: Two-Column Resume
summary: A one-page resume built on a borderless two-column table, with a shaded sidebar for contact details, skill ratings and languages.
category: Resumes
tags: [resume, table, custom-styles, tab-stops]
features: [doc.tables.edit, doc.styles.manage, doc.format.paragraph, doc.lists.bullets-numbering]
featured: true
description: |
  The page is one table row of two cells with every border removed: the narrow left cell is
  shaded sand and holds the name, contact lines, skills rated with filled and open dots on a
  right-aligned tab stop, and languages. The wide right cell carries the profile, experience and
  education. All text is set by paragraph styles (two created with styles.create), so the cells
  hold almost no direct formatting.
document: { name: two-column-resume.docx, width: 816, height: 1056 }
fonts:
  - carlito/Carlito-Regular.ttf
  - carlito/Carlito-Bold.ttf
  - carlito/Carlito-Italic.ttf
  - lora/Lora-Variable.ttf
steps:
  - { command: review.proofing }
  - { command: design.themeFonts, params: { heading: Lora, body: Carlito } }
  - { command: layout.margins, params: { top: 36, bottom: 30, left: 36, right: 36 } }
  # Styles: headings, a role line with the dates on a right tab, and two styles of our own.
  - { command: styles.modify, params: { style: Normal, chr: { size: 10.5 }, para: { spaceAfter: 2, lineSpacing: { rule: multiple, value: 1.1 } } } }
  - { command: styles.modify, params: { style: Heading 1, chr: { size: 11.5, bold: true, caps: true, spacing: 1, color: { Rgb: [42, 111, 115] } }, para: { spaceBefore: 16, spaceAfter: 5, borders: { bottom: { style: single, width: 0.75, color: [42, 111, 115], space: 2 } } } } }
  - { command: styles.modify, params: { style: Heading 2, chr: { font: Carlito, size: 11, bold: true, color: { Rgb: [30, 41, 59] } }, para: { spaceBefore: 9, spaceAfter: 0, tabs: [ { pos: 322, align: right, leader: none } ] } } }
  - { command: styles.create, params: { name: Organisation, basedOn: Normal } }
  - { command: styles.modify, params: { style: Organisation, chr: { italic: true, color: { Rgb: [90, 100, 114] } }, para: { spaceAfter: 3 } } }
  - { command: styles.create, params: { name: Sidebar, basedOn: Normal } }
  - { command: styles.modify, params: { style: Sidebar, chr: { size: 10 }, para: { spaceAfter: 3, tabs: [ { pos: 158, align: right, leader: none } ] } } }
  - { command: styles.create, params: { name: Resume Name, basedOn: Normal } }
  - { command: styles.modify, params: { style: Resume Name, chr: { font: Lora, size: 25, bold: true, color: { Rgb: [30, 41, 59] } }, para: { spaceBefore: 12, spaceAfter: 4, lineSpacing: { rule: multiple, value: 0.92 } } } }
  - { command: styles.create, params: { name: Resume Role, basedOn: Normal } }
  - { command: styles.modify, params: { style: Resume Role, chr: { size: 13, color: { Rgb: [42, 111, 115] } }, para: { spaceAfter: 0 } } }
  # The page: one row, two cells, no borders.
  - { command: insert.table, params: { rows: 1, cols: 2 } }
  - { command: table.selectTable }
  - { command: table.borders, params: { kind: none } }
  - { command: select.collapse }
  - { command: table.cellMargins, params: { top: 12, left: 14, right: 14, bottom: 12 } }
  - { command: table.rowHeight, params: { height: 684, rule: atLeast } }
  - { command: table.columnWidth, params: { width: 186 } }
  - { command: table.shading, params: { color: "F3EEE6" } }
  # Sidebar.
  - { command: para.style, params: { style: Resume Name } }
  - { command: text.insert, params: { text: Matteo Lindqvist } }

format: 1
id: doc/service-invoice
title: Service Invoice
summary: A one-page invoice with a table letterhead, right-aligned billing details, a custom table style and a subtotal from a SUM(ABOVE) field.
category: Contracts & Forms
tags: [invoice, table, table-style, fields, header-footer]
features: [doc.text.typing, doc.format.character, doc.format.paragraph, doc.tables.edit, doc.headers.footers]
featured: true
description: |
  A restoration studio's invoice. The letterhead and the billing block are borderless two-cell
  tables; the line items use a table style made with `table.newStyle` (an ink header row, banded
  rows and a tinted total row) and fixed column widths, with every figure right-aligned. The
  subtotal is a `=SUM(ABOVE)` formula field that the kit evaluates when it is inserted; VAT and
  the total are typed. The company registration line sits in the footer.
document: { name: service-invoice.docx, width: 816, height: 1056 }
fonts:
  - carlito/Carlito-Regular.ttf
  - carlito/Carlito-Bold.ttf
  - carlito/Carlito-Italic.ttf
  - bricolage-grotesque/BricolageGrotesque-Variable.ttf

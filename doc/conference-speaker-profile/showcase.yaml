  - { command: text.newParagraph }
  - { command: para.style, params: { style: Entry Detail } }
  - { command: text.insert, params: { text: "Opening keynote to 900 delegates on budgeting for trees and canopies like roads and drains." } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Entry } }
  - { command: text.insert, params: { text: "Measuring Heat Street by Street — Open Data Summit" } }

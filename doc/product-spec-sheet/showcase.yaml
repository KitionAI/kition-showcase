format: 1
id: doc/product-spec-sheet
title: Product Spec Sheet
summary: A one-page technical data sheet with a two-column overview section and a specifications table grouped by merged, tinted rows.
category: Reports & Proposals
tags: [spec-sheet, columns, table, section-breaks, bullets]
features: [doc.layout.page-setup, doc.tables.edit, doc.lists.bullets-numbering, doc.format.character]
description: |
  The overview runs in two columns inside a continuous section, between single-column title and
  specification sections, so the page changes layout without a page break. The specifications
  table groups its rows under merged, tinted label rows (Grinding, Capacity, Size and power), with
  the property names in bold in a narrow first column.
document: { name: product-spec-sheet.docx, width: 816, height: 1056 }
fonts:
  - bricolage-grotesque/BricolageGrotesque-Variable.ttf
  - carlito/Carlito-Regular.ttf
  - carlito/Carlito-Bold.ttf
  - carlito/Carlito-Italic.ttf

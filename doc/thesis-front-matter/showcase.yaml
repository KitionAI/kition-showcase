format: 1
id: doc/thesis-front-matter
title: Thesis Title Page and Contents
summary: A master's thesis opening — a title page, front matter numbered i, ii, iii and chapters restarting at 1, with a generated table of contents.
category: Academic
tags: [thesis, table-of-contents, sections, page-numbers, title-page]
features: [doc.references.notes-toc, doc.headers.footers, doc.layout.page-setup, doc.layout.section-pages, doc.styles.manage]
description: |
  Three sections carry the thesis conventions. The title page is centred vertically and has no
  footer; the front matter (abstract and contents) counts in lower-case roman numerals; the body
  restarts at arabic 1. The table of contents is a real TOC field built from the Heading 1 and
  Heading 2 paragraphs and refreshed once the chapters are written, so its page numbers are the
  arabic ones of the third section. The thumbnail shows the contents page.
document: { name: thesis-front-matter.docx, width: 816, height: 1056 }
fonts:
  - caladea/Caladea-Regular.ttf
  - caladea/Caladea-Bold.ttf
  - caladea/Caladea-Italic.ttf
  - caladea/Caladea-BoldItalic.ttf
steps:
  - { command: review.proofing, as: proofing }
  - { command: design.themeFonts, params: { heading: Caladea, body: Caladea } }
  - { command: styles.modify, params: { style: Normal, chr: { size: 12 }, para: { align: justify, spaceBefore: 0, spaceAfter: 8, lineSpacing: { rule: multiple, value: 1.5 } } } }
  - { command: styles.modify, params: { style: Heading 1, chr: { size: 20, bold: true, color: { Rgb: [26, 43, 74] } }, para: { align: left, spaceBefore: 0, spaceAfter: 18, pageBreakBefore: true, lineSpacing: { rule: multiple, value: 1.0 } } } }
  - { command: styles.modify, params: { style: Heading 2, chr: { size: 14, bold: true, color: { Rgb: [26, 43, 74] } }, para: { align: left, spaceBefore: 14, spaceAfter: 6 } } }
  - { command: styles.modify, params: { style: TOC Heading, chr: { size: 20, bold: true, color: { Rgb: [26, 43, 74] } }, para: { spaceBefore: 0, spaceAfter: 24, pageBreakBefore: false } } }
  - { command: styles.modify, params: { style: TOC 1, chr: { bold: true, size: 12 }, para: { spaceBefore: 10, spaceAfter: 2, lineSpacing: { rule: multiple, value: 1.0 } } } }
  - { command: styles.modify, params: { style: TOC 2, chr: { size: 12 }, para: { indentLeft: 22, spaceAfter: 2, lineSpacing: { rule: multiple, value: 1.0 } } } }
  - { command: styles.create, params: { name: Title Page, basedOn: Normal } }
  - { command: styles.modify, params: { style: Title Page, chr: { size: 13 }, para: { align: center, spaceAfter: 2, lineSpacing: { rule: multiple, value: 1.15 } } } }
  - { command: styles.create, params: { name: Institution, basedOn: Title Page } }
  - { command: styles.modify, params: { style: Institution, chr: { smallCaps: true, spacing: 0.6 } } }
  - { command: styles.create, params: { name: Thesis Title, basedOn: Title Page } }
  - { command: styles.modify, params: { style: Thesis Title, chr: { size: 26, bold: true, color: { Rgb: [26, 43, 74] } }, para: { spaceBefore: 150, spaceAfter: 16 } } }
  - { command: styles.create, params: { name: Thesis Subtitle, basedOn: Title Page } }
  - { command: styles.modify, params: { style: Thesis Subtitle, chr: { size: 15, italic: true } } }
  - { command: styles.create, params: { name: Title Page Gap, basedOn: Title Page } }
  - { command: styles.modify, params: { style: Title Page Gap, para: { spaceBefore: 90 } } }
  - { command: styles.create, params: { name: Thesis Author, basedOn: Title Page Gap } }
  - { command: styles.modify, params: { style: Thesis Author, chr: { bold: true, size: 14 }, para: { spaceBefore: 150 } } }
  - { command: styles.create, params: { name: Front Heading, basedOn: Normal } }
  - { command: styles.modify, params: { style: Front Heading, chr: { size: 20, bold: true, color: { Rgb: [26, 43, 74] } }, para: { align: left, spaceAfter: 24, lineSpacing: { rule: multiple, value: 1.0 } } } }
  # Section 1: the title page, no footer
  - { command: layout.pageSetup, params: { section: { marginTop: 72, marginBottom: 72, marginLeft: 90, marginRight: 72 } }, as: centred }
  - { command: para.style, params: { style: Institution } }
  - { command: text.insert, params: { text: "Westharbour Institute of Technology" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "School of Civil and Coastal Engineering" } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Thesis Title } }
  - { command: text.insert, params: { text: "Scour Around Timber Piles" } }
  - { command: text.lineBreak }
  - { command: text.insert, params: { text: "in Tidal Estuaries" } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Thesis Subtitle } }
  - { command: text.insert, params: { text: "Field measurements and a revised design method for small harbours" } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Title Page Gap } }
  - { command: text.insert, params: { text: "A thesis submitted in partial fulfilment of the requirements for the degree of" } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Title Page } }
  - { command: text.insert, params: { text: "Master of Science in Coastal Engineering" } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Thesis Author } }
  - { command: text.insert, params: { text: "Elin Marrow" } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Title Page } }
  - { command: text.insert, params: { text: "Supervised by Dr. Ansel Brookfield" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "November 2026" } }
  # Section 2: front matter, numbered i, ii, iii
  - { command: layout.break, params: { kind: nextPage } }
  - { command: layout.pageSetup, params: { section: { valign: top, start: nextPage, marginTop: 72, marginBottom: 72, marginLeft: 90, marginRight: 72 } }, as: frontTop }
  - { command: layout.pageNumberFormat, params: { format: lowerRoman, start: 1 }, as: roman }
  - { command: insert.footer, params: { preset: pageNumber }, as: footer }
  - { command: insert.closeHeader }
  - { command: caret.docEnd }
  - { command: para.style, params: { style: Front Heading } }
  - { command: text.insert, params: { text: "Abstract" } }
  - { command: text.newParagraph }
  - { command: para.normal }
  - { command: text.insert, params: { text: "Timber piles still carry most small-harbour jetties, yet their scour protection is designed with rules derived from bridge piers in rivers. This thesis reports eighteen months of sonar surveys around 46 piles in three estuaries, where the flow reverses twice a day. Scour holes were shallower but wider than river formulas predict, and grew mostly during spring tides that coincided with high river discharge." } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "A revised method is proposed that sizes rock aprons from the combined tidal and river velocity rather than the peak tidal velocity alone. Applied to the three study sites it would have reduced the volume of rock placed by about a third without increasing the measured scour depth." } }
  - { command: text.newParagraph }
  - { command: text.pageBreak }
  - { command: references.toc, params: { levels: 2, title: Contents }, as: toc }
  # Section 3: the body, numbered from 1
  - { command: caret.docEnd }
  - { command: layout.break, params: { kind: nextPage } }
  - { command: layout.pageNumberFormat, params: { format: decimal, start: 1 }, as: arabic }
  - { command: para.heading1 }
  - { command: text.insert, params: { text: "1  Introduction" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Small harbours depend on timber jetties that are cheap to build and easy to repair, but the sediment around their piles moves with every tide." } }
  - { command: text.newParagraph }
  - { command: para.heading2 }
  - { command: text.insert, params: { text: "1.1  Background" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Design guidance for scour protection was written for bridge piers in rivers, where the flow runs one way." } }
  - { command: text.newParagraph }
  - { command: para.heading2 }
  - { command: text.insert, params: { text: "1.2  Aims of the study" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "The study measures scour around working piles and tests whether a combined velocity explains it better." } }
  - { command: text.newParagraph }
  - { command: para.heading1 }
  - { command: text.insert, params: { text: "2  Study Sites and Methods" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Three estuaries with different tidal ranges and river flows were chosen." } }
  - { command: text.newParagraph }
  - { command: para.heading2 }
  - { command: text.insert, params: { text: "2.1  The three estuaries" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Each site has a jetty of between eight and twenty piles in water two to five metres deep." } }
  - { command: text.newParagraph }
  - { command: para.heading2 }
  - { command: text.insert, params: { text: "2.2  Sonar surveys" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "A small multibeam sonar was run around every pile at slack water each fortnight." } }
  - { command: text.newParagraph }
  - { command: para.heading1 }
  - { command: text.insert, params: { text: "3  Results" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Scour holes reached their deepest after spring tides with high river discharge." } }
  - { command: text.newParagraph }
  - { command: para.heading2 }
  - { command: text.insert, params: { text: "3.1  Depth and width of scour" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Holes were on average 0.6 pile diameters deep and 3.1 diameters wide." } }
  - { command: text.newParagraph }
  - { command: para.heading2 }
  - { command: text.insert, params: { text: "3.2  Timing of scour events" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Four in five deepening events followed a spring tide within three days of a river flood peak." } }
  - { command: text.newParagraph }
  - { command: para.heading2 }
  - { command: text.insert, params: { text: "3.3  Recovery between events" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Holes refilled by about half during neap tides, faster at the muddier upstream site." } }
  - { command: text.newParagraph }
  - { command: para.heading1 }
  - { command: text.insert, params: { text: "4  A Revised Design Method" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "The apron is sized from the combined velocity of the tide and the river." } }
  - { command: text.newParagraph }
  - { command: para.heading2 }
  - { command: text.insert, params: { text: "4.1  Combined design velocity" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "River and tidal velocities are added at the pile and taken at a one-in-fifty-year return period." } }
  - { command: text.newParagraph }
  - { command: para.heading2 }
  - { command: text.insert, params: { text: "4.2  Sizing the rock apron" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "The apron extends two and a half diameters from the pile, with rock graded to the design velocity." } }
  - { command: text.newParagraph }
  - { command: para.heading2 }
  - { command: text.insert, params: { text: "4.3  Worked example" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "A twelve-pile jetty at the upstream site is redesigned with the method, saving 38 tonnes of rock." } }
  - { command: text.newParagraph }
  - { command: para.heading1 }
  - { command: text.insert, params: { text: "5  Conclusions" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Tidal estuaries need their own scour rules, and the data collected here are a first step towards them." } }
  - { command: text.newParagraph }
  - { command: para.heading2 }
  - { command: text.insert, params: { text: "5.1  Recommendations for practice" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Survey new jetties after their first winter and size repairs from the measured holes." } }
  - { command: text.newParagraph }
  - { command: para.heading2 }
  - { command: text.insert, params: { text: "5.2  Further work" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Longer records are needed to capture rare floods that coincide with the largest tides." } }
  - { command: text.newParagraph }
  - { command: para.heading1 }
  - { command: text.insert, params: { text: "References" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "The reference list is kept with the full thesis." } }
  - { command: text.newParagraph }
  - { command: para.heading1 }
  - { command: text.insert, params: { text: "Appendix A  Survey Records" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Pile-by-pile sonar depths for every survey are tabulated here." } }
  - { command: references.updateToc, as: updated }
expected:
  - actual: inspect
    values:
      pages: { count: 10 }
  - actual: results
    values:
      roman.pageNumFormat: lowerRoman
      roman.pageNumStart: 1
      arabic.pageNumFormat: decimal
      arabic.pageNumStart: 1
      centred.marginLeft: 90
      frontTop.valign: top
diagnostics: []
thumbnail: { area: $inspect.pages.2.area }
since: "2026-11-09"

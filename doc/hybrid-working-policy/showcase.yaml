format: 1
id: doc/hybrid-working-policy
title: Hybrid Working Policy
summary: A two-page staff policy whose sections and clauses are numbered 1, 1.1 and 1.1.1 by one multilevel list linked to paragraph styles.
category: Reports & Proposals
tags: [policy, multilevel-list, numbered-headings, table, page-numbers]
features: [doc.lists.bullets-numbering, doc.styles.manage, doc.tables.edit, doc.headers.footers]
description: |
  One list definition numbers the whole policy: level 1 is linked to Heading 1, level 2 to a custom
  Clause style and level 3 to a Sub-clause style, so writing a paragraph in a style is all it takes
  to number it, and the numbers stay right when clauses move. A small document-control table sits
  under the title, and the footer counts pages as "Page x of y".
document: { name: hybrid-working-policy.docx, width: 816, height: 1056 }
fonts:
  - tinos/Tinos-Regular.ttf
  - tinos/Tinos-Bold.ttf
  - arimo/Arimo-Variable.ttf
steps:
  - { command: review.proofing }
  - { command: design.themeFonts, params: { heading: Arimo, body: Tinos } }
  - { command: styles.modify, params: { style: Normal, chr: { size: 10.5 }, para: { spaceAfter: 6, lineSpacing: { rule: multiple, value: 1.12 } } } }
  - { command: styles.modify, params: { style: Title, chr: { font: Arimo, size: 22, bold: true, spacing: -0.3, color: { Rgb: [122, 30, 52] } }, para: { spaceAfter: 4 } } }
  - { command: styles.modify, params: { style: Heading 1, chr: { font: Arimo, size: 12, bold: true, color: { Rgb: [122, 30, 52] } }, para: { spaceBefore: 14, spaceAfter: 6, keepNext: true } } }
  - { command: styles.create, params: { name: Clause, basedOn: Normal } }
  - { command: styles.modify, params: { style: Clause, para: { align: justify } } }
  - { command: styles.create, params: { name: Sub-clause, basedOn: Normal } }
  - { command: styles.modify, params: { style: Sub-clause, para: { align: justify, spaceAfter: 4 } } }
  - { command: layout.margins, params: { top: 72, bottom: 72, left: 80, right: 80 } }
  - { command: para.style, params: { style: Title } }
  - { command: text.insert, params: { text: Hybrid Working Policy } }
  - { command: text.newParagraph }
  - { command: para.spacing, params: { after: 10 } }
  - { command: format.color, params: { color: "5B5B66" } }
  - { command: text.insert, params: { text: "Harbourline Housing Association · Human Resources · Policy HR-14" } }
  - { command: text.newParagraph }
  - { command: format.color, params: { color: auto } }
  - { command: para.spacing, params: { after: 6 } }
  # Document control.
  - { command: insert.table, params: { rows: 2, cols: 4 } }
  - { command: table.selectTable }
  - { command: table.borders, params: { kind: all, width: 0.5, color: "C9B8BE" } }
  - { command: para.spacing, params: { before: 0, after: 0 } }
  - { command: format.set, params: { props: { size: 9 } } }
  - { command: select.collapse }
  - { command: table.selectRow }
  - { command: table.shading, params: { color: "F4ECEE" } }
  - { command: format.bold, params: { value: true } }
  - { command: select.collapse }
  - { command: table.cellMargins, params: { top: 3, bottom: 3, left: 6, right: 6 } }
  - { command: text.insert, params: { text: Version } }
  - { command: text.tab }
  - { command: text.insert, params: { text: Owner } }
  - { command: text.tab }
  - { command: text.insert, params: { text: Approved } }
  - { command: text.tab }
  - { command: text.insert, params: { text: Next review } }
  - { command: text.tab }
  - { command: text.insert, params: { text: "3.0" } }
  - { command: text.tab }
  - { command: text.insert, params: { text: Head of People } }
  - { command: text.tab }
  - { command: text.insert, params: { text: "Board, 4 November 2026" } }
  - { command: text.tab }
  - { command: text.insert, params: { text: November 2027 } }
  - { command: table.properties, as: control }
  - { command: caret.docEnd }
  # One list numbers headings, clauses and sub-clauses.
  - { command: para.style, params: { style: Heading 1 } }
  - { command: list.define, params: { name: Policy numbering, levels: [ { format: decimal, text: "%1.", style: Heading 1, alignedAt: 0, indentAt: 30 }, { format: decimal, text: "%1.%2", style: Clause, alignedAt: 0, indentAt: 30 }, { format: decimal, text: "%1.%2.%3", style: Sub-clause, alignedAt: 30, indentAt: 68 } ] }, as: numbering }
  - { command: text.insert, params: { text: Purpose and scope } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Clause } }
  - { command: text.insert, params: { text: "This policy explains how colleagues can split their working week between the office, our housing estates and home, and what the Association and colleagues can expect of each other." } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "It applies to all employees whose role can be carried out away from a fixed workplace for part of the week. It does not apply to caretaking, repairs or concierge roles, which are covered by their own rotas." } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Heading 1 } }
  - { command: text.insert, params: { text: Working pattern } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Clause } }
  - { command: text.insert, params: { text: "Colleagues normally spend at least two days a week at an Association office or on an estate. Teams agree an anchor day when everyone is in, so that meetings, coaching and induction happen in person." } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Managers agree each colleague's pattern in writing and review it at least once a year, taking account of:" } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Sub-clause } }
  - { command: text.insert, params: { text: "the needs of residents and of the service the team provides;" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "the colleague's caring responsibilities, health and travel to work; and" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "the induction and development needs of newer members of the team." } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Clause } }
  - { command: text.insert, params: { text: "A colleague may ask to change their pattern at any time. Requests are answered within twenty-eight days, and a refusal is always explained in writing." } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Heading 1 } }
  - { command: text.insert, params: { text: Working from home } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Clause } }
  - { command: text.insert, params: { text: "Before working from home regularly, colleagues complete the online workstation assessment. The Association provides a laptop, a monitor, a headset and, where the assessment shows a need, a chair." } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Residents' personal information must be handled with the same care at home as in the office. In particular:" } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Sub-clause } }
  - { command: text.insert, params: { text: "screens are locked whenever they are left unattended;" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "calls about residents' cases are taken where they cannot be overheard; and" } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "paper records are not taken home unless a manager has agreed it in advance." } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Clause } }
  - { command: text.insert, params: { text: "A home-working allowance of £26 a month is paid to colleagues who work from home for at least one day a week, to help with heating and electricity." } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Heading 1 } }
  - { command: text.insert, params: { text: Wellbeing and keeping in touch } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Clause } }
  - { command: text.insert, params: { text: "Managers hold a one-to-one with each colleague at least monthly, in person where possible. Colleagues are not expected to answer messages outside their working hours." } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "Anyone who finds that hybrid working is affecting their health or wellbeing should talk to their manager or to the confidential employee assistance line, which is open at all hours." } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Heading 1 } }
  - { command: text.insert, params: { text: Review } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Clause } }
  - { command: text.insert, params: { text: "The Head of People reviews this policy every year with the staff forum and the recognised trade union, and reports any changes to the Board." } }
  - { command: list.get, as: list }
  # Running header and footer.
  - { command: insert.editHeader }
  - { command: para.alignRight }
  - { command: format.set, params: { props: { font: Arimo, size: 8, bold: false, italic: false } } }
  - { command: format.color, params: { color: "7A1E34" } }
  - { command: text.insert, params: { text: "HR-14 · Hybrid Working Policy · Version 3.0" } }
  - { command: insert.closeHeader }
  - { command: insert.pageNumber, params: { position: bottom, align: center, format: "x of y" } }
  - { command: insert.closeHeader }
  - { command: layout.section, as: section }
expected:
  - actual: inspect
    values:
      pages: { count: 2 }
      words: { min: 380, max: 460 }
  - actual: results
    values:
      list.levels.0.text: "%1."
      list.levels.1: { text: "%1.%2", style: Clause }
      list.levels.2: { text: "%1.%2.%3", style: Sub-clause }
      control.style: { exists: true }
      section.footers.default: { exists: true }
diagnostics: []
since: "2026-11-09"

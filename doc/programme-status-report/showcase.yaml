format: 1
id: doc/programme-status-report
title: Programme Status Report
summary: A landscape status report whose wide table gives each workstream a red, amber or green status cell, with a summary and key decisions above it.
category: Reports & Proposals
tags: [report, landscape, table, status, header-footer]
features: [doc.layout.page-setup, doc.tables.edit, doc.format.character, doc.headers.footers]
description: |
  The page is turned to landscape so the seven-column table fits without wrapping every cell. Each
  column gets its own width, the header row repeats if the table runs over a page, and the status
  cells are shaded and coloured by hand for red, amber and green. Above the table, a short summary
  and two decisions for the steering group; the running header names the programme and the period.
document: { name: programme-status-report.docx, width: 1056, height: 816 }
fonts:
  - inter/Inter-Variable.ttf
  - carlito/Carlito-Regular.ttf
  - carlito/Carlito-Bold.ttf
  - carlito/Carlito-Italic.ttf

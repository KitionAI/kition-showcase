format: 1
id: doc/charity-impact-report
title: Charity Impact Report
summary: A one-page annual impact summary with a drop-cap opening, a pull quote, headline figures and a doughnut chart of where each pound went.
category: Reports & Proposals
tags: [report, chart, drop-cap, pull-quote, table]
features: [doc.drawing.objects, doc.insert.objects, doc.format.paragraph, doc.tables.edit]
description: |
  The opening paragraph starts with a three-line drop cap in the heading font. The volunteer's words
  are a pull quote: a paragraph with a thick left border, an indent and larger italic type. Three
  headline figures share a borderless table, and a native doughnut chart shows how the year's
  spending divides. Charts cannot carry alternative text yet, so the check names
  `doc.missing-alt-text`.
document: { name: charity-impact-report.docx, width: 816, height: 1056 }
fonts:
  - lora/Lora-Variable.ttf
  - carlito/Carlito-Regular.ttf
  - carlito/Carlito-Bold.ttf
  - carlito/Carlito-Italic.ttf
steps:
  - { command: review.proofing }
  - { command: design.themeFonts, params: { heading: Lora, body: Carlito } }
  - { command: layout.margins, params: { top: 60, bottom: 54, left: 66, right: 66 } }
  - { command: styles.modify, params: { style: Normal, chr: { size: 11 }, para: { spaceAfter: 6, lineSpacing: { rule: multiple, value: 1.15 } } } }
  - { command: styles.modify, params: { style: Title, chr: { font: Lora, size: 28, color: { Rgb: [20, 83, 75] } }, para: { spaceAfter: 2 } } }
  - { command: styles.modify, params: { style: Heading 1, chr: { font: Lora, size: 15, color: { Rgb: [20, 83, 75] } }, para: { spaceBefore: 14, spaceAfter: 6 } } }
  - { command: styles.create, params: { name: Figure Value, basedOn: Normal } }
  - { command: styles.modify, params: { style: Figure Value, chr: { font: Lora, size: 26, bold: true, color: { Rgb: [214, 104, 64] } }, para: { align: center, spaceAfter: 0, lineSpacing: { rule: multiple, value: 1 } } } }
  - { command: styles.create, params: { name: Figure Label, basedOn: Normal } }
  - { command: styles.modify, params: { style: Figure Label, chr: { size: 9.5, color: { Rgb: [70, 80, 80] } }, para: { align: center, spaceAfter: 0, lineSpacing: { rule: multiple, value: 1 } } } }
  # Creating a style applies it to the caret's paragraph, as Word does: go back to Normal.
  - { command: para.style, params: { style: Normal } }
  - { command: format.set, params: { props: { size: 9, bold: true, spacing: 2 } } }
  - { command: format.color, params: { color: "D66840" } }
  - { command: text.insert, params: { text: "IMPACT REPORT 2025–26" } }
  - { command: text.newParagraph }
  - { command: format.set, params: { props: { size: 11, bold: false, spacing: 0 } } }
  - { command: format.color, params: { color: auto } }
  - { command: para.style, params: { style: Title } }
  - { command: text.insert, params: { text: A year at Brightwater Food Hub } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "When we opened the hub in a borrowed church hall four years ago, we hoped to feed forty families a week. This year more than four hundred households came through our doors, and for the first time most of them left with fresh fruit and vegetables as well as tins. None of it would have been possible without 212 volunteers, three supermarkets, eleven allotment holders and the donors who kept the lights on through a hard winter." } }
  - { command: text.newParagraph }
  - { command: insert.table, params: { rows: 1, cols: 3 } }
  - { command: table.selectTable }
  - { command: table.borders, params: { kind: none } }
  - { command: table.borders, params: { kind: inside, width: 0.75, color: "E5D9D2" } }
  - { command: select.collapse }
  - { command: table.cellMargins, params: { top: 6, bottom: 6, left: 6, right: 6 } }
  - { command: para.style, params: { style: Figure Value } }
  - { command: text.insert, params: { text: "61,400" } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Figure Label } }
  - { command: text.insert, params: { text: meals' worth of food shared } }
  - { command: text.tab }
  - { command: para.style, params: { style: Figure Value } }
  - { command: text.insert, params: { text: "418" } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Figure Label } }
  - { command: text.insert, params: { text: households supported each week } }
  - { command: text.tab }
  - { command: para.style, params: { style: Figure Value } }
  - { command: text.insert, params: { text: "9.8 t" } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Figure Label } }
  - { command: text.insert, params: { text: of surplus food saved from waste } }
  - { command: table.properties, as: figures }
  - { command: caret.docEnd }
  - { command: para.style, params: { style: Heading 1 } }
  - { command: text.insert, params: { text: Where each pound went } }
  - { command: text.newParagraph }
  - { command: drawing.insert, params: { kind: chart, frame: { w: 480, h: 210 }, chart: { kind: doughnut, categories: [Food purchasing 46%, Hall rent and utilities 18%, Delivery van 14%, Cookery classes 12%, Running costs 10%], series: [ { name: Spending, values: [46, 18, 14, 12, 10] } ], legend: right, dataLabels: false, title: null } }, as: chart }
  - { command: caret.end }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Normal } }
  - { command: para.indents, params: { left: 24, right: 24 } }
  - { command: para.borders, params: { sides: { left: { style: single, width: 3, color: "D66840" } } } }
  - { command: para.spacing, params: { before: 10, after: 10 } }
  - { command: format.set, params: { props: { font: Lora, size: 13, italic: true } } }
  - { command: format.color, params: { color: "14534B" } }
  - { command: text.insert, params: { text: "“I came for a food parcel when my hours were cut. Now I run the Thursday cookery class, and three of the people in it have gone on to work in kitchens.”" } }
  - { command: text.lineBreak }
  - { command: format.set, params: { props: { font: Carlito, size: 10, italic: false } } }
  - { command: format.color, params: { color: "5A6464" } }
  - { command: text.insert, params: { text: "— Marisol, volunteer since 2023" } }
  - { command: text.newParagraph }
  - { command: para.borders, params: { kind: none } }
  - { command: para.indents, params: { left: 0, right: 0 } }
  - { command: para.spacing, params: { before: 0, after: 6 } }
  - { command: format.set, params: { props: { size: 11 } } }
  - { command: format.color, params: { color: auto } }
  - { command: text.insert, params: { text: "Next year we will open a second hub in Lowfield and start a holiday lunch club, so that no child in our area goes hungry when school is out. Registered charity no. 1190000." } }
  # The drop cap goes on last: Enter would carry it into the paragraphs that follow.
  - { command: edit.goto, params: { paragraph: 2 } }
  - { command: insert.dropCap, params: { lines: 3 } }
  - { command: caret.right, params: { extend: true } }
  - { command: format.font, params: { name: Lora } }
  - { command: format.color, params: { color: "14534B" } }
  - { command: document.paragraph, params: { path: [2] }, as: opening }
expected:
  - actual: inspect
    values:
      pages: { count: 1 }
      words: { min: 160, max: 240 }
  - actual: results
    values:
      chart.id: { exists: true }
      figures.cell.borders: null
      opening.paragraph.props.dropCap: 3
diagnostics: [doc.missing-alt-text]
since: "2026-11-09"

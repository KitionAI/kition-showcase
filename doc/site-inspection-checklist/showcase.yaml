format: 1
id: doc/site-inspection-checklist
title: Site Inspection Checklist
summary: A one-page pre-handover checklist with merged, shaded group rows, tick-box columns and a sign-off block.
category: Contracts & Forms
tags: [form, checklist, table, merge-cells, tab-stops]
features: [doc.text.typing, doc.format.character, doc.format.paragraph, doc.tables.edit, doc.headers.footers]
description: |
  A builder's quality form set in Arimo. A ruled 2 × 4 table holds the project details with
  shaded label cells; the checklist table has fixed column widths, a dark header row, and one row
  per group merged across all six columns with `table.selectRow` and `table.merge`, then shaded.
  The Pass, Fail and N/A columns carry centred □ boxes, and the sign-off lines are underscore tab
  leaders ending exactly at the right margin.
document: { name: site-inspection-checklist.docx, width: 816, height: 1056 }
fonts:
  - arimo/Arimo-Variable.ttf
  - arimo/Arimo-Italic-Variable.ttf
steps:
  # Proper names would otherwise carry spelling squiggles into the render.
  - { command: review.proofing }
  - { command: design.themeFonts, params: { heading: Arimo, body: Arimo } }

format: 1
id: doc/academic-cv
title: Academic CV
summary: A two-page academic curriculum vitae in a serif face, with dated entries on hanging indents, a numbered publication list and page numbers.
category: Resumes
tags: [resume, academic, numbering, tab-stops, header-footer]
features: [doc.text.typing, doc.styles.manage, doc.lists.bullets-numbering, doc.format.paragraph, doc.headers.footers]
description: |
  A paragraph style of our own, Dated Entry, hangs every appointment, degree and grant off a
  90-point tab, so the years line up in a column and the text wraps clear of them. Grant amounts
  sit on a right tab with a dot leader. Publications are a list defined with list.define as
  bracketed numbers, journal titles in italics. The footer carries the name and "Page x of y".
document: { name: academic-cv.docx, width: 816, height: 1056 }
fonts:
  - tinos/Tinos-Regular.ttf
  - tinos/Tinos-Bold.ttf
  - tinos/Tinos-Italic.ttf
  - tinos/Tinos-BoldItalic.ttf
steps:
  - { command: review.proofing }
  - { command: design.themeFonts, params: { heading: Tinos, body: Tinos } }
  - { command: layout.margins, params: { top: 64, bottom: 64, left: 72, right: 72 } }
  - { command: styles.modify, params: { style: Normal, chr: { size: 11 }, para: { spaceAfter: 4, lineSpacing: { rule: multiple, value: 1.08 } } } }
  - { command: styles.modify, params: { style: Heading 1, chr: { size: 12, bold: true, smallCaps: true, spacing: 0.5, color: { Rgb: [92, 26, 27] } }, para: { spaceBefore: 16, spaceAfter: 6, borders: { bottom: { style: single, width: 0.5, color: [92, 26, 27], space: 1 } } } } }
  - { command: styles.create, params: { name: Dated Entry, basedOn: Normal } }
  - { command: styles.modify, params: { style: Dated Entry, para: { indentLeft: 90, indentFirst: -90, spaceAfter: 4, tabs: [ { pos: 90, align: left, leader: none } ] } } }
  - { command: styles.create, params: { name: Grant Entry, basedOn: Dated Entry } }
  - { command: styles.modify, params: { style: Grant Entry, para: { tabs: [ { pos: 90, align: left, leader: none }, { pos: 468, align: right, leader: dot } ] } } }
  - { command: styles.create, params: { name: CV Name, basedOn: Normal } }
  - { command: styles.modify, params: { style: CV Name, chr: { size: 24, bold: false, smallCaps: true, spacing: 1.5 }, para: { align: center, spaceAfter: 2 } } }
  - { command: styles.create, params: { name: CV Address, basedOn: Normal } }
  - { command: styles.modify, params: { style: CV Address, chr: { size: 10.5, color: { Rgb: [80, 80, 80] } }, para: { align: center, spaceAfter: 0 } } }

format: 1
id: doc/poetry-chapbook-page
title: Poetry Chapbook Page
summary: A page from a small-format poetry chapbook — a 5½ × 8½ inch page inside a double border, centred italic title and epigraph, stanzas set with line breaks and a folio that starts at 7.
category: Newsletters & Layout
tags: [poetry, page-border, custom-page-size, page-numbers, typography]
features: [doc.design.page, doc.layout.page-setup, doc.headers.footers, doc.styles.manage, doc.format.paragraph]
description: |
  A half-letter page, as chapbooks are folded from Letter sheets, with a thin double page
  border. Each stanza is one paragraph whose lines are separated by line breaks, so the stanza
  keeps its spacing as a unit; the stanzas are indented as a block rather than centred line by
  line, the way poems are printed. The title and epigraph are centred in Lora italic, and the
  section's page numbers start at 7, as if the poem sat in the middle of the booklet.
document: { name: poetry-chapbook-page.docx, width: 528, height: 816 }
fonts:
  - lora/Lora-Variable.ttf
  - caladea/Caladea-Regular.ttf
  - caladea/Caladea-Italic.ttf
steps:
  - { command: review.proofing, as: proofing }
  - { command: layout.size, params: { width: 396, height: 612 }, as: page }
  - { command: layout.margins, params: { top: 70, bottom: 60, left: 54, right: 54 } }
  - { command: design.themeFonts, params: { heading: Lora, body: Caladea } }
  - { command: design.pageBorders, params: { kind: box, width: 2.25, color: "6B5B4B", style: double }, as: border }
  - { command: layout.pageNumberFormat, params: { format: decimal, start: 7 }, as: numbering }
  - { command: insert.pageNumber, params: { position: bottom, align: center }, as: folio }
  - { command: insert.closeHeader }
  - { command: styles.modify, params: { style: Normal, chr: { size: 11, color: { Rgb: [40, 34, 30] } }, para: { align: left, spaceBefore: 0, spaceAfter: 14, indentLeft: 18, lineSpacing: { rule: multiple, value: 1.3 } } } }
  - { command: styles.modify, params: { style: Title, chr: { font: Lora, size: 22, italic: true, color: { Rgb: [107, 91, 75] } }, para: { align: center, indentLeft: 0, spaceBefore: 30, spaceAfter: 10 } } }
  - { command: styles.create, params: { name: Epigraph, basedOn: Normal } }
  - { command: styles.modify, params: { style: Epigraph, chr: { size: 9.5, italic: true, color: { Rgb: [110, 98, 88] } }, para: { align: center, indentLeft: 0, spaceAfter: 30 } } }
  - { command: styles.create, params: { name: Ornament, basedOn: Normal } }
  - { command: styles.modify, params: { style: Ornament, chr: { size: 12, color: { Rgb: [107, 91, 75] } }, para: { align: center, indentLeft: 0, spaceBefore: 6, spaceAfter: 0 } } }
  - { command: para.style, params: { style: Title } }
  - { command: text.insert, params: { text: "Counting Gulls" } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Epigraph } }
  - { command: text.insert, params: { text: "for M., who taught me the weather" } }
  - { command: text.newParagraph }
  - { command: para.normal }
  - { command: text.insert, params: { text: "The harbour keeps its lamps on after dark" } }
  - { command: text.lineBreak }
  - { command: text.insert, params: { text: "for boats that are not coming in tonight;" } }
  - { command: text.lineBreak }
  - { command: text.insert, params: { text: "the water folds them into narrow arcs" } }
  - { command: text.lineBreak }
  - { command: text.insert, params: { text: "and hands them back, a little less than bright." } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "My mother counted gulls along the rail" } }
  - { command: text.lineBreak }
  - { command: text.insert, params: { text: "as if the number told her what to fear;" } }
  - { command: text.lineBreak }
  - { command: text.insert, params: { text: "eleven meant a wind, and twelve a gale," } }
  - { command: text.lineBreak }
  - { command: text.insert, params: { text: "and thirteen meant that someone she loved was near." } }
  - { command: text.newParagraph }
  - { command: text.insert, params: { text: "I count them now. The numbers never hold." } }
  - { command: text.lineBreak }
  - { command: text.insert, params: { text: "The tide goes out the way it always goes." } }
  - { command: text.lineBreak }
  - { command: text.insert, params: { text: "But still I stand there, hands against the cold," } }
  - { command: text.lineBreak }
  - { command: text.insert, params: { text: "and wait for what the thirteenth gull will know." } }
  - { command: text.newParagraph }
  - { command: para.style, params: { style: Ornament } }
  - { command: text.insert, params: { text: "❧" } }
  - { command: document.inspect, as: structure }
expected:
  - actual: inspect
    values:
      pages: { count: 1 }
      pages.0.area: { width: 396, height: 612 }
  - actual: results
    values:
      numbering.pageNumStart: 7
      numbering.pageBorders.top: { style: double }
      structure.blocks: { count: 6 }
diagnostics: []
since: "2026-11-09"

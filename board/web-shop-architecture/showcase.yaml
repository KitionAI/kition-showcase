title: Web Shop Architecture
summary: A system diagram of an online shop, with clients, a gateway, services and their data stores inside a private network frame.
category: Diagrams & Flows
tags: [architecture, connectors, frames]
features: [board.elements, board.connectors, board.frames]
description: |
  Services, databases (ellipses) and the event queue (a hexagon) sit inside a frame for the private
  network; clients, the CDN and the card network stay outside. Elbow connectors bound to the nodes
  carry the protocol labels.

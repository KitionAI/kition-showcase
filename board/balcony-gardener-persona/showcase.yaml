format: 1
id: board/balcony-gardener-persona
title: Balcony Gardener Persona
summary: A user persona board with an avatar, a quote, trait chips, goal and frustration notes and habit sliders.
category: Brainstorming
tags: [persona, ux-research, sticky-notes, frames]
features: [board.elements, board.frames]
description: |
  A research persona laid out in four frames: the profile with an initials avatar, the name in bold
  and a quote in italic (`text.mark`), goals and frustrations as sticky notes, and habits drawn as
  slider tracks from rounded rectangles.
document: { name: balcony-gardener-persona.kboard, width: 1920, height: 1080 }
fonts: [inter/Inter-Variable.ttf]
steps:
  - {"command": "element.create", "params": {"elements": [{"kind": "text", "position": [40, 40], "text": "Persona: the balcony gardener", "fontSize": 44, "strokeColor": "ink"}, {"kind": "text", "position": [42, 110], "text": "Plant-care app research, built from twelve interviews.", "fontSize": 20, "strokeColor": "gray"}]}, "as": "heading"}

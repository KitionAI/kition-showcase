  - {"command": "element.create", "params": {"elements": [{"kind": "shape", "shapeType": "ellipse", "parent": "$f.created.0", "position": [170, 230], "size": [200, 200], "text": "MT", "fillColor": "#5645d4", "fillStyle": "solid", "strokeColor": "white", "fontSize": 64}, {"kind": "text", "parent": "$f.created.0", "position": [80, 460], "text": "Mei Tanaka", "fontSize": 36, "strokeColor": "ink"}, {"kind": "text", "parent": "$f.created.0", "position": [80, 512], "text": "34, night-shift nurse, rents a flat\nwith a south-facing balcony", "fontSize": 19, "strokeColor": "gray"}, {"kind": "shape", "shapeType": "pill", "parent": "$f.created.0", "position": [80, 590], "size": [136, 38], "text": "Busy shifts", "fillColor": "purple", "fillStyle": "solid", "strokeColor": "purple", "fontSize": 15}, {"kind": "shape", "shapeType": "pill", "parent": "$f.created.0", "position": [230, 590], "size": [190, 38], "text": "Learns from video", "fillColor": "blue", "fillStyle": "solid", "strokeColor": "blue", "fontSize": 15}, {"kind": "shape", "shapeType": "pill", "parent": "$f.created.0", "position": [80, 638], "size": [170, 38], "text": "Budget-minded", "fillColor": "green", "fillStyle": "solid", "strokeColor": "green", "fontSize": 15}, {"kind": "shape", "parent": "$f.created.0", "position": [80, 710], "size": [380, 180], "text": "“I want plants that forgive me\nfor a missed week.”", "fillColor": "gray", "fillStyle": "solid", "strokeColor": "gray", "roundness": 14, "fontSize": 22}]}, "as": "card"}
  - {"command": "text.mark", "params": {"id": "$card.created.1", "range": [0, 10], "mark": "bold"}}
  - {"command": "text.mark", "params": {"id": "$card.created.6", "range": [0, 50], "mark": "italic"}}
  - {"command": "element.create", "params": {"elements": [{"kind": "text", "parent": "$f.created.1", "position": [570, 210], "text": "Goals", "fontSize": 26, "strokeColor": "green"}, {"kind": "shape", "shapeStyle": "sticky", "parent": "$f.created.1", "position": [570, 258], "size": [235, 140], "text": "Fresh herbs for cooking all summer", "fillColor": "green", "fontSize": 18}, {"kind": "shape", "shapeStyle": "sticky", "parent": "$f.created.1", "position": [825, 258], "size": [235, 140], "text": "A green balcony to unwind after shifts", "fillColor": "green", "fontSize": 18}, {"kind": "shape", "shapeStyle": "sticky", "parent": "$f.created.1", "position": [1080, 258], "size": [235, 140], "text": "Keep plants alive through busy weeks", "fillColor": "green", "fontSize": 18}, {"kind": "shape", "shapeStyle": "sticky", "parent": "$f.created.1", "position": [1335, 258], "size": [235, 140], "text": "Spend under 20 a month", "fillColor": "green", "fontSize": 18}]}, "as": "goals"}
  - {"command": "element.create", "params": {"elements": [{"kind": "text", "parent": "$f.created.2", "position": [570, 465], "text": "Frustrations", "fontSize": 26, "strokeColor": "red"}, {"kind": "shape", "shapeStyle": "sticky", "parent": "$f.created.2", "position": [570, 513], "size": [235, 140], "text": "Watering advice that ignores the weather", "fillColor": "red", "fontSize": 18}, {"kind": "shape", "shapeStyle": "sticky", "parent": "$f.created.2", "position": [825, 513], "size": [235, 140], "text": "Plants die while she's on nights", "fillColor": "red", "fontSize": 18}, {"kind": "shape", "shapeStyle": "sticky", "parent": "$f.created.2", "position": [1080, 513], "size": [235, 140], "text": "Forums full of jargon", "fillColor": "red", "fontSize": 18}, {"kind": "shape", "shapeStyle": "sticky", "parent": "$f.created.2", "position": [1335, 513], "size": [235, 140], "text": "Shops upsell kit she doesn't need", "fillColor": "red", "fontSize": 18}]}, "as": "pains"}

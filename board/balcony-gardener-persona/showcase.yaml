solid", "strokeColor": "#1971c2", "roundness": 6}, {"kind": "shape", "shapeType": "ellipse", "parent": "$f.created.3", "position": [1156, 878], "size": [28, 28], "fillColor": "white", "fillStyle": "solid", "strokeColor": "#1971c2", "strokeSize": "m"}]}, "as": "habits"}

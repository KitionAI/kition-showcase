  - {"command": "connector.create", "params": {"from": {"element": "$n.created.5", "anchor": [1, 0.5]}, "to": {"element": "$n.created.6", "anchor": [1, 0.5]}, "type": "elbow", "style": {"strokeColor": "gray"}}}
  - {"command": "connector.create", "params": {"from": {"element": "$n.created.6", "anchor": [1, 0.5]}, "to": {"element": "$n.created.8", "anchor": [0.5, 1]}, "type": "elbow", "style": {"strokeColor": "gray"}, "label": "Yes"}}
  - {"command": "connector.create", "params": {"from": {"element": "$n.created.6", "anchor": [0.5, 0]}, "to": {"element": "$n.created.7", "anchor": [0.5, 1]}, "type": "straight", "style": {"strokeColor": "gray"}, "label": "No"}}
  - {"command": "connector.create", "params": {"from": {"element": "$n.created.7", "anchor": [0.5, 0]}, "to": {"element": "$n.created.5", "anchor": [0.5, 1]}, "type": "straight", "style": {"strokeColor": "gray"}, "label": "Try again"}}

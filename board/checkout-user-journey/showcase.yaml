format: 1
id: board/checkout-user-journey
title: Checkout User Journey
summary: A swim-lane flowchart of a grocery app's checkout, with decision diamonds, Yes and No branches and a retry loop.
category: Diagrams & Flows
tags: [flowchart, connectors, swim-lanes, user-journey]
features: [board.elements, board.connectors, board.frames]
featured: true
description: |
  Three frames are the swim lanes (shopper, app, payment provider). Flow nodes in four roles (start
  and end pills, steps, an input parallelogram, decisions) are joined by connectors bound to the
  nodes, so moving a node keeps its arrows attached; elbow connectors carry the branches between lanes.
document: { name: checkout-user-journey.kboard, width: 1920, height: 1080 }
fonts: [inter/Inter-Variable.ttf]
steps:
  - {"command": "element.create", "params": {"elements": [{"kind": "text", "position": [40, 40], "text": "Checkout journey: grocery app", "fontSize": 44, "strokeColor": "ink"}, {"kind": "text", "position": [42, 110], "text": "Who does what between an open cart and a confirmed order, and where shoppers drop out.", "fontSize": 20, "strokeColor": "gray"}]}, "as": "heading"}
  - {"command": "element.create", "params": {"elements": [{"kind": "frame", "position": [40, 190], "size": [1760, 220], "text": ""}, {"kind": "frame", "position": [40, 430], "size": [1760, 220], "text": ""}, {"kind": "frame", "position": [40, 670], "size": [1760, 220], "text": ""}]}, "as": "lanes"}
  - {"command": "element.create", "params": {"elements": [{"kind": "text", "parent": "$lanes.created.0", "position": [64, 286.0], "text": "Shopper", "fontSize": 22, "strokeColor": "gray"}, {"kind": "text", "parent": "$lanes.created.1", "position": [64, 526.0], "text": "Grocery app", "fontSize": 22, "strokeColor": "gray"}, {"kind": "text", "parent": "$lanes.created.2", "position": [64, 766.0], "text": "Payment provider", "fontSize": 22, "strokeColor": "gray"}]}, "as": "lanelabels"}

d": "shape", "shapeStyle": "flow-node", "shapeType": "rectangle", "position": [1150, 495.0], "size": [230, 90], "text": "Show the error, keep the cart", "parent": "$lanes.created.1", "fillColor": "red", "strokeColor": "red", "fillStyle": "solid", "fontSize": 17, "key": "error"}, {"kind": "shape", "shapeStyle": "flow-node", "shapeType": "pill", "position": [1460, 500.0], "size": [200, 80], "text": "Order confirmed", "parent": "$lanes.created.1", "fillColor": "purple", "strokeColor": "purple", "fillStyle": "solid", "fontSize": 17, "key": "done"}]}, "as": "n"}

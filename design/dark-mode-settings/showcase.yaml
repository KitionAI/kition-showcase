format: 1
id: design/dark-mode-settings
title: Dark Mode Settings Screen
summary: A dark-theme mobile settings screen of grouped lists, built from a Toggle component with On and Off variants and a reusable list-row layout.
category: Mobile Apps
tags: [mobile, dark-mode, components, variants, settings]
features: [design.component.manage, design.component.instances, design.layout.auto, design.object.frames-shapes-text, design.text.format]
description: |
  The Toggle is a component set of two variants (`State=On`, `State=Off`): a pill frame whose knob
  sits at the end the auto layout aligns it to. The main components sit beside the phone; every
  switch in the list is an instance, flipped with `instance.setProperties`. Each grouped section is
  a vertical auto layout with rounded corners and clipped rows; rows use space-between so labels
  and controls stay at the edges.
document: { name: dark-mode-settings.kdesign, width: 390, height: 844 }
fonts: [inter/Inter-Variable.ttf]
steps:
  - { command: select.all, params: {}, as: initial }
  - { command: node.set, params: { ids: [$initial.selection.0], props: { name: Settings, fill: "#0B0B0F", layout: vertical, gap: 22, padding: [60, 16, 32, 16] } } }
  # Toggle component set, kept to the right of the screen.
  - { command: node.create, params: { type: component, name: "State=On", x: 440, y: 92, props: { layout: horizontal, padding: 2, mainAlign: max, crossAlign: center, cornerRadius: 999, fill: "#30D158", width: 51, height: 31, sizingH: fixed, sizingV: fixed } }, as: on }
  - { command: node.create, params: { type: ellipse, parent: $on.id, name: Knob, width: 27, height: 27, props: { fill: "#FFFFFF" } } }
  - { command: node.create, params: { type: component, name: "State=Off", x: 520, y: 92, props: { layout: horizontal, padding: 2, mainAlign: min, crossAlign: center, cornerRadius: 999, fill: "#39393D", width: 51, height: 31, sizingH: fixed, sizingV: fixed } }, as: off }

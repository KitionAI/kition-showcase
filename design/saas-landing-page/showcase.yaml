format: 1
id: design/saas-landing-page
title: SaaS Landing Page
summary: A 1440 px marketing page — navigation, hero with a product mock, a customer strip, three feature cards in a wrapping row and a closing call to action.
category: Web Pages
tags: [landing-page, desktop, auto-layout, web]
features: [design.layout.auto, design.layout.auto-row, design.object.frames-shapes-text, design.text.format, design.paint.fill-stroke, design.paint.effects]
description: |
  The page frame is a vertical auto layout of full-width sections, each hugging its content, so
  the page grows as sections are added. The navigation and hero use horizontal layouts with
  space-between; the hero mock is a nested app window with a gradient header and placeholder rows;
  the feature cards fill a horizontal row equally; the closing band centres its content. Headlines
  are Bricolage Grotesque, everything else Inter.
document: { name: saas-landing-page.kdesign, width: 1440, height: 900 }
fonts: [inter/Inter-Variable.ttf, bricolage-grotesque/BricolageGrotesque-Variable.ttf]
steps:
  - { command: select.all, params: {}, as: initial }
  - { command: node.set, params: { ids: [$initial.selection.0], props: { name: Landing, fill: "#FFFDF8", layout: vertical, gap: 0, sizingV: hug } } }
  - { command: node.create, params: { type: frame, parent: $initial.selection.0, name: "Nav", props: { layout: horizontal, mainAlign: spaceBetween, crossAlign: center, padding: [24, 96, 24, 96], fill: none, sizingH: fill, sizingV: hug } }, as: nav }
  - { command: node.create, params: { type: frame, parent: $nav.id, name: "Brand", props: { layout: horizontal, gap: 10, crossAlign: center, fill: none, sizingH: hug, sizingV: hug } }, as: brand }
  - { command: node.create, params: { type: star, parent: $brand.id, name: Mark, width: 28, height: 28, props: { pointCount: 6, innerRadius: 0.5, fill: "#EA580C" } } }
  - { command: text.create, params: { text: "Relay", x: 0, y: 0, parent: $brand.id, props: { fontFamily: Bricolage Grotesque, fontStyle: Bold, fontSize: 22, fills: ["#1C1917"] } } }
  - { command: node.create, params: { type: frame, parent: $nav.id, name: "Links", props: { layout: horizontal, gap: 36, fill: none, sizingH: hug, sizingV: hug } }, as: links }
  - { command: text.create, params: { text: "Product", x: 0, y: 0, parent: $links.id, props: { fontFamily: Inter, fontStyle: Medium, fontSize: 15, fills: ["#44403C"] } } }
  - { command: text.create, params: { text: "Pricing", x: 0, y: 0, parent: $links.id, props: { fontFamily: Inter, fontStyle: Medium, fontSize: 15, fills: ["#44403C"] } } }
  - { command: text.create, params: { text: "Customers", x: 0, y: 0, parent: $links.id, props: { fontFamily: Inter, fontStyle: Medium, fontSize: 15, fills: ["#44403C"] } } }
  - { command: text.create, params: { text: "Changelog", x: 0, y: 0, parent: $links.id, props: { fontFamily: Inter, fontStyle: Medium, fontSize: 15, fills: ["#44403C"] } } }
  - { command: node.create, params: { type: frame, parent: $nav.id, name: "Nav CTA", props: { layout: horizontal, padding: [10, 18, 10, 18], cornerRadius: 999, fill: "#1C1917", sizingH: hug, sizingV: hug } }, as: navCta }
  - { command: text.create, params: { text: "Start free", x: 0, y: 0, parent: $navCta.id, props: { fontFamily: Inter, fontStyle: Semi Bold, fontSize: 14, fills: ["#FFFFFF"] } } }
  - { command: node.create, params: { type: frame, parent: $initial.selection.0, name: "Hero", props: { layout: horizontal, gap: 64, crossAlign: center, padding: [56, 96, 72, 96], fill: none, sizingH: fill, sizingV: hug } }, as: hero }

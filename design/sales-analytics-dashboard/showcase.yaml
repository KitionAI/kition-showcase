  - { command: node.set, params: { ids: [$initial.selection.0], props: { name: Dashboard, fill: "#F4F6FA", layout: horizontal, gap: 0, crossAlign: min } } }
  - { command: node.create, params: { type: frame, parent: $initial.selection.0, name: Sidebar, width: 240, height: 900, props: { layout: vertical, padding: [28, 20, 28, 20], gap: 6, fill: "#0F172A", sizingV: fill, sizingH: fixed } }, as: side }

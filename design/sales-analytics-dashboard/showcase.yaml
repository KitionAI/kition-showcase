format: 1
id: design/sales-analytics-dashboard
title: Sales Analytics Dashboard
summary: A 1440 × 900 desktop dashboard — sidebar navigation, KPI cards that share the width, a bar chart from auto-layout columns, a donut from arc ellipses and an orders list.
category: Dashboards
tags: [dashboard, desktop, auto-layout, charts]
features: [design.layout.auto, design.layout.auto-row, design.object.frames-shapes-text, design.shape.primitives, design.paint.fill-stroke, design.text.format]
featured: true
description: |
  The whole screen is nested auto layout: a horizontal root with a fixed-width sidebar and a main
  column that fills the rest; the four KPI cards fill the row equally. The bar chart is a
  horizontal auto layout frame aligned to the bottom whose twelve bars are rectangles of different
  heights, the donut is three ellipses with `arcStart`, `arcSweep` and `arcInner`, and the orders
  list is rows with space-between alignment and status pills that hug their text.
document: { name: sales-analytics-dashboard.kdesign, width: 1440, height: 900 }
fonts: [inter/Inter-Variable.ttf]
steps:

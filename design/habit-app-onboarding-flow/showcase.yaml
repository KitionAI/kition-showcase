format: 1
id: design/habit-app-onboarding-flow
title: Habit App Onboarding Flow
summary: A three-screen onboarding carousel wired as a prototype — Next buttons push to the following screen, Skip jumps to the end, and a flow starts on the first.
category: Prototypes
tags: [prototype, mobile, onboarding, interactions, flows]
features: [design.proto.interactions, design.layout.auto, design.object.frames-shapes-text, design.shape.primitives, design.paint.fill-stroke]
featured: true
description: |
  Three top-level 390 × 844 frames, the first being the document's own frame. Each holds an
  illustration built from ellipses, a star and rounded rectangles, a text block and a footer row
  with pagination dots (the active one a wider pill) and a button. `proto.interaction.add` gives
  every Next button an On click → Navigate interaction with a Push transition from the right, the
  Skip links navigate straight to the last screen with Dissolve, and `proto.flow.add` makes the
  first screen the starting point of the "Onboarding" flow.
document: { name: habit-app-onboarding-flow.kdesign, width: 390, height: 844 }
fonts: [inter/Inter-Variable.ttf]

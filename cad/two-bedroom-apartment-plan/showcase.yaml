format: 1
id: cad/two-bedroom-apartment-plan
title: Two-Bedroom Apartment Plan
summary: A 1:50 apartment floor plan with solid-filled walls, door swings, windows, furniture, room names with areas and dimensions.
category: Floor Plans
tags: [floor-plan, architecture, hatch, doors, dimensions]
features: [cad.draw.basic-geometry, cad.draw.hatch, cad.draw.text-labels, cad.dimension.basic, cad.dimension.styles, cad.layer.basics, cad.modify.order-groups]
featured: true
description: |
  Walls are rectangles with gaps for the openings, filled together with one SOLID hatch and sent
  behind the outlines with draworder. Doors are a leaf line and a 90° arc; windows sit in the wall
  gaps on their own blue layer. An architectural dimension style (oblique ticks, DIMSCALE 50) gives
  the overall sizes and a continued chain along the top.
document: { name: two-bedroom-apartment-plan.dxf, width: 1600, height: 1200 }

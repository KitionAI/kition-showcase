format: 1
id: cad/office-car-park-layout
title: Office Car Park Layout
summary: A 24-bay car park with two rows of 2.5 × 5 m bays from rectangular arrays, two hatched accessible bays, aisle arrows, trees and dimensions.
category: Site & Landscape
tags: [site-plan, parking, array, hatch]
features: [cad.modify.array, cad.draw.hatch, cad.draw.shapes, cad.dimension.basic, cad.layer.basics]
description: |
  Drawn in metres. One bay line per row is copied twelve times with arrayrect at the 2.5 m bay
  width; the accessible bays are hatched on a blue layer; the one-way aisle arrows are polylines
  whose middle segment tapers from 0.8 m to a point. Corner trees are circles turned into revision
  clouds.
document: { name: office-car-park-layout.dxf, width: 1600, height: 1200 }

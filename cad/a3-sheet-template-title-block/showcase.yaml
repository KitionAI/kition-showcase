format: 1
id: cad/a3-sheet-template-title-block
title: A3 Sheet With Title Block
summary: An A3 drawing sheet with zone references, a title block block filled through attributes, a revision table and a clouded, tagged change.
category: Dimensions & Annotation
tags: [title-block, sheet, attributes, revision-cloud, table]
features: [cad.block.define-insert, cad.block.manage, cad.table.edit, cad.draw.shapes, cad.draw.text-labels, cad.layer.basics]
description: |
  The frame has column numbers and row letters for grid references and centring marks on every
  side. The title block is drawn once with seven attribute definitions, made into the block
  TITLE-A3 and inserted with its values; a table lists revisions A to C, and the latest change is
  marked with a revision cloud and a triangle tag.
document: { name: a3-sheet-template-title-block.dxf, width: 1600, height: 1131 }

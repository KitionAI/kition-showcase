format: 1
id: cad/pipe-flange-dn100
title: Pipe Flange DN100
summary: A front view and a hatched section of a bolted pipe flange at 1:2, with an eight-hole bolt circle, centre lines, diameters and a title block.
category: Mechanical Parts
tags: [mechanical, section, hatch, polar-array, dimensions, centre-lines]
features: [cad.draw.basic-geometry, cad.modify.array, cad.draw.hatch, cad.draw.centers, cad.dimension.basic, cad.dimension.styles, cad.layer.basics]
featured: true
description: |
  Drawn at half size on an A4 sheet: the dimension style's DIMLFAC of 2 makes every dimension read
  full size. One bolt hole is copied round the pitch circle with arraypolar; section A–A is four
  closed polylines filled with ANSI31; centre lines sit on a red CENTER layer. Two dimensions carry
  a text override ("8X Ø18" and "Ø130"), which the check notes as information.
document: { name: pipe-flange-dn100.dxf, width: 1600, height: 1131 }
steps:

format: 1
id: cad/l-bracket-three-views
title: L-Bracket in Three Views
summary: A bent steel angle bracket in third-angle projection - front, top and right views - with hidden lines, centre lines, a fillet and dimensions.
category: Mechanical Parts
tags: [mechanical, orthographic, hidden-lines, centre-lines, dimensions]
features: [cad.draw.basic-geometry, cad.draw.centers, cad.dimension.basic, cad.layer.basics, cad.properties.edit]
description: |
  Three aligned views of one part. Edges that are out of sight are on a magenta HIDDEN layer, axes on
  a red CENTER layer, and the inner bend of the right view is a polyline arc (a bulge). The projection
  symbol beside the title block says third angle.
document: { name: l-bracket-three-views.dxf, width: 1600, height: 1131 }

format: 1
id: motion/podcast-audiogram-captions
title: Podcast Audiogram Captions
summary: A podcast clip card with a pulsing waveform and a caption whose words light up as they are spoken.
category: Titles & Typography
tags: [audiogram, captions, text-animators, expressions, shape-layers]
features: [motion.text.animate, motion.keys.properties, motion.shape.paths, motion.layer.styles, motion.layer.basics]
description: |
  The kind of clip shared to promote an episode. The caption has a text animator with a Fill Color
  property and a Range Selector based on words: keying the selector's End from 0 to 100 % lights
  the words up in step with the speech. The waveform is eighteen rounded bars in one shape layer,
  each with a Scale expression of its own speed and phase, and the cover art is a gradient tile
  with a drop shadow.
document: { name: podcast-audiogram-captions.kmotion, width: 1280, height: 720 }
steps:
  - { command: comp.settings, params: { name: Audiogram, duration: 6, frameRate: 30 } }
  - { command: layer.newSolid, params: { name: Backdrop, color: "#13111c" }, as: bg }
  - { command: effect.apply, params: { layers: [$bg.layer], effect: Gradient Ramp, params: { shape: 1, start: [500, 260], end: [640, 1150], startColor: "#2b2342", endColor: "#08070d" } } }
  - { command: layer.newShape, params: { kind: rounded, name: Cover Art, size: [260, 260], fillGradient: ["#ff8a5c", "#c2338f"], fillAngle: 135, position: [260, 300] }, as: cover }
  - { command: layer.style.add, params: { layers: [$cover.layer], style: dropShadow, params: { opacity: 60, size: 36, distance: 14 } } }
  - { command: layer.newText, params: { text: SMALL, name: Cover Line 1, position: [260, 300], size: 66, font: Inter, style: Bold, fill: "#ffffff", justify: center, tracking: 40 }, as: c1 }
  - { command: layer.newText, params: { text: QUESTIONS, name: Cover Line 2, position: [260, 344], size: 34, font: Inter, style: Bold, fill: "#ffe3d6", justify: center, tracking: 60 }, as: c2 }
  - { command: layer.applyTextPreset, params: { layer: $c1.layer, preset: letterpress, start: 0 } }

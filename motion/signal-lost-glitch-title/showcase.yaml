format: 1
id: motion/signal-lost-glitch-title
title: Signal Lost Glitch Title
summary: A cyber-thriller title scrambles in, then tears apart in bursts of digital glitch and RGB split over a scanline grid.
category: Visual Effects
tags: [glitch, effects, text-presets, keyframes]
features: [motion.effect.apply, motion.text.animate, motion.keys.properties, motion.layer.styles, motion.layer.basics]
description: |
  A title card for a streaming thriller. The words decode with the Scramble preset; an adjustment
  layer carries VR Digital Glitch, whose Master Amplitude is keyframed in short spikes so the frame
  tears only for a few frames at a time. The backdrop is a Grid effect over a radial ramp, and a
  cyan outer glow plus a hard red drop shadow give the chromatic fringe.
document: { name: signal-lost-glitch-title.kmotion, width: 1280, height: 720 }
steps:
  - { command: comp.settings, params: { name: Signal Lost, duration: 5, frameRate: 30 } }
  - { command: layer.newSolid, params: { name: Backdrop, color: "#05070c" }, as: bg }
  - { command: effect.apply, params: { layers: [$bg.layer], effect: Gradient Ramp, params: { shape: 1, start: [640, 360], end: [640, 1000], startColor: "#10233a", endColor: "#020306" } } }
  - { command: effect.apply, params: { layers: [$bg.layer], effect: Grid, params: { width: 48, border: 1, color: "#1be3ff", opacity: 12, blendingMode: 4 } } }
  - { command: layer.newText, params: { text: SIGNAL LOST, position: [640, 388], size: 132, font: Inter, style: Bold, fill: "#e8fbff", justify: center, tracking: 80 }, as: title }
  - { command: layer.style.add, params: { layers: [$title.layer], style: outerGlow, params: { color: "#1be3ff", opacity: 70, size: 30 } } }
  - { command: layer.style.add, params: { layers: [$title.layer], style: dropShadow, params: { color: "#ff2a5f", opacity: 80, size: 0, distance: 7, angle: 160 } } }
  - { command: layer.applyTextPreset, params: { layer: $title.layer, preset: scramble }, as: scramble }
  - { command: layer.newText, params: { text: A NEW SERIES  ·  STREAMING THIS WINTER, position: [640, 470], size: 26, font: Inter, style: SemiBold, fill: "#7fe9ff", justify: center, tracking: 300 }, as: sub }
  - { command: time.set, params: { time: 1.5 } }
  - { command: layer.applyTextPreset, params: { layer: $sub.layer, preset: fadeUpCharacters } }
  - { command: layer.newAdjustment, params: { name: Glitch }, as: glitch }
  - { command: effect.apply, params: { layers: [$glitch.layer], effect: VR Digital Glitch, params: { masterAmplitude: 0, distortionRate: 12, scanlines: 30 } } }
  - { command: prop.addKey, params: { layer: $glitch.layer, path: "effects/#1/masterAmplitude", time: 0, value: 80 } }
  - { command: prop.addKey, params: { layer: $glitch.layer, path: "effects/#1/masterAmplitude", time: 0.3, value: 0 } }
  - { command: prop.addKey, params: { layer: $glitch.layer, path: "effects/#1/masterAmplitude", time: 2.2, value: 0 } }
  - { command: prop.addKey, params: { layer: $glitch.layer, path: "effects/#1/masterAmplitude", time: 2.3, value: 35 } }
  - { command: prop.addKey, params: { layer: $glitch.layer, path: "effects/#1/masterAmplitude", time: 2.5, value: 0 } }
  - { command: prop.addKey, params: { layer: $glitch.layer, path: "effects/#1/masterAmplitude", time: 3.6, value: 0 } }
  - { command: prop.addKey, params: { layer: $glitch.layer, path: "effects/#1/masterAmplitude", time: 3.7, value: 60 } }
  - { command: prop.addKey, params: { layer: $glitch.layer, path: "effects/#1/masterAmplitude", time: 3.9, value: 0 } }
  - { command: effect.apply, params: { layers: [$glitch.layer], effect: CC Vignette, params: { amount: 55, center: [640, 360] } } }
thumbnail: { at: 3.7 }
preview: { from: 0, to: 4, fps: 10, max: 400 }
expected:
  - actual: inspect
    values:
      comp: { name: Signal Lost, duration: 5 }
      info.layers: { count: 4 }
      info.layers.0: { name: Glitch, animated: [{ name: Master Amplitude }] }
      info.layers.0.animated.0.times: { count: 8 }
diagnostics: []
since: "2026-11-09"

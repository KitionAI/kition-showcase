format: 1
id: motion/livestream-countdown-ring
title: Livestream Countdown Ring
summary: A three-second countdown for a live stream, each number punching in while a glowing ring drains around it.
category: Shape Animation
tags: [countdown, trim-paths, layer-timing, keyframes, glow]
features: [motion.shape.paths, motion.keys.basics, motion.layer.basics, motion.layer.styles, motion.text.animate]
description: |
  The last seconds before a stream goes live. The progress ring is an ellipse stroke with Trim
  Paths whose End is keyed from 100 % to 0 % once per second; each digit is its own text layer
  trimmed to its second with layer.timing, scaling down from 140 % as it fades in. A faint full
  ring sits underneath as the track, and the LIVE badge closes the count.
document: { name: livestream-countdown-ring.kmotion, width: 1280, height: 720 }
steps:
  - { command: comp.settings, params: { name: Countdown, duration: 4.5, frameRate: 30 } }
  - { command: layer.newSolid, params: { name: Backdrop, color: "#120a24" }, as: bg }
  - { command: effect.apply, params: { layers: [$bg.layer], effect: Gradient Ramp, params: { shape: 1, start: [640, 360], end: [640, 1100], startColor: "#3a1a6b", endColor: "#07030f" } } }
  - { command: layer.newShape, params: { kind: ellipse, name: Track, size: [380, 380], fill: false, stroke: "#ffffff", strokeOpacity: 12, strokeWidth: 18, position: [640, 360] } }
  - { command: layer.newShape, params: { kind: ellipse, name: Progress, size: [380, 380], fill: false, strokeGradient: ["#ff5fa2", "#ffb86b"], strokeAngle: 0, strokeWidth: 18, position: [640, 360] }, as: ring }
  - { command: layer.addShapeItem, params: { layer: $ring.layer, kind: trim } }
  - { command: prop.addKey, params: { layer: $ring.layer, path: contents/trim/end, time: 0, value: 100 } }
  - { command: prop.addKey, params: { layer: $ring.layer, path: contents/trim/end, time: 0.97, value: 0 } }
  - { command: prop.addKey, params: { layer: $ring.layer, path: contents/trim/end, time: 1, value: 100 } }
  - { command: prop.addKey, params: { layer: $ring.layer, path: contents/trim/end, time: 1.97, value: 0 } }
  - { command: prop.addKey, params: { layer: $ring.layer, path: contents/trim/end, time: 2, value: 100 } }
  - { command: prop.addKey, params: { layer: $ring.layer, path: contents/trim/end, time: 2.97, value: 0 } }
  - { command: layer.timing, params: { layers: [$ring.layer], in: 0, out: 3 } }
  - { command: layer.style.add, params: { layers: [$ring.layer], style: outerGlow, params: { color: "#ff5fa2", opacity: 75, size: 34 } } }
  - { command: layer.newText, params: { text: "3", name: Count 3, position: [640, 425], size: 200, font: Inter, style: Bold, fill: "#ffffff", justify: center }, as: n3 }
  - { command: layer.timing, params: { layers: [$n3.layer], in: 0, out: 1 } }
  - { command: prop.addKey, params: { layer: $n3.layer, path: transform/scale, time: 0, value: [140, 140, 100], timeBase: comp } }
  - { command: prop.addKey, params: { layer: $n3.layer, path: transform/scale, time: 0.4, value: [100, 100, 100], timeBase: comp } }
  - { command: prop.addKey, params: { layer: $n3.layer, path: transform/opacity, time: 0, value: 0, timeBase: comp } }
  - { command: prop.addKey, params: { layer: $n3.layer, path: transform/opacity, time: 0.2, value: 100, timeBase: comp } }
  - { command: layer.newText, params: { text: "2", name: Count 2, position: [640, 425], size: 200, font: Inter, style: Bold, fill: "#ffffff", justify: center }, as: n2 }
  - { command: layer.timing, params: { layers: [$n2.layer], in: 1, out: 2 } }
  - { command: prop.addKey, params: { layer: $n2.layer, path: transform/scale, time: 1, value: [140, 140, 100], timeBase: comp } }
  - { command: prop.addKey, params: { layer: $n2.layer, path: transform/scale, time: 1.4, value: [100, 100, 100], timeBase: comp } }
  - { command: prop.addKey, params: { layer: $n2.layer, path: transform/opacity, time: 1, value: 0, timeBase: comp } }
  - { command: prop.addKey, params: { layer: $n2.layer, path: transform/opacity, time: 1.2, value: 100, timeBase: comp } }
  - { command: layer.newText, params: { text: "1", name: Count 1, position: [640, 425], size: 200, font: Inter, style: Bold, fill: "#ffffff", justify: center }, as: n1 }
  - { command: layer.timing, params: { layers: [$n1.layer], in: 2, out: 3 } }
  - { command: prop.addKey, params: { layer: $n1.layer, path: transform/scale, time: 2, value: [140, 140, 100], timeBase: comp } }
  - { command: prop.addKey, params: { layer: $n1.layer, path: transform/scale, time: 2.4, value: [100, 100, 100], timeBase: comp } }
  - { command: prop.addKey, params: { layer: $n1.layer, path: transform/opacity, time: 2, value: 0, timeBase: comp } }
  - { command: prop.addKey, params: { layer: $n1.layer, path: transform/opacity, time: 2.2, value: 100, timeBase: comp } }
  - { command: layer.style.add, params: { layers: [$n3.layer, $n2.layer, $n1.layer], style: dropShadow, params: { opacity: 50, size: 30, distance: 8 } } }
  - { command: layer.newShape, params: { kind: rounded, name: Live Badge, size: [300, 120], fill: "#ff2d55", position: [640, 360] }, as: badge }
  - { command: layer.timing, params: { layers: [$badge.layer], in: 3, out: 4.5 } }
  - { command: prop.addKey, params: { layer: $badge.layer, path: transform/scale, time: 3, value: [0, 0, 100], timeBase: comp } }
  - { command: prop.addKey, params: { layer: $badge.layer, path: transform/scale, time: 3.4, value: [100, 100, 100], timeBase: comp } }
  - { command: keys.applyEase, params: { layer: $badge.layer, path: transform/scale, preset: pop, from: 3, to: 3.4 } }
  - { command: layer.style.add, params: { layers: [$badge.layer], style: outerGlow, params: { color: "#ff2d55", opacity: 70, size: 40 } } }
  - { command: layer.newText, params: { text: LIVE, position: [640, 386], size: 72, font: Inter, style: Bold, fill: "#ffffff", justify: center, tracking: 120 }, as: live }
  - { command: layer.timing, params: { layers: [$live.layer], in: 3.1, out: 4.5 } }
  - { command: layer.applyTextPreset, params: { layer: $live.layer, preset: letterpress, start: 3.1 } }
  - { command: layer.newText, params: { text: THE STUDIO SESSIONS  ·  EPISODE 14, position: [640, 640], size: 26, font: Inter, style: SemiBold, fill: "#cdb8ff", justify: center, tracking: 240 }, as: show }
  - { command: layer.applyTextPreset, params: { layer: $show.layer, preset: blurSlide, variant: subtitle, start: 0 } }

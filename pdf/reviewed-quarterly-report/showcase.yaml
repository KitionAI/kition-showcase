format: 1
id: pdf/reviewed-quarterly-report
title: Reviewed Quarterly Report
summary: A report page marked up by two reviewers with highlights, a strikeout and replacement, sticky notes with replies and statuses, a cloud, a callout and a status stamp.
category: Annotations & Review
tags: [comments, highlights, sticky-notes, stamps, review-status]
features: [pdf.comments, pdf.content, pdf.text]
featured: true
description: |
  The page is ordinary content; everything coloured on top of it is a comment, as Acrobat's
  commenting tools make them. Highlights and the replacement find their text on the page
  (`find`), the sticky notes carry a reply thread and a review status, and the cloud and callout
  point at the figure the reviewers questioned. `comment_list` reads them back with authors.
document: { name: reviewed-quarterly-report.pdf, width: 612, height: 792 }
steps:
  # The report itself: a title block, two paragraphs and a small results table.
  - { command: comment_add, params: { page: 1, type: rectangle, rect: [72, 330, 540, 352], color: "#2f4858", fill: "#2f4858", width: 0 } }
  - { command: comment_add, params: { page: 1, type: rectangle, rect: [72, 374, 540, 396], color: "#eef2f4", fill: "#eef2f4", width: 0 } }
  - { command: comment_add, params: { page: 1, type: rectangle, rect: [72, 418, 540, 440], color: "#eef2f4", fill: "#eef2f4", width: 0 } }
  - { command: comment_add, params: { page: 1, type: line, from: [72, 462], to: [540, 462], color: "#2f4858", width: 1 } }
  - { command: comment_add, params: { page: 1, type: line, from: [72, 112], to: [540, 112], color: "#2f4858", width: 2 } }
  - { command: doc_flatten, params: { comments: true } }
  - { command: page_add_text, params: { page: 1, at: [72, 64], width: 400, text: "Q3 Operations Report", size: 22, bold: true, color: "#2f4858" } }
  - { command: page_add_text, params: { page: 1, at: [72, 92], width: 400, text: "Northgate Bike Share  ·  Prepared for the board, October 2026", size: 10, color: "#6c7a83" } }
  - { command: page_add_text, params: { page: 1, at: [72, 130], width: 468, text: Summary, size: 13, bold: true, color: "#2f4858" } }
  - command: page_add_text
    params:
      page: 1
      at: [72, 150]
      width: 468
      size: 10.5
      align: justify
      text: "Ridership grew for the third quarter in a row, helped by the twelve new docking stations along the canal path. Average trip length fell slightly as more riders used the bikes for short hops between the rail station and the business park. Fleet availability stayed above target in every month."
  - command: page_add_text
    params:
      page: 1
      at: [72, 210]
      width: 468
      size: 10.5
      align: justify
      text: "Maintenance costs rose because of the brake recall in August, which took forty bikes out of service for nine days. We expect costs to return to normal in Q4. The winter pricing trial starts in December and will be reported on in the next issue."
  - { command: page_add_text, params: { page: 1, at: [72, 304], width: 468, text: Key figures, size: 13, bold: true, color: "#2f4858" } }
  - { command: page_add_text, params: { page: 1, at: [80, 335], width: 200, text: Measure, size: 10, bold: true, color: "#ffffff" } }
  - { command: page_add_text, params: { page: 1, at: [300, 335], width: 110, text: Q2, size: 10, bold: true, color: "#ffffff", align: right } }
  - { command: page_add_text, params: { page: 1, at: [420, 335], width: 110, text: Q3, size: 10, bold: true, color: "#ffffff", align: right } }
  - { command: page_add_text, params: { page: 1, at: [80, 358], width: 200, text: Trips, size: 10 } }
  - { command: page_add_text, params: { page: 1, at: [300, 358], width: 110, text: "184,200", size: 10, align: right } }
  - { command: page_add_text, params: { page: 1, at: [420, 358], width: 110, text: "212,900", size: 10, align: right } }
  - { command: page_add_text, params: { page: 1, at: [80, 380], width: 200, text: Active members, size: 10 } }
  - { command: page_add_text, params: { page: 1, at: [300, 380], width: 110, text: "9,420", size: 10, align: right } }
  - { command: page_add_text, params: { page: 1, at: [420, 380], width: 110, text: "10,150", size: 10, align: right } }
  - { command: page_add_text, params: { page: 1, at: [80, 402], width: 200, text: Fleet availability, size: 10 } }
  - { command: page_add_text, params: { page: 1, at: [300, 402], width: 110, text: "96.1%", size: 10, align: right } }
  - { command: page_add_text, params: { page: 1, at: [420, 402], width: 110, text: "95.4%", size: 10, align: right } }
  - { command: page_add_text, params: { page: 1, at: [80, 424], width: 200, text: Maintenance cost, size: 10 } }
  - { command: page_add_text, params: { page: 1, at: [300, 424], width: 110, text: "41,300", size: 10, align: right } }
  - { command: page_add_text, params: { page: 1, at: [420, 424], width: 110, text: "58,700", size: 10, align: right, bold: true } }
  - { command: page_add_text, params: { page: 1, at: [72, 478], width: 468, text: "Figures are unaudited. Costs are in thousands of credits.", size: 8.5, italic: true, color: "#6c7a83" } }
  # The review.
  - { command: comment_add, params: { page: 1, type: highlight, find: "twelve new docking stations", color: yellow, author: Ines Faro } }
  - { command: comment_add, params: { page: 1, type: highlight, find: "brake recall in August", color: "#ffb3c1", author: Tomas Bekele } }
  - { command: comment_add, params: { page: 1, type: replace, find: "slightly", contents: "by 6 percent", color: blue, author: Ines Faro } }
  - { command: comment_add, params: { page: 1, type: squiggly, find: "next issue", color: green, author: Tomas Bekele } }
  - { command: comment_add, params: { page: 1, type: note, at: [548, 146], contents: "Name the stations or link the map in the appendix.", author: Ines Faro, color: yellow }, as: note1 }
  - { command: comment_reply, params: { id: $note1.comment.id, text: "Map added as appendix B.", author: Tomas Bekele } }
  - { command: comment_set_status, params: { id: $note1.comment.id, status: completed, author: Ines Faro } }
  - { command: comment_add, params: { page: 1, type: note, at: [548, 206], contents: "Say how many days the recall cost in total, not per bike.", author: Tomas Bekele, color: "#ff8fa3" } }
  - { command: comment_add, params: { page: 1, type: cloud, points: [[478, 424], [534, 424], [534, 436], [478, 436]], color: red, width: 1.5, author: Tomas Bekele } }
  - { command: comment_add, params: { page: 1, type: callout, rect: [300, 500, 440, 544], to: [478, 440], knee: [462, 522], contents: "42% up on Q2: split the recall from routine work.", color: red, font_size: 9.5, author: Tomas Bekele } }
  - { command: comment_add, params: { page: 1, type: stamp, at: [150, 536], stamp: preliminary results, author: Ines Faro } }
  - { command: comment_list, params: { page: 1 }, as: comments }
thumbnail: { area: [40, 40, 612, 580] }
expected:
  - actual: inspect
    values:
      pages: { count: 1 }
  - actual: results
    values:
      comments.comments: { count: 9, any: { type: Stamp } }
      comments.comments.0: { type: Text, author: Ines Faro, status: Completed, replies: { count: 1 } }
since: "2026-11-09"

format: 1
id: slide/company-org-chart
title: Company Org Chart
summary: A three-level organisation chart, with a chief executive, three department heads and six teams, joined by elbow lines drawn as freeform paths.
category: Business Reports
tags: [org-chart, connectors, shapes, hierarchy]
features: [slide.shapes.edit, slide.drawing.objects, slide.text.edit]
description: |
  Every box is a rounded rectangle with a bold name over a smaller role, and every line is a
  four-point freeform path that drops from the parent, runs along a shared rail and drops into
  the child. Each department keeps one colour from its head down to its teams.
document: { name: company-org-chart.pptx, width: 960, height: 540 }
fonts: [inter/Inter-Variable.ttf]

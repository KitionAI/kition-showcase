format: 1
id: slide/budget-variance-table
title: Budget vs Actual Table
summary: A quarterly operating budget table with right-aligned monospaced figures, green and red variance cells, a bold total row and two callout cards.
category: Charts & Tables
tags: [table, budget, cell-fill, finance, monospace]
features: [slide.tables.edit, slide.format.character, slide.shapes.edit]
description: |
  A finance slide built on one of the kit's table styles: the header takes the deck's accent
  colour, figures are set in JetBrains Mono and right-aligned so the digits line up, overspends
  get a red fill and underspends a green one, and the total row is bold with a heavier rule.
document: { name: budget-variance-table.pptx, width: 960, height: 540 }
fonts: [inter/Inter-Variable.ttf, jetbrains-mono/JetBrainsMono-Variable.ttf]
steps:
  - { command: design.colors, params: { colors: { accent1: "#1e40af" } } }
  - { command: slide.layout, params: { layout: blank, index: 0 } }
  - { command: design.background, params: { color: "#f8fafc" } }
  - { command: insert.textBox, params: { rect: [48, 30, 600, 46], text: Q3 operating budget vs actual }, as: title }
  - { command: format.size, params: { ids: [$title.id], size: 30 } }
  - { command: format.bold, params: { ids: [$title.id] } }
  - { command: format.color, params: { ids: [$title.id], color: "#0f172a" } }
  - { command: insert.textBox, params: { rect: [48, 74, 600, 24], text: "Thousands of dollars · July to September · positive variance is under budget" }, as: lede }
  - { command: format.size, params: { ids: [$lede.id], size: 13 } }
  - { command: format.color, params: { ids: [$lede.id], color: "#64748b" } }
  - command: insert.table
    params:
      rows: 8
      cols: 5
      rect: [48, 120, 600, 368]
      data:
        - [Department, Budget, Actual, Variance, "%"]
        - [Engineering, "1,240", "1,198", "+42", "+3.4%"]
        - [Sales, "860", "912", "−52", "−6.0%"]
        - [Marketing, "540", "497", "+43", "+8.0%"]
        - [Customer success, "380", "392", "−12", "−3.2%"]
        - [Operations, "310", "301", "+9", "+2.9%"]
        - [General and admin, "270", "266", "+4", "+1.5%"]
        - [Total, "3,600", "3,566", "+34", "+0.9%"]
    as: tb
  - { command: table.style, params: { id: $tb.id, style: medium2-accent1 } }
  - { command: table.options, params: { id: $tb.id, headerRow: true, totalRow: true, bandedRows: true } }
  - { command: table.columnWidth, params: { id: $tb.id, col: 0, width: 184 } }
  - { command: table.columnWidth, params: { id: $tb.id, col: 1, width: 104 } }
  - { command: table.columnWidth, params: { id: $tb.id, col: 2, width: 104 } }
  - { command: table.columnWidth, params: { id: $tb.id, col: 3, width: 104 } }
  - { command: table.columnWidth, params: { id: $tb.id, col: 4, width: 104 } }
  - { command: table.cellFormat, params: { id: $tb.id, anchor: center } }
  - { command: format.size, params: { ids: [$tb.id], size: 14 } }
  - { command: table.selectCells, params: { id: $tb.id, from: [0, 1], to: [7, 4] } }
  - { command: format.align, params: { align: right } }
  - { command: table.selectCells, params: { id: $tb.id, from: [1, 1], to: [7, 4] } }
  - { command: format.font, params: { family: JetBrains Mono } }
  - { command: format.size, params: { size: 13 } }
  - { command: table.selectCells, params: { id: $tb.id, from: [1, 3], to: [1, 4] } }
  - { command: table.cellFill, params: { id: $tb.id, color: "#dcfce7" } }
  - { command: format.color, params: { color: "#166534" } }
  - { command: table.selectCells, params: { id: $tb.id, from: [3, 3], to: [3, 4] } }
  - { command: table.cellFill, params: { id: $tb.id, color: "#dcfce7" } }
  - { command: format.color, params: { color: "#166534" } }
  - { command: table.selectCells, params: { id: $tb.id, from: [5, 3], to: [6, 4] } }
  - { command: table.cellFill, params: { id: $tb.id, color: "#dcfce7" } }
  - { command: format.color, params: { color: "#166534" } }
  - { command: table.selectCells, params: { id: $tb.id, from: [2, 3], to: [2, 4] } }
  - { command: table.cellFill, params: { id: $tb.id, color: "#fee2e2" } }
  - { command: format.color, params: { color: "#991b1b" } }
  - { command: table.selectCells, params: { id: $tb.id, from: [4, 3], to: [4, 4] } }
  - { command: table.cellFill, params: { id: $tb.id, color: "#fee2e2" } }
  - { command: format.color, params: { color: "#991b1b" } }
  - { command: table.selectCells, params: { id: $tb.id, from: [7, 0], to: [7, 4] } }
  - { command: format.bold, params: {} }
  - { command: table.border, params: { id: $tb.id, edges: top, color: "#172554", width: 2, from: [7, 0], to: [7, 4] } }

  - { command: shape.insert, params: { preset: roundRect, rect: [680, 120, 232, 170], adj: [6000] }, as: card1 }
  - { command: shape.insert, params: { preset: roundRect, rect: [680, 310, 232, 178], adj: [6000] }, as: card2 }
  - { command: shape.fill, params: { ids: [$card1.id], color: "#172554" } }
  - { command: shape.fill, params: { ids: [$card2.id], color: "#ffffff" } }
  - { command: shape.line, params: { ids: [$card1.id], none: true } }
  - { command: shape.line, params: { ids: [$card2.id], color: "#fecaca", width: 1.5 } }
  - { command: insert.textBox, params: { rect: [698, 136, 200, 140], text: "$$34K\nunder budget for the quarter, 0.9% of plan" }, as: v1 }
  - { command: insert.textBox, params: { rect: [698, 326, 200, 150], text: "2 teams over\nSales ran a trade-show quarter; support hired ahead of the October launch." }, as: v2 }
  - { command: format.size, params: { ids: [$v1.id, $v2.id], size: 13 } }
  - { command: format.color, params: { ids: [$v1.id], color: "#cbd5e1" } }
  - { command: format.color, params: { ids: [$v2.id], color: "#475569" } }
  - { command: format.paragraph, params: { ids: [$v1.id, $v2.id], spaceAfter: 6, lineSpacing: 1.15 } }
  - { command: text.edit, params: { id: $v1.id, at: [0, 0] } }
  - { command: text.selectParagraph, params: { at: [0, 0] } }
  - { command: format.size, params: { size: 40 } }
  - { command: format.bold, params: {} }
  - { command: format.color, params: { color: "#4ade80" } }
  - { command: text.edit, params: { id: $v2.id, at: [0, 0] } }
  - { command: text.selectParagraph, params: { at: [0, 0] } }
  - { command: format.size, params: { size: 26 } }
  - { command: format.bold, params: {} }
  - { command: format.color, params: { color: "#b91c1c" } }
  - { command: text.exit, params: {} }
  - { command: table.state, params: { id: $tb.id }, as: state }
  - { command: slide.inspect, params: { index: 0 }, as: slide }
expected:
  - actual: inspect
    values:
      slides: { count: 1 }
  - actual: results
    values:
      state: { rows: 8, cols: 5, style: medium2-accent1, options: { headerRow: true, totalRow: true } }
      slide.shapes: { any: { kind: table, table: { cells: { contains: [Total, "3,600", "3,566", "+34", "+0.9%"] } } } }
diagnostics: []
since: "2026-11-09"

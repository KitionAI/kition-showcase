format: 1
id: slide/alphabet-history-lecture
title: Alphabet History Lecture
summary: A lecture slide on how the Latin alphabet grew from picture signs, told in five dated stage cards along a timeline.
category: Education
tags: [lesson, timeline]
features: [slide.format.paragraph, slide.format.character, slide.shapes.edit]
description: |
  Five stage cards run from Egyptian picture signs on the left to lowercase letters on the right,
  under a timeline arrow. Each card is one text box whose first two paragraphs are restyled by
  selecting their characters (size, bold, colour); the title band on the right is a text box turned
  to vertical text with wrapping off, so the title and its subtitle become two columns. Lora sets the
  headings and Inter the body.
document: { name: alphabet-history-lecture.pptx, width: 960, height: 540 }
fonts: [lora/Lora-Variable.ttf, inter/Inter-Variable.ttf]

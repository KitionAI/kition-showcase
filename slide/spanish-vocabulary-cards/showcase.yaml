format: 1
id: slide/spanish-vocabulary-cards
title: Spanish Vocabulary Flashcards
summary: Six Spanish flashcards with part-of-speech tags and pronunciation, whose English meanings wipe in one click at a time.
category: Education
tags: [flashcards, lesson, animation, shapes]
features: [slide.animations.set, slide.shapes.edit, slide.format.character]
description: |
  Each card is a rounded rectangle with a pill tag coloured by part of speech, the word in Lora and
  a pronunciation line. The English meaning sits in a tinted strip at the foot of the card; six Wipe
  entrances on click let the class guess before each answer appears.
document: { name: spanish-vocabulary-cards.pptx, width: 960, height: 540 }
fonts: [inter/Inter-Variable.ttf, lora/Lora-Variable.ttf]

format: 1
id: slide/cafe-menu-kiosk-loop
title: Café Menu Kiosk Loop
summary: A three-board café menu that runs unattended; each slide pushes up to the next after eight seconds, in a looping kiosk show.
category: Animations & Transitions
tags: [transitions, timing, kiosk, menu, theme]
features: [slide.transitions.set, slide.show.slideshow, slide.design.themes]
description: |
  Breakfast, lunch and drinks boards for a screen above the counter. Every slide has a Push
  transition with advance on click turned off and automatic advance after 8 s, and the show is set
  up as a kiosk that loops until Esc, so it can play all day. The tilted stamp is three shapes and
  a text box rotated together; the dots at the bottom show which board is up.
document: { name: cafe-menu-kiosk-loop.pptx, width: 960, height: 540 }
fonts: [inter/Inter-Variable.ttf, lora/Lora-Variable.ttf]

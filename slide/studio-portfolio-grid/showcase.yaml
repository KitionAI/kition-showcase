format: 1
id: slide/studio-portfolio-grid
title: Studio Portfolio Grid
summary: A design studio's selected-work grid in a custom theme colour scheme, six project tiles drawn from shapes in the six accent colours.
category: Layouts & Themes
tags: [theme-colors, portfolio, grid, shapes]
features: [slide.design.themes, slide.shapes.edit]
description: |
  `design.colors` sets the theme's own palette (dark, light and six accents), and every tile and
  motif is filled with a theme slot such as `accent2` rather than a fixed colour, so switching the
  scheme recolours the whole grid. No photographs: waves, a cup, block arcs, book spines, seeds and
  chevrons stand in for the projects.
document: { name: studio-portfolio-grid.pptx, width: 960, height: 540 }
fonts: [inter/Inter-Variable.ttf, bricolage-grotesque/BricolageGrotesque-Variable.ttf]

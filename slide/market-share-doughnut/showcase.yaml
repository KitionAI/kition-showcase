format: 1
id: slide/market-share-doughnut
title: Market Share Doughnut
summary: A doughnut chart of market share with the company's own slice in a strong colour, its share set large in the hole, and a hand-built legend with values.
category: Charts & Tables
tags: [chart, doughnut, legend, theme-colors]
features: [slide.charts.edit, slide.design.themes, slide.shapes.edit]
description: |
  The chart's colours come from the deck's colour scheme: accent 1 is the company's violet and the
  other accents step down to greys, so competitors recede. The chart's own title and legend are
  turned off; a text box in the hole carries the headline number, and a legend of swatches, names
  and percentages runs down the right.
document: { name: market-share-doughnut.pptx, width: 960, height: 540 }
fonts: [inter/Inter-Variable.ttf, bricolage-grotesque/BricolageGrotesque-Variable.ttf]
steps:
  - { command: design.colors, params: { colors: { accent1: "#6d28d9", accent2: "#a78bfa", accent3: "#c4b5fd", accent4: "#94a3b8", accent5: "#d6dbe3", accent6: "#e2e8f0" } } }
  - { command: design.fonts, params: { major: Bricolage Grotesque, minor: Inter } }
  - { command: slide.layout, params: { layout: blank, index: 0 } }
  - { command: insert.textBox, params: { rect: [48, 32, 860, 46], text: We lead meal-kit delivery in the region }, as: title }
  - { command: format.font, params: { ids: [$title.id], family: Bricolage Grotesque } }
  - { command: format.size, params: { ids: [$title.id], size: 30 } }
  - { command: format.bold, params: { ids: [$title.id] } }
  - { command: format.color, params: { ids: [$title.id], color: "#111827" } }
  - { command: insert.textBox, params: { rect: [48, 76, 860, 24], text: "Share of orders, January to September 2026 · panel of 12,000 households" }, as: lede }
  - { command: format.size, params: { ids: [$lede.id], size: 13 } }
  - { command: format.color, params: { ids: [$lede.id], color: "#6b7280" } }
  - command: insert.chart
    params:
      type: doughnut
      rect: [60, 118, 400, 400]
      categories: [Freshfold, Platewise, Kitchen Courier, Greenbox, Others]
      series:
        - { name: Share of orders, values: [38, 24, 17, 12, 9] }
    as: chart
  - { command: chart.options, params: { id: $chart.id, title: null, legend: null, dataLabels: false } }
  - { command: insert.textBox, params: { rect: [160, 270, 200, 100], text: "38%\nour share" }, as: hole }
  - { command: format.align, params: { ids: [$hole.id], align: center } }
  - { command: format.anchor, params: { ids: [$hole.id], anchor: middle } }
  - { command: format.size, params: { ids: [$hole.id], size: 14 } }
  - { command: format.color, params: { ids: [$hole.id], color: "#6b7280" } }
  - { command: text.edit, params: { id: $hole.id, at: [0, 0] } }
  - { command: text.selectParagraph, params: { at: [0, 0] } }
  - { command: format.size, params: { size: 48 } }
  - { command: format.bold, params: {} }
  - { command: format.font, params: { family: Bricolage Grotesque } }
  - { command: format.color, params: { color: "#6d28d9" } }
  - { command: text.exit, params: {} }
  - { command: shape.insert, params: { preset: roundRect, rect: [560, 176, 18, 18], adj: [20000] }, as: sw0 }
  - { command: shape.fill, params: { ids: [$sw0.id], color: "#6d28d9" } }
  - { command: insert.textBox, params: { rect: [588, 170, 220, 30], text: Freshfold }, as: ln0 }
  - { command: insert.textBox, params: { rect: [808, 170, 100, 30], text: "38%" }, as: lv0 }
  - { command: shape.freeform, params: { points: [[560, 214], [908, 214]] }, as: rl0 }
  - { command: shape.insert, params: { preset: roundRect, rect: [560, 234, 18, 18], adj: [20000] }, as: sw1 }
  - { command: shape.fill, params: { ids: [$sw1.id], color: "#a78bfa" } }
  - { command: insert.textBox, params: { rect: [588, 228, 220, 30], text: Platewise }, as: ln1 }
  - { command: insert.textBox, params: { rect: [808, 228, 100, 30], text: "24%" }, as: lv1 }
  - { command: shape.freeform, params: { points: [[560, 272], [908, 272]] }, as: rl1 }
  - { command: shape.insert, params: { preset: roundRect, rect: [560, 292, 18, 18], adj: [20000] }, as: sw2 }
  - { command: shape.fill, params: { ids: [$sw2.id], color: "#c4b5fd" } }
  - { command: insert.textBox, params: { rect: [588, 286, 220, 30], text: Kitchen Courier }, as: ln2 }
  - { command: insert.textBox, params: { rect: [808, 286, 100, 30], text: "17%" }, as: lv2 }
  - { command: shape.freeform, params: { points: [[560, 330], [908, 330]] }, as: rl2 }
  - { command: shape.insert, params: { preset: roundRect, rect: [560, 350, 18, 18], adj: [20000] }, as: sw3 }
  - { command: shape.fill, params: { ids: [$sw3.id], color: "#94a3b8" } }
  - { command: insert.textBox, params: { rect: [588, 344, 220, 30], text: Greenbox }, as: ln3 }
  - { command: insert.textBox, params: { rect: [808, 344, 100, 30], text: "12%" }, as: lv3 }
  - { command: shape.freeform, params: { points: [[560, 388], [908, 388]] }, as: rl3 }
  - { command: shape.insert, params: { preset: roundRect, rect: [560, 408, 18, 18], adj: [20000] }, as: sw4 }
  - { command: shape.fill, params: { ids: [$sw4.id], color: "#d6dbe3" } }
  - { command: insert.textBox, params: { rect: [588, 402, 220, 30], text: Others }, as: ln4 }
  - { command: insert.textBox, params: { rect: [808, 402, 100, 30], text: "9%" }, as: lv4 }
  - { command: shape.line, params: { ids: [$sw0.id, $sw1.id, $sw2.id, $sw3.id, $sw4.id], none: true } }
  - { command: shape.line, params: { ids: [$rl0.id, $rl1.id, $rl2.id, $rl3.id], color: "#e5e7eb", width: 1 } }
  - { command: format.size, params: { ids: [$ln0.id, $ln1.id, $ln2.id, $ln3.id, $ln4.id, $lv0.id, $lv1.id, $lv2.id, $lv3.id, $lv4.id], size: 17 } }
  - { command: format.color, params: { ids: [$ln0.id, $ln1.id, $ln2.id, $ln3.id, $ln4.id], color: "#374151" } }
  - { command: format.color, params: { ids: [$lv0.id, $lv1.id, $lv2.id, $lv3.id, $lv4.id], color: "#111827" } }
  - { command: format.bold, params: { ids: [$lv0.id, $lv1.id, $lv2.id, $lv3.id, $lv4.id, $ln0.id] } }
  - { command: format.color, params: { ids: [$ln0.id, $lv0.id], color: "#6d28d9" } }
  - { command: format.align, params: { ids: [$lv0.id, $lv1.id, $lv2.id, $lv3.id, $lv4.id], align: right } }
  - { command: insert.textBox, params: { rect: [556, 470, 360, 40], text: "Up from 31% a year ago, mostly won from Platewise after our weekday menu launch." }, as: note }
  - { command: format.size, params: { ids: [$note.id], size: 12 } }
  - { command: format.color, params: { ids: [$note.id], color: "#6b7280" } }
  - { command: shape.inspect, params: { id: $chart.id }, as: c }
  - { command: slide.inspect, params: { index: 0 }, as: slide }
expected:
  - actual: inspect
    values:
      slides: { count: 1 }
  - actual: results
    values:
      c.shape.kind: { type: chart, kind: doughnut, legend: null, title: null, categories: { count: 5 } }
      c.shape.kind.series.0.values: [38, 24, 17, 12, 9]
diagnostics: []
since: "2026-11-09"

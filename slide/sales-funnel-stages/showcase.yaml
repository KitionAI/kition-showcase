format: 1
id: slide/sales-funnel-stages
title: Sales Funnel Stages
summary: A four-stage acquisition funnel drawn as tapered freeform bands, with stage counts inside and step conversion rates in pills beside each hand-off.
category: Business Reports
tags: [funnel, freeform, shapes, kpi]
features: [slide.drawing.objects, slide.shapes.edit, slide.text.edit]
description: |
  Each band of the funnel is a closed freeform polygon whose bottom edge matches the next band's
  top, so the stages taper as one shape. Counts sit in the bands, dotted leader lines run to amber
  pills with the conversion rate at each step, and the overall rate closes the slide.
document: { name: sales-funnel-stages.pptx, width: 960, height: 540 }
fonts: [inter/Inter-Variable.ttf]
steps:
  - { command: slide.layout, params: { layout: blank, index: 0 } }
  - { command: insert.textBox, params: { rect: [48, 32, 860, 46], text: "Q3 funnel: activation is where we win" }, as: title }
  - { command: format.size, params: { ids: [$title.id], size: 30 } }
  - { command: format.bold, params: { ids: [$title.id] } }
  - { command: format.color, params: { ids: [$title.id], color: "#0f172a" } }
  - { command: insert.textBox, params: { rect: [48, 76, 860, 24], text: "Self-serve signups, July to September · all channels" }, as: lede }
  - { command: format.size, params: { ids: [$lede.id], size: 13 } }
  - { command: format.color, params: { ids: [$lede.id], color: "#64748b" } }
  - { command: shape.freeform, params: { points: [[50, 128], [550, 128], [504, 212], [96, 212]], closed: true }, as: f0 }
  - { command: shape.fill, params: { ids: [$f0.id], color: "#312e81" } }
  - { command: shape.line, params: { ids: [$f0.id], none: true } }
  - { command: insert.textBox, params: { rect: [150, 138, 300, 64], text: "48,200\nWebsite visitors" }, as: t0 }
  - { command: format.color, params: { ids: [$t0.id], color: "#ffffff" } }
  - { command: shape.freeform, params: { points: [[100, 220], [500, 220], [454, 304], [146, 304]], closed: true }, as: f1 }
  - { command: shape.fill, params: { ids: [$f1.id], color: "#4338ca" } }
  - { command: shape.line, params: { ids: [$f1.id], none: true } }
  - { command: insert.textBox, params: { rect: [150, 230, 300, 64], text: "6,100\nSign-ups" }, as: t1 }
  - { command: format.color, params: { ids: [$t1.id], color: "#ffffff" } }
  - { command: shape.freeform, params: { points: [[150, 312], [450, 312], [404, 396], [196, 396]], closed: true }, as: f2 }
  - { command: shape.fill, params: { ids: [$f2.id], color: "#6366f1" } }
  - { command: shape.line, params: { ids: [$f2.id], none: true } }
  - { command: insert.textBox, params: { rect: [150, 322, 300, 64], text: "2,900\nActivated" }, as: t2 }
  - { command: format.color, params: { ids: [$t2.id], color: "#ffffff" } }
  - { command: shape.freeform, params: { points: [[200, 404], [400, 404], [354, 488], [246, 488]], closed: true }, as: f3 }
  - { command: shape.fill, params: { ids: [$f3.id], color: "#a5b4fc" } }
  - { command: shape.line, params: { ids: [$f3.id], none: true } }
  - { command: insert.textBox, params: { rect: [150, 414, 300, 64], text: "820\nPaying customers" }, as: t3 }
  - { command: format.color, params: { ids: [$t3.id], color: "#1e1b4b" } }
  - { command: shape.insert, params: { preset: roundRect, rect: [590, 194, 92, 36], text: "12.7%", adj: [50000] }, as: p0 }
  - { command: insert.textBox, params: { rect: [692, 199, 220, 26], text: visit to sign-up }, as: pl0 }
  - { command: shape.freeform, params: { points: [[520, 212], [584, 212]] }, as: lead0 }
  - { command: shape.insert, params: { preset: roundRect, rect: [590, 286, 92, 36], text: "47.5%", adj: [50000] }, as: p1 }
  - { command: insert.textBox, params: { rect: [692, 291, 220, 26], text: sign-up to activation }, as: pl1 }
  - { command: shape.freeform, params: { points: [[470, 304], [584, 304]] }, as: lead1 }
  - { command: shape.insert, params: { preset: roundRect, rect: [590, 378, 92, 36], text: "28.3%", adj: [50000] }, as: p2 }
  - { command: insert.textBox, params: { rect: [692, 383, 220, 26], text: activation to paid }, as: pl2 }

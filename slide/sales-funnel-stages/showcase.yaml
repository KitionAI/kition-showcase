  - { command: format.size, params: { ids: [$p0.id, $p1.id, $p2.id], size: 15 } }
  - { command: format.bold, params: { ids: [$p0.id, $p1.id, $p2.id] } }
  - { command: format.color, params: { ids: [$p0.id, $p1.id, $p2.id], color: "#92400e" } }
  - { command: format.size, params: { ids: [$pl0.id, $pl1.id, $pl2.id], size: 14 } }
  - { command: format.color, params: { ids: [$pl0.id, $pl1.id, $pl2.id], color: "#475569" } }
  - { command: shape.line, params: { ids: [$lead0.id, $lead1.id, $lead2.id], color: "#cbd5e1", width: 1, dash: dot } }

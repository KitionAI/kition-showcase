format: 1
id: slide/product-roadmap-timeline
title: Product Roadmap Timeline
summary: A four-quarter product roadmap with tinted swimlanes for platform, mobile and integrations, arrow-shaped bars and a dashed "today" marker.
category: Business Reports
tags: [roadmap, timeline, shapes, freeform]
features: [slide.shapes.edit, slide.drawing.objects, slide.arrange.objects]
description: |
  A planning slide every product team makes: quarters across the top, one tinted lane per team and
  each initiative as a pentagon-arrow bar sized to its quarters. Grid lines and the dashed "today"
  marker are freeform lines; the lanes are sent to the back so the bars sit on them.
document: { name: product-roadmap-timeline.pptx, width: 960, height: 540 }
fonts: [inter/Inter-Variable.ttf]
steps:
  - { command: design.fonts, params: { major: Inter, minor: Inter } }
  - { command: slide.layout, params: { layout: blank, index: 0 } }
  - { command: insert.textBox, params: { rect: [56, 34, 560, 50], text: Product roadmap 2027 }, as: title }
  - { command: format.size, params: { ids: [$title.id], size: 32 } }
  - { command: format.bold, params: { ids: [$title.id] } }
  - { command: format.color, params: { ids: [$title.id], color: "#0f172a" } }
  - { command: insert.textBox, params: { rect: [56, 80, 600, 26], text: "Three teams, nine bets. Dates are quarters, not promises." }, as: lede }
  - { command: format.size, params: { ids: [$lede.id], size: 14 } }
  - { command: format.color, params: { ids: [$lede.id], color: "#64748b" } }
  - { command: insert.textBox, params: { rect: [200, 124, 180, 24], text: "Q1 2027" }, as: q0 }
  - { command: insert.textBox, params: { rect: [380, 124, 180, 24], text: "Q2 2027" }, as: q1 }
  - { command: insert.textBox, params: { rect: [560, 124, 180, 24], text: "Q3 2027" }, as: q2 }
  - { command: insert.textBox, params: { rect: [740, 124, 180, 24], text: "Q4 2027" }, as: q3 }
  - { command: format.size, params: { ids: [$q0.id, $q1.id, $q2.id, $q3.id], size: 13 } }
  - { command: format.bold, params: { ids: [$q0.id, $q1.id, $q2.id, $q3.id] } }
  - { command: format.color, params: { ids: [$q0.id, $q1.id, $q2.id, $q3.id], color: "#64748b" } }
  - { command: format.align, params: { ids: [$q0.id, $q1.id, $q2.id, $q3.id], align: center } }
  - { command: shape.freeform, params: { points: [[380, 152], [380, 494]] }, as: g1 }
  - { command: shape.freeform, params: { points: [[560, 152], [560, 494]] }, as: g2 }
  - { command: shape.freeform, params: { points: [[740, 152], [740, 494]] }, as: g3 }
  - { command: shape.line, params: { ids: [$g1.id, $g2.id, $g3.id], color: "#e2e8f0", width: 1 } }
  - { command: shape.insert, params: { preset: roundRect, rect: [56, 156, 864, 106], adj: [6000] }, as: lane0 }
  - { command: shape.fill, params: { ids: [$lane0.id], color: "#eef2ff" } }
  - { command: shape.line, params: { ids: [$lane0.id], none: true } }
  - { command: arrange.sendToBack, params: { ids: [$lane0.id] } }
  - { command: insert.textBox, params: { rect: [70, 170, 130, 30], text: Platform }, as: ln0 }
  - { command: format.size, params: { ids: [$ln0.id], size: 15 } }
  - { command: format.bold, params: { ids: [$ln0.id] } }
  - { command: format.color, params: { ids: [$ln0.id], color: "#4f46e5" } }
  - { command: shape.insert, params: { preset: homePlate, rect: [204, 170, 298, 34], text: Usage-based billing }, as: b00 }
  - { command: shape.insert, params: { preset: homePlate, rect: [528, 214, 388, 34], text: Multi-region hosting }, as: b01 }
  - { command: shape.fill, params: { ids: [$b00.id, $b01.id], color: "#4f46e5" } }
  - { command: shape.insert, params: { preset: roundRect, rect: [56, 270, 864, 106], adj: [6000] }, as: lane1 }
  - { command: shape.fill, params: { ids: [$lane1.id], color: "#f0fdfa" } }
  - { command: shape.line, params: { ids: [$lane1.id], none: true } }
  - { command: arrange.sendToBack, params: { ids: [$lane1.id] } }
  - { command: insert.textBox, params: { rect: [70, 284, 130, 30], text: Mobile }, as: ln1 }
  - { command: format.size, params: { ids: [$ln1.id], size: 15 } }
  - { command: format.bold, params: { ids: [$ln1.id] } }
  - { command: format.color, params: { ids: [$ln1.id], color: "#0f766e" } }
  - { command: shape.insert, params: { preset: homePlate, rect: [222, 284, 190, 34], text: Offline mode }, as: b10 }
  - { command: shape.insert, params: { preset: homePlate, rect: [438, 328, 208, 34], text: Tablet layout }, as: b11 }
  - { command: shape.insert, params: { preset: homePlate, rect: [672, 284, 244, 34], text: Field photo capture }, as: b12 }
  - { command: shape.fill, params: { ids: [$b10.id, $b11.id, $b12.id], color: "#0f766e" } }
  - { command: shape.insert, params: { preset: roundRect, rect: [56, 384, 864, 106], adj: [6000] }, as: lane2 }
  - { command: shape.fill, params: { ids: [$lane2.id], color: "#fffbeb" } }
  - { command: shape.line, params: { ids: [$lane2.id], none: true } }
  - { command: arrange.sendToBack, params: { ids: [$lane2.id] } }
  - { command: insert.textBox, params: { rect: [70, 398, 130, 30], text: Integrations }, as: ln2 }
  - { command: format.size, params: { ids: [$ln2.id], size: 15 } }
  - { command: format.bold, params: { ids: [$ln2.id] } }
  - { command: format.color, params: { ids: [$ln2.id], color: "#b45309" } }
  - { command: shape.insert, params: { preset: homePlate, rect: [204, 398, 172, 34], text: Accounting sync }, as: b20 }
  - { command: shape.insert, params: { preset: homePlate, rect: [402, 442, 316, 34], text: Open API v2 }, as: b21 }
  - { command: shape.insert, params: { preset: homePlate, rect: [744, 398, 172, 34], text: Partner marketplace }, as: b22 }
  - { command: shape.fill, params: { ids: [$b20.id, $b21.id, $b22.id], color: "#b45309" } }
  - { command: shape.line, params: { ids: [$b00.id, $b01.id, $b10.id, $b11.id, $b12.id, $b20.id, $b21.id, $b22.id], none: true } }
  - { command: format.size, params: { ids: [$b00.id, $b01.id, $b10.id, $b11.id, $b12.id, $b20.id, $b21.id, $b22.id], size: 12 } }
  - { command: format.bold, params: { ids: [$b00.id, $b01.id, $b10.id, $b11.id, $b12.id, $b20.id, $b21.id, $b22.id] } }
  - { command: format.color, params: { ids: [$b00.id, $b01.id, $b10.id, $b11.id, $b12.id, $b20.id, $b21.id, $b22.id], color: "#ffffff" } }
  - { command: format.align, params: { ids: [$b00.id, $b01.id, $b10.id, $b11.id, $b12.id, $b20.id, $b21.id, $b22.id], align: left } }
  - { command: format.margins, params: { ids: [$b00.id, $b01.id, $b10.id, $b11.id, $b12.id, $b20.id, $b21.id, $b22.id], left: 12 } }
  - { command: shape.freeform, params: { points: [[299, 146], [299, 498]] }, as: today }
  - { command: shape.line, params: { ids: [$today.id], color: "#e11d48", width: 2, dash: dash } }
  - { command: arrange.reorder, params: { id: $today.id, index: 3 } }
  - { command: shape.insert, params: { preset: roundRect, rect: [272, 498, 54, 20], text: Today, adj: [50000] }, as: todayl }
  - { command: shape.fill, params: { ids: [$todayl.id], color: "#e11d48" } }
  - { command: shape.line, params: { ids: [$todayl.id], none: true } }
  - { command: format.size, params: { ids: [$todayl.id], size: 10 } }
  - { command: format.bold, params: { ids: [$todayl.id] } }
  - { command: format.color, params: { ids: [$todayl.id], color: "#ffffff" } }
  - { command: format.margins, params: { ids: [$todayl.id], left: 0, right: 0, top: 0, bottom: 0 } }
  - { command: slide.inspect, params: { index: 0 }, as: slide }
expected:
  - actual: inspect
    values:
      slides: { count: 1 }
  - actual: results
    values:
      slide.shapes: { any: { preset: homePlate, text: Open API v2, fill: "#B45309" } }
      slide.design: { none: { code: design.low-contrast } }
diagnostics: []
since: "2026-11-09"

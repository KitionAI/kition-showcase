format: 1
id: slide/annual-report-highlights
title: Annual Report Highlights
summary: A "year at a glance" spread in a serif face, with four headline figures between hairline rules and a five-year revenue column chart.
category: Business Reports
tags: [annual-report, kpi, chart, serif]
features: [slide.charts.edit, slide.format.character, slide.design.themes]
description: |
  The look of a printed annual report on a slide: a cream page, Lora for the figures and headings,
  a forest-green accent, hairline rules between four headline numbers and a column chart whose
  colour comes from the theme's first accent.
document: { name: annual-report-highlights.pptx, width: 960, height: 540 }
fonts: [inter/Inter-Variable.ttf, lora/Lora-Variable.ttf]
steps:
  - { command: design.colors, params: { colors: { accent1: "#2f5d50", accent2: "#c08a3e" } } }
  - { command: design.fonts, params: { major: Lora, minor: Inter } }
  - { command: slide.layout, params: { layout: blank, index: 0 } }
  - { command: design.background, params: { color: "#f6f1e7" } }
  - { command: insert.textBox, params: { rect: [56, 34, 500, 22], text: ALDER & FINCH OUTDOOR CO.  ·  ANNUAL REPORT 2026 }, as: eyebrow }
  - { command: format.size, params: { ids: [$eyebrow.id], size: 11 } }
  - { command: format.spacing, params: { ids: [$eyebrow.id], pt: 2 } }
  - { command: format.color, params: { ids: [$eyebrow.id], color: "#75562a" } }
  - { command: insert.textBox, params: { rect: [56, 58, 700, 56], text: The year at a glance }, as: title }
  - { command: format.font, params: { ids: [$title.id], family: Lora } }
  - { command: format.size, params: { ids: [$title.id], size: 36 } }
  - { command: format.bold, params: { ids: [$title.id] } }
  - { command: format.color, params: { ids: [$title.id], color: "#1f3a33" } }
  - { command: shape.freeform, params: { points: [[64, 128], [896, 128]] }, as: r1 }
  - { command: shape.freeform, params: { points: [[64, 246], [896, 246]] }, as: r2 }
  - { command: shape.freeform, params: { points: [[272, 142], [272, 232]] }, as: v1 }
  - { command: shape.freeform, params: { points: [[480, 142], [480, 232]] }, as: v2 }
  - { command: shape.freeform, params: { points: [[688, 142], [688, 232]] }, as: v3 }
  - { command: shape.line, params: { ids: [$r1.id, $r2.id], color: "#1f3a33", width: 0.75 } }
  - { command: shape.line, params: { ids: [$v1.id, $v2.id, $v3.id], color: "#cbbf9f", width: 0.75 } }
  - { command: insert.textBox, params: { rect: [56, 140, 208, 100], text: "$$182M\nNet revenue, up 14%" }, as: k1 }
  - { command: insert.textBox, params: { rect: [280, 140, 200, 100], text: "64\nStores, nine opened this year" }, as: k2 }
  - { command: insert.textBox, params: { rect: [488, 140, 200, 100], text: "1.3M\nMembers in the repair club" }, as: k3 }
  - { command: insert.textBox, params: { rect: [696, 140, 208, 100], text: "−22%\nCarbon per product sold" }, as: k4 }
  - { command: format.size, params: { ids: [$k1.id, $k2.id, $k3.id, $k4.id], size: 13 } }
  - { command: format.color, params: { ids: [$k1.id, $k2.id, $k3.id, $k4.id], color: "#4b5a52" } }
  - { command: text.edit, params: { id: $k1.id, at: [0, 0] } }
  - { command: text.selectParagraph, params: { at: [0, 0] } }
  - { command: format.font, params: { family: Lora } }
  - { command: format.size, params: { size: 40 } }
  - { command: format.color, params: { color: "#2f5d50" } }
  - { command: text.edit, params: { id: $k2.id, at: [0, 0] } }
  - { command: text.selectParagraph, params: { at: [0, 0] } }
  - { command: format.font, params: { family: Lora } }
  - { command: format.size, params: { size: 40 } }
  - { command: format.color, params: { color: "#2f5d50" } }
  - { command: text.edit, params: { id: $k3.id, at: [0, 0] } }
  - { command: text.selectParagraph, params: { at: [0, 0] } }
  - { command: format.font, params: { family: Lora } }
  - { command: format.size, params: { size: 40 } }
  - { command: format.color, params: { color: "#2f5d50" } }
  - { command: text.edit, params: { id: $k4.id, at: [0, 0] } }
  - { command: text.selectParagraph, params: { at: [0, 0] } }
  - { command: format.font, params: { family: Lora } }
  - { command: format.size, params: { size: 40 } }
  - { command: format.color, params: { color: "#a8742b" } }
  - { command: text.exit, params: {} }
  - { command: insert.textBox, params: { rect: [56, 266, 280, 30], text: "Net revenue, $M" }, as: ctitle }
  - { command: format.font, params: { ids: [$ctitle.id], family: Lora } }
  - { command: format.size, params: { ids: [$ctitle.id], size: 16 } }
  - { command: format.bold, params: { ids: [$ctitle.id] } }
  - { command: format.color, params: { ids: [$ctitle.id], color: "#1f3a33" } }
  - command: insert.chart
    params:
      type: column
      rect: [48, 292, 560, 220]
      categories: ["2022", "2023", "2024", "2025", "2026"]
      series:
        - { name: Net revenue, values: [108, 121, 139, 160, 182] }
    as: chart
  - { command: chart.options, params: { id: $chart.id, title: null, legend: null, dataLabels: true, gridlines: false } }
  - { command: insert.textBox, params: { rect: [648, 270, 256, 240], text: "“We grew by fixing more than we sold: repairs and rentals were a fifth of revenue and the fastest-growing part of it.”\nChair’s letter, page 4" }, as: quote }
  - { command: format.font, params: { ids: [$quote.id], family: Lora } }
  - { command: format.size, params: { ids: [$quote.id], size: 17 } }
  - { command: format.italic, params: { ids: [$quote.id] } }
  - { command: format.color, params: { ids: [$quote.id], color: "#1f3a33" } }
  - { command: format.paragraph, params: { ids: [$quote.id], spaceAfter: 12, lineSpacing: 1.2 } }
  - { command: text.edit, params: { id: $quote.id, at: [1, 0] } }
  - { command: text.selectParagraph, params: { at: [1, 0] } }
  - { command: format.italic, params: { on: false } }
  - { command: format.font, params: { family: Inter } }
  - { command: format.size, params: { size: 11 } }
  - { command: format.color, params: { color: "#75562a" } }
  - { command: text.exit, params: {} }
  - { command: shape.inspect, params: { id: $chart.id }, as: c }
  - { command: slide.inspect, params: { index: 0 }, as: slide }
expected:
  - actual: inspect
    values:
      slides: { count: 1 }
  - actual: results
    values:
      c.shape.kind: { kind: column, dataLabels: true, gridlines: false }
      slide.shapes: { any: { text: { matches: "^\\$182M" } } }
      slide.design: { none: { code: design.low-contrast } }
diagnostics: []
since: "2026-11-09"

format: 1
id: slide/seed-pitch-deck
title: Seed Round Pitch Deck
summary: A seven-slide investor deck for a leak-detection startup, from cover and problem to market size, traction, team and the ask.
category: Pitch Decks
tags: [pitch-deck, multi-slide, chart, shapes, connectors, theme-fonts]
features: [slide.slides.manage, slide.shapes.edit, slide.charts.edit, slide.design.themes, slide.transitions.set]
featured: true
description: |
  A complete seed deck built slide by slide: a gradient cover, three problem statistics on cards,
  a three-step solution joined by connectors, concentric TAM/SAM/SOM circles, a traction chart,
  a team row and the ask with a use-of-funds doughnut. The chart colours come from the deck's own
  colour scheme, and every slide has speaker notes and a fade transition.
document: { name: seed-pitch-deck.pptx, width: 960, height: 540 }
fonts: [inter/Inter-Variable.ttf, bricolage-grotesque/BricolageGrotesque-Variable.ttf]
steps:
  - { command: design.colors, params: { colors: { dk2: "#0b1f3a", lt2: "#f5efe6", accent1: "#14b8a6", accent2: "#0b1f3a", accent3: "#f97316", accent4: "#38bdf8", accent5: "#94a3b8", accent6: "#a78bfa" } } }
  - { command: design.fonts, params: { major: Bricolage Grotesque, minor: Inter } }
  - { command: slide.layout, params: { layout: blank, index: 0 } }
  - { command: design.background, params: { color: "#f5efe6", all: true } }


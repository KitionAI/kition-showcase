format: 1
id: slide/okr-progress-dashboard
title: OKR Progress Dashboard
summary: A dark quarterly OKR check-in with three objective cards, nine key results as progress bars and a status pill on each objective.
category: Business Reports
tags: [okr, dashboard, progress-bars, dark, shapes]
features: [slide.shapes.edit, slide.format.character, slide.design.themes]
description: |
  Three objectives side by side on dark cards, each with its own accent colour. Every key result
  is a label, a percentage and a progress bar: a pill-shaped track with a second pill on top
  sized to the progress. Status pills in green and amber make the at-risk objective stand out.
document: { name: okr-progress-dashboard.pptx, width: 960, height: 540 }
fonts: [inter/Inter-Variable.ttf, bricolage-grotesque/BricolageGrotesque-Variable.ttf]

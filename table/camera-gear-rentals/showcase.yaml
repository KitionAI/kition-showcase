format: 1
id: table/camera-gear-rentals
title: Camera Gear Rentals
summary: Sixteen items of film kit with daily rates, condition ratings and availability, and four rentals that price themselves.
category: Inventory
tags: [inventory, rentals, rollup, formula, rating]
features: [table.schema, table.records, table.links, table.views]
description: |
  A rental house's stock list: each item has a daily rate, a condition rating, whether it is on the
  shelf and what it costs to replace; a formula gives the weekly rate. Rentals link to the gear they
  took; a rollup adds the daily rates and a formula multiplies by the days.
document: { name: camera-gear-rentals.ktable, width: 640, height: 420 }
steps:
  - {"command": "table.tables.delete", "params": {"tableId": 1}}
  - {"command": "table.tables.create", "params": {"title": "Gear", "name": "gear", "fields": [{"name": "item", "title": "Item", "type": "text", "primary": true}, {"name": "category", "title": "Category", "type": "single_select", "options": {"choices": ["Aerial", "Audio", "Cameras", "Lenses", "Lighting", "Power", "Support"]}}, {"name": "serial", "title": "Serial", "type": "text"}, {"name": "rate", "title": "Daily rate", "type": "number"}, {"name": "condition", "title": "Condition", "type": "rating", "options": {"max": 5}}, {"name": "available", "title": "Available", "type": "checkbox"}, {"name": "value", "title": "Replacement value", "type": "number"}, {"name": "weekly", "title": "Weekly rate", "type": "formula", "formula": "{rate} * 5"}]}, "as": "t_gear"}
  - {"command": "table.transact", "params": {"ops": [{"op": "records.create", "tableId": "$t_gear.result.id", "records": [{"item": "Mirrorless body A", "category": "Cameras", "serial": "CB-2041", "rate": 45, "condition": 5, "available": true, "value": 2550}, {"item": "Mirrorless body B", "category": "Cameras", "serial": "CB-2042", "rate": 45, "condition": 4, "available": false, "value": 2550}, {"item": "Cinema camera", "category": "Cameras", "serial": "CC-0907", "rate": 120, "condition": 5, "available": true, "value": 6900}, {"item": "24–70 mm f/2.8 zoom", "category": "Lenses", "serial": "LZ-2470", "rate": 30, "condition": 5, "available": false, "value": 1890}, {"item": "50 mm f/1.4 prime", "category": "Lenses", "serial": "LP-0050", "rate": 15, "condition": 4, "available": true, "value": 520}, {"item": "85 mm f/1.8 prime", "category": "Lenses", "serial": "LP-0085", "rate": 18, "condition": 5, "available": true, "value": 640}, {"item": "70–200 mm f/4 zoom", "category": "Lenses", "serial": "LZ-7020", "rate": 28, "condition": 3, "available": false, "value": 1390}, {"item": "LED panel 60 W", "category": "Lighting", "serial": "LT-0060", "rate": 20, "condition": 4, "available": true, "value": 410}, {"item": "Softbox 90 cm", "category": "Lighting", "serial": "LT-SB90", "rate": 8, "condition": 3, "available": true, "value": 120}, {"item": "Gimbal stabiliser", "category": "Support", "serial": "SP-GB03", "rate": 25, "condition": 4, "available": false, "value": 690}, {"item": "Carbon tripod", "category": "Support", "serial": "SP-TR11", "rate": 12, "condition": 5, "available": true, "value": 380}, {"item": "Shotgun microphone", "category": "Audio", "serial": "AU-SG02", "rate": 14, "condition": 5, "available": false, "value": 330}, {"item": "Wireless lav kit", "category": "Audio", "serial": "AU-LV2C", "rate": 22, "condition": 4, "available": true, "value": 560}, {"item": "Field recorder", "category": "Audio", "serial": "AU-FR06", "rate": 16, "condition": 3, "available": true, "value": 450}, {"item": "V-mount battery pair", "category": "Power", "serial": "PW-VM02", "rate": 12, "condition": 4, "available": false, "value": 520}, {"item": "Drone, 4K", "category": "Aerial", "serial": "AR-DR04", "rate": 70, "condition": 4, "available": true, "value": 1650}]}]}, "as": "tx_gear_0"}
  - {"command": "table.tables.create", "params": {"title": "Rentals", "name": "rentals", "fields": [{"name": "customer", "title": "Customer", "type": "text", "primary": true}, {"name": "start", "title": "Start", "type": "date"}, {"name": "days", "title": "Days", "type": "number"}]}, "as": "t_rentals"}
  - {"command": "table.transact", "params": {"ops": [{"op": "records.create", "tableId": "$t_rentals.result.id", "records": [{"customer": "Harbourline Films", "start": "2026-11-04", "days": 3}, {"customer": "Elm Street Weddings", "start": "2026-11-06", "days": 2}, {"customer": "Copper Kettle Café ad", "start": "2026-11-07", "days": 1}, {"customer": "Studio Nine", "start": "2026-11-08", "days": 5}]}]}, "as": "tx_rentals_0"}
  - {"command": "table.fields.create", "params": {"tableId": "$t_rentals.result.id", "name": "gear", "title": "Gear", "type": "link_to_record", "options": {"target_table_id": "$t_gear.result.id", "allow_multiple": true}}, "as": "f_rentals_gear"}
  - {"command":"table.transact","params":{"ops":[{"op":"cells.set","tableId":"$t_rentals.result.id","records":[{"rowKey":"$tx_rentals_0.result.created.0","values":{"gear":["$tx_gear_0.result.created.1","$tx_gear_0.result.created.3","$tx_gear_0.result.created.11"]}},{"rowKey":"$tx_rentals_0.result.created.1","values":{"gear":["$tx_gear_0.result.created.6","$tx_gear_0.result.created.9"]}},{"rowKey":"$tx_rentals_0.result.created.2","values":{"gear":["$tx_gear_0.result.created.14","$tx_gear_0.result.created.12"]}},{"rowKey":"$tx_rentals_0.result.created.3","values":{"gear":["$tx_gear_0.result.created.1","$tx_gear_0.result.created.3","$tx_gear_0.result.created.6","$tx_gear_0.result.created.9","$tx_gear_0.result.created.11","$tx_gear_0.result.created.14"]}}]}]}}
  - {"command": "table.fields.create", "params": {"tableId": "$t_rentals.result.id", "name": "day_rate", "title": "Day rate", "type": "rollup", "options": {"link_field_id": "$f_rentals_gear.result.id", "target_field_id": "$t_gear.result.fields.3.id", "aggregation": "sum"}}, "as": "f_rentals_day_rate"}
  - {"command": "table.fields.create", "params": {"tableId": "$t_rentals.result.id", "name": "total", "title": "Total", "type": "formula", "formula": "{day_rate} * {days}"}, "as": "f_rentals_total"}
  - {"command": "table.views.create", "params": {"tableId": "$t_gear.result.id", "title": "On the shelf", "type": "grid"}, "as": "shelf"}
  - {"command": "table.views.putFilterTree", "params": {"tableId": "$t_gear.result.id", "viewId": "$shelf.result.id", "tree": {"conjunction": "and", "children": [{"condition": {"field_id": "$t_gear.result.fields.5.id", "operator": "eq", "value": true}}]}}}
  - {"command": "table.views.putGroups", "params": {"tableId": "$t_gear.result.id", "viewId": "$shelf.result.id", "items": [{"field_id": "$t_gear.result.fields.1.id", "direction": "asc"}]}}
  - {"command": "table.views.create", "params": {"tableId": "$t_gear.result.id", "title": "Out on hire", "type": "grid"}, "as": "out"}
  - {"command": "table.views.putFilterTree", "params": {"tableId": "$t_gear.result.id", "viewId": "$out.result.id", "tree": {"conjunction": "and", "children": [{"condition": {"field_id": "$t_gear.result.fields.5.id", "operator": "eq", "value": false}}]}}}
  - {"command": "table.records.list", "params": {"tableId": "$t_gear.result.id", "limit": 100}, "as": "g"}
  - {"command": "table.records.list", "params": {"tableId": "$t_rentals.result.id", "limit": 100}, "as": "r"}
thumbnail: { steps: [{"command": "table.preview.show", "params": {"viewId": "$shelf.result.id"}, "as": "shown"}], area: [0, 0, 1100, 688] }
expected:
  - actual: inspect
    values:
      tables: [{ title: Gear }, { title: Rentals }]
  - actual: results
    values:
      shown.result: { view: On the shelf, viewType: grid, records: 10 }
      g.result.total: 16
      g.result.items.2.values: { weekly: 600, condition: 5 }
      r.result.items.0.values: { day_rate: 89, total: 267 }
      r.result.items.3.values: { day_rate: 154, total: 770 }
diagnostics: []
since: "2026-11-09"

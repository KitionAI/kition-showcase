format: 1
id: scene/apartment-facade-arrays
title: Apartment Facade Arrays
summary: A six-storey apartment block whose windows, balconies and fins are each one object repeated by Array modifiers, in low evening sun.
category: Architecture & Interiors
tags: [architecture, array, facade, sun-light, wide-angle]
features: [scene.modifier.basics, scene.modifier.stack, scene.object.add, scene.material.basics, scene.render.lights-world, scene.viewport.rendered]
description: |
  An architectural massing render where repetition does the work. One window (a glass pane in a
  dark frame) becomes the whole grid with two Array modifiers, eight across and six up; the
  balcony slabs and the vertical timber fins are single objects with their own arrays. The
  concrete body, a glazed ground-floor lobby, a pavement and two round trees set the scale, and a
  warm, low sun throws long shadows across the facade under a pale blue sky.
document: { name: apartment-facade-arrays.kscene, width: 1024, height: 576 }
steps:
  - { command: edit.delete, params: { objects: [Cube, Light] } }
  - { command: material.delete, params: { material: Material } }
  - { command: render.set, params: { width: 1920, height: 1080, view: agx } }
  - { command: add.plane, params: { name: Ground, size: 300, location: [0, 0, 0] } }
  - { command: material.new, params: { name: Pavement, baseColor: "#b9b3aa", roughness: 0.9 } }
  - { command: add.cube, params: { name: Building, size: 1, location: [0, 2, 6.6], scale: [16, 4, 13.2] } }
  - { command: material.new, params: { name: Board-marked Concrete, baseColor: "#d8d2c8", roughness: 0.85 } }
  - { command: add.cube, params: { name: Lobby Glass, size: 1, location: [0, -0.02, 1.2], scale: [14, 0.1, 2.2] } }
  - { command: material.new, params: { name: Lobby Glazing, baseColor: "#2b3c48", roughness: 0.05, metallic: 0.3 } }
  - { command: add.cube, params: { name: Window, size: 1, location: [-6.65, -0.02, 3.6], scale: [1.3, 0.1, 1.5] } }
  - { command: modifier.add, params: { object: Window, type: array, count: 8, relativeOffset: [1.46, 0, 0] } }
  - { command: modifier.add, params: { object: Window, type: array, count: 5, relativeOffset: [0, 0, 1.4] } }
  - { command: material.new, params: { name: Window Glass, baseColor: "#33495a", roughness: 0.08, metallic: 0.4 } }
  - { command: add.cube, params: { name: Balconies, size: 1, location: [-4.75, -0.6, 2.75], scale: [3.4, 1.2, 0.18] } }
  - { command: modifier.add, params: { object: Balconies, type: array, count: 3, relativeOffset: [1.4, 0, 0] } }
  - { command: modifier.add, params: { object: Balconies, type: array, count: 5, relativeOffset: [0, 0, 11.67] } }
  - { command: modifier.add, params: { object: Balconies, type: bevel, width: 0.02, segments: 2 } }

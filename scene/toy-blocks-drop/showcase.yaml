format: 1
id: scene/toy-blocks-drop
title: Toy Blocks Drop
summary: Three wooden alphabet blocks fall into a stack one after another with squash and bounce, shown mid-fall at frame 30.
category: Abstract & Motion
tags: [animation, keyframes, drop, parenting, text]
features: [scene.animation.keyframes, scene.animation.timeline, scene.object.transform, scene.curve.text-lattice, scene.modifier.basics, scene.viewport.rendered]
description: |
  A playful product-style animation keyed with object.drop: each block falls from three metres
  as under gravity, stretches as it lands, squashes, bounces and settles, starting 1, 8 and 20
  frames in. The letters are extruded text objects parented to their blocks, so they ride along.
  The thumbnail sets the timeline to frame 30, when the C block is still dropping onto the pair
  below; the saved file plays the full 60-frame shot.
document: { name: toy-blocks-drop.kscene, width: 1024, height: 576 }
steps:
  - { command: edit.delete, params: { objects: [Cube, Light] } }
  - { command: material.delete, params: { material: Material } }
  - { command: render.set, params: { width: 1920, height: 1080, view: agx } }
  - { command: frame.range, params: { start: 1, end: 60, fps: 24 } }
  - { command: add.backdrop, params: { name: Set, width: 40, depth: 12, height: 8, radius: 3, segments: 24, location: [0, -3, 0] } }
  - { command: material.new, params: { name: Sky Blue Paper, baseColor: "#9fd0ea", roughness: 0.9 } }
  - { command: add.cube, params: { name: Block A, size: 0.8, location: [-0.45, 0, 0.4], rotation: [0, 0, -8] } }
  - { command: add.cube, params: { name: Block B, size: 0.8, location: [0.45, 0.05, 0.4], rotation: [0, 0, 6] } }
  - { command: add.cube, params: { name: Block C, size: 0.8, location: [0.02, 0.02, 1.2], rotation: [0, 0, 14] } }
  - { command: modifier.add, params: { object: Block A, type: bevel, width: 0.05, segments: 3 } }
  - { command: modifier.add, params: { object: Block B, type: bevel, width: 0.05, segments: 3 } }
  - { command: modifier.add, params: { object: Block C, type: bevel, width: 0.05, segments: 3 } }
  - { command: material.new, params: { name: Beech, baseColor: "#e8c48e", roughness: 0.6, assign: false } }
  - { command: material.assign, params: { material: Beech, objects: [Block A, Block B, Block C] } }
  - { command: add.text, params: { name: Letter A, body: A, size: 0.55, location: [-0.45, 0, 0.4] } }
  - { command: add.text, params: { name: Letter B, body: B, size: 0.55, location: [0.45, 0.05, 0.4] } }
  - { command: add.text, params: { name: Letter C, body: C, size: 0.55, location: [0.02, 0.02, 1.2] } }
  - { command: text.set, params: { object: Letter A, align: center, extrude: 0.03, bevelDepth: 0.008, offsetY: -0.2 } }
  - { command: text.set, params: { object: Letter B, align: center, extrude: 0.03, bevelDepth: 0.008, offsetY: -0.2 } }
  - { command: text.set, params: { object: Letter C, align: center, extrude: 0.03, bevelDepth: 0.008, offsetY: -0.2 } }
  - { command: object.transform, params: { objects: [Letter A], location: [-0.45, -0.41, 0.4], rotation: [90, 0, 0] } }
  - { command: object.transform, params: { objects: [Letter B], location: [0.45, -0.36, 0.4], rotation: [90, 0, 0] } }
  - { command: object.transform, params: { objects: [Letter C], location: [0.02, -0.39, 1.2], rotation: [90, 0, 0] } }
  - { command: material.new, params: { name: Red Paint, baseColor: "#e0453a", roughness: 0.35, assign: false } }
  - { command: material.assign, params: { material: Red Paint, objects: [Letter A] } }
  - { command: material.new, params: { name: Green Paint, baseColor: "#3aa35b", roughness: 0.35, assign: false } }
  - { command: material.assign, params: { material: Green Paint, objects: [Letter B] } }
  - { command: material.new, params: { name: Blue Paint, baseColor: "#2f6fd6", roughness: 0.35, assign: false } }
  - { command: material.assign, params: { material: Blue Paint, objects: [Letter C] } }
  - { command: object.parent, params: { objects: [Letter A], parent: Block A } }
  - { command: object.parent, params: { objects: [Letter B], parent: Block B } }
  - { command: object.parent, params: { objects: [Letter C], parent: Block C } }
  - { command: object.drop, params: { objects: [Block A], start: 1, duration: 14, height: 3, bounce: 0.06 } }
  - { command: object.drop, params: { objects: [Block B], start: 8, duration: 14, height: 3, bounce: 0.06 } }
  - { command: object.drop, params: { objects: [Block C], start: 20, duration: 14, height: 3, bounce: 0.06 } }
  - { command: add.light, params: { name: Key, kind: area, power: 900, color: "#fff4e6", location: [-3, -4, 5] } }
  - { command: object.lookAt, params: { object: Key, target: [0, 0, 0.8] } }
  - { command: light.set, params: { object: Key, radius: 2 } }
  - { command: world.set, params: { color: "#cfe8f7", strength: 0.5 } }
  - { command: object.transform, params: { objects: [Camera], location: [1.8, -7.6, 2.0] } }
  - { command: object.lookAt, params: { object: Camera, target: [0, 0, 1.45] } }
  - { command: camera.set, params: { object: Camera, lens: 38 } }
  - { command: frame.set, params: { frame: 60 } }
  - { command: select.none }
  - { command: view.overlays, params: { on: false } }
  - { command: view.camera }

format: 1
id: film/four-camera-angle-cut
title: Four Camera Angle Cut
summary: A festival recap groups four synced cameras into one multicam clip and live-cuts between the angles every two seconds.
category: Editing & Timeline
tags: [multicam, live-cut, demo-footage]
features: [film.multicam.edit, film.clip.properties]
description: |
  Four scenes stand in for four cameras that rolled together: `clip.createMulticam` lines them up
  by their In points into a source sequence called Four Angles, with camera 1's audio. One clip of
  it goes on Video 1, starts on camera 2, and a recording pass cuts to cameras 1, 3, 4 and back to
  2 at 2 s intervals. Each switch becomes an edit, so the timeline ends with five segments of the
  same multicam clip, each showing its own angle. The thumbnail is on camera 3.
document: { name: four-camera-angle-cut.kfilm, width: 1280, height: 720 }
prelude: demo-footage
steps:
  - { command: clip.createMulticam, params: { items: [5, 6, 7, 8], name: Four Angles, method: in, audio: camera1, cameraNames: clip }, as: multicam }
  - { command: file.newSequence, params: { name: Festival Recap, width: 1280, height: 720, fps: 24, video: 1, audio: 1 }, as: sequence }
  - { command: timeline.place, params: { item: $multicam.sequence, track: V1, seconds: 0, duration: 2540160000000 }, as: cams }
  - { command: multicam.switchAngle, params: { camera: 2, clips: [$cams.clips.0], time: 0 }, as: start }
  - { command: multicam.recordStart, params: { time: 0 } }
  - { command: multicam.cut, params: { camera: 1, time: 508032000000 }, as: cut1 }
  - { command: multicam.cut, params: { camera: 3, time: 1016064000000 }, as: cut2 }
  - { command: multicam.cut, params: { camera: 4, time: 1524096000000 }, as: cut3 }
  - { command: multicam.cut, params: { camera: 2, time: 2032128000000 }, as: cut4 }
  - { command: multicam.recordStop, params: { time: 2540160000000 }, as: recorded }
thumbnail: { at: 5 }
preview: { from: 0, to: 10, fps: 4, max: 400 }
expected:
  - actual: results
    values:
      multicam.cameras: [Ocean_Sunset.mp4, Aurora_Timelapse.mp4, City_Night_Drive.mp4, Desert_Dunes.mp4]
      start.angle: 1
      cut1.angle: 0
      cut2.angle: 2
      cut3.angle: 3
      cut4.angle: 1
      recorded: { cuts: 4, editPoints: 4 }
  - actual: inspect
    values:
      sequence.video.0.items: { count: 5, all: { name: Four Angles } }
      sequence.video.0.items.2.start: 1016064000000
      sequence.video.0.items.4.end: 2540160000000
      project.root.children: { any: { name: Four Angles, type: Multi-Camera Source Sequence } }
diagnostics: []
since: "2026-11-09"

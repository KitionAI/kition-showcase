format: 1
id: film/aurora-title-card
title: Aurora Title Card
summary: An opening title fades in over a moving aurora, with a slow push-in on the footage.
category: Titles & Graphics
tags: [titles, keyframes, opacity, motion, demo-footage]
features: [film.graphics.text-basics, film.effects.keyframes, film.timeline.basics]
featured: true
description: |
  The aurora scene is the kit's procedural demo footage, so the sample needs no media files.
  The title's opacity is keyframed from 0 to 100 over the first second, and the footage's
  Motion scale goes from 100 to 112 over four seconds: two keyframed parameters on two tracks.
document: { name: aurora-title-card.kfilm, width: 1280, height: 720 }
prelude: demo-footage
steps:
  - { command: file.newSequence, params: { name: Title Card, width: 1280, height: 720, fps: 24, video: 2, audio: 1 }, as: sequence }
  - { command: timeline.place, params: { item: 6, track: V1, seconds: 0, audio: false }, as: footage }
  - { command: effects.setParam, params: { clip: $footage.clips.0, effect: motion, param: scale, value: 100, seconds: 0 } }
  - { command: effects.setParam, params: { clip: $footage.clips.0, effect: motion, param: scale, value: 112, seconds: 4 } }
  - { command: graphics.newText, params: { text: NORTHERN LIGHTS, position: [640, 380], size: 96, seconds: 4, track: 1, time: 0 }, as: title }
  - { command: graphics.set, params: { clip: $title.clip, props: { font_style: Bold, align: center, tracking: 120, fill_color: "#f2f7ff", shadow: true } } }
  - { command: effects.setParam, params: { clip: $title.clip, effect: opacity, param: opacity, value: 0, seconds: 0 } }
  - { command: effects.setParam, params: { clip: $title.clip, effect: opacity, param: opacity, value: 100, seconds: 1 } }
thumbnail: { at: 2 }
preview: { from: 0, to: 3, fps: 10, max: 400 }
expected:
  - actual: inspect
    values:
      sequence.name: Title Card
      sequence.settings.width: 1280
      sequence.video.0.items: { count: 1 }
      sequence.video.1.items: { count: 1 }
      # the push-in over 4 s and the title's fade over the first second (ticks)
      sequence.video.0.items.0.effects.0.params.scale.keyframes: [{ time: 0, value: 100 }, { time: 1016064000000, value: 112 }]
      sequence.video.1.items.0.effects.1.params.opacity.keyframes: [{ time: 0, value: 0 }, { time: 254016000000, value: 100 }]
diagnostics: []
since: "2026-11-09"

format: 1
id: film/news-ticker-crawl
title: News Ticker Crawl
summary: A city-desk news bar with a red label and a headline crawl moving right to left.
category: Titles & Graphics
tags: [titles, crawl, lower-third, shapes, demo-footage]
features: [film.graphics.titles, film.graphics.text-basics]
description: |
  The news bar is one graphic clip of five layers: the white headline band, a red rule, the dark
  ticker band, the headline and a LIVE label whose red box is the text layer's own Background
  (100 % opacity, 22 px padding). The crawl is a separate text clip on the track above, made to
  move right to left across the ticker band with graphics.setRoll in crawlLeft mode.
document: { name: news-ticker-crawl.kfilm, width: 1280, height: 720 }
prelude: demo-footage
steps:
  - { command: file.newSequence, params: { name: City Desk, width: 1280, height: 720, fps: 24, video: 3, audio: 1 }, as: sequence }
  - { command: timeline.place, params: { item: 7, track: V1, seconds: 0, audio: false }, as: footage }
  - { command: graphics.newRectangle, params: { position: [640, 662], size: [1280, 56], seconds: 10, track: 1, time: 0 }, as: bar }
  - { command: graphics.set, params: { clip: $bar.clip, layer: 0, props: { name: Ticker Bar, fill_color: "#0f1626", opacity: 92 } } }
  - { command: graphics.newRectangle, params: { clip: $bar.clip, position: [640, 576], size: [1280, 116] } }
  - { command: graphics.set, params: { clip: $bar.clip, layer: 1, props: { name: Headline Bar, fill_color: "#f5f6f8" } } }
  - { command: graphics.newRectangle, params: { clip: $bar.clip, position: [640, 634], size: [1280, 4] } }
  - { command: graphics.set, params: { clip: $bar.clip, layer: 2, props: { name: Rule, fill_color: "#d7263d" } } }
  - { command: graphics.newText, params: { clip: $bar.clip, text: HARBOUR BRIDGE REOPENS AFTER NIGHT REPAIRS, position: [214, 590], size: 38, fontStyle: Bold } }
  - { command: graphics.set, params: { clip: $bar.clip, layer: 3, props: { name: Headline, fill_color: "#0f1626" } } }
  - { command: graphics.newText, params: { clip: $bar.clip, text: LIVE, position: [110, 591], size: 30, fontStyle: Bold } }
  - { command: graphics.set, params: { clip: $bar.clip, layer: 4, props: { name: Label, align: center, tracking: 120, fill_color: "#ffffff", background: true, background_color: "#d7263d", background_opacity: 100, background_size: 22 } } }
  - command: graphics.newText
    params: { text: "Traffic flowing on all six lanes  •  Night bus routes return to normal from Monday  •  Tide warning lifted for the east quay  •  Riverside market extends hours through the weekend  •", position: [0, 671], size: 24, seconds: 10, track: 2, time: 0 }
    as: crawl
  - { command: graphics.set, params: { clip: $crawl.clip, layer: 0, props: { name: Crawl, fill_color: "#e6ebf2" } } }
  - { command: graphics.setRoll, params: { clip: $crawl.clip, mode: crawlLeft, startOffScreen: true, endOffScreen: true }, as: roll }
  - { command: graphics.list, params: { clip: $bar.clip }, as: list }
thumbnail: { at: 3 }
preview: { from: 0, to: 4, fps: 10, max: 400 }
expected:
  - actual: results
    values:
      roll.roll: { mode: crawlLeft, startOffScreen: true, endOffScreen: true }
      list.layers: { count: 5 }
      list.layers.3: { name: Headline, text: HARBOUR BRIDGE REOPENS AFTER NIGHT REPAIRS }
      list.layers.4: { name: Label, text: LIVE }
  - actual: inspect
    values:
      sequence.video.1.items: { count: 1 }
      sequence.video.2.items: { count: 1 }
      sequence.video.1.items.0.effects.7.params: { background: { value: true }, background_color: { value: "#d7263d" }, background_opacity: { value: 100 }, background_size: { value: 22 } }
diagnostics: []
since: "2026-11-09"

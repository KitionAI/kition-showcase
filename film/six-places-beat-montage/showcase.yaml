format: 1
id: film/six-places-beat-montage
title: Six Places Beat Montage
summary: A summer travel recap cuts six scenes on the bar lines of its music, marked first and then edited to the markers.
category: Editing & Timeline
tags: [montage, markers, razor, music, titles, demo-footage]
features: [film.timeline.basics, film.timeline.edit, film.markers.basics, film.graphics.text-basics]
featured: true
description: |
  The editor first lays the score on Audio 1 and drops a marker on every bar line, two seconds
  apart. Each scene is then placed picture-only with `snap: markers`, so a start time a few frames
  off still lands exactly on the next bar. The score runs long, so a razor cut at 12 s splits it and
  the tail is cleared, ending the music with the last shot. The thumbnail is the final scene, under
  the recap's title.
document: { name: six-places-beat-montage.kfilm, width: 1280, height: 720 }
prelude: demo-footage
steps:
  - { command: file.newSequence, params: { name: Summer Recap, width: 1280, height: 720, fps: 24, video: 2, audio: 1 }, as: sequence }
  - { command: timeline.place, params: { item: 11, track: A1, seconds: 0, duration: 5080320000000 }, as: score }
  - { command: markers.add, params: { target: program, seconds: 0, name: Bar 1, color: Orange } }
  - { command: markers.add, params: { target: program, seconds: 2, name: Bar 2, color: Orange } }
  - { command: markers.add, params: { target: program, seconds: 4, name: Bar 3, color: Orange } }
  - { command: markers.add, params: { target: program, seconds: 6, name: Bar 4, color: Orange } }
  - { command: markers.add, params: { target: program, seconds: 8, name: Bar 5, color: Orange } }
  - { command: markers.add, params: { target: program, seconds: 10, name: Bar 6, color: Orange } }
  - { command: markers.add, params: { target: program, seconds: 12, name: End, color: Red } }
  - { command: timeline.place, params: { item: 5, track: V1, seconds: 0, sourceIn: 762048000000, duration: 508032000000, audio: false }, as: ocean }
  - { command: timeline.place, params: { item: 8, track: V1, seconds: 2.08, sourceIn: 254016000000, duration: 508032000000, audio: false, snap: markers }, as: desert }
  - { command: timeline.place, params: { item: 9, track: V1, seconds: 3.92, sourceIn: 508032000000, duration: 508032000000, audio: false, snap: markers }, as: forest }
  - { command: timeline.place, params: { item: 7, track: V1, seconds: 6.1, sourceIn: 1016064000000, duration: 508032000000, audio: false, snap: markers }, as: city }
  - { command: timeline.place, params: { item: 10, track: V1, seconds: 7.95, duration: 508032000000, audio: false, snap: markers }, as: neon }
  - { command: timeline.place, params: { item: 6, track: V1, seconds: 10.05, sourceIn: 1016064000000, duration: 508032000000, audio: false, snap: markers }, as: aurora }
  - { command: timeline.razor, params: { time: 3048192000000, track: A1 }, as: cut }
  - { command: edit.clear, params: { clips: $cut.clips } }
  - { command: graphics.newText, params: { text: ONE SUMMER, position: [640, 328], size: 36, seconds: 2, track: 1, time: 2540160000000 }, as: card }
  - { command: graphics.set, params: { clip: $card.clip, props: { font_style: Bold, align: center, tracking: 500, fill_color: "#9ff3d9" } } }
  - { command: graphics.newText, params: { clip: $card.clip, text: Six Places, position: [640, 425], size: 104 }, as: headline }
  - { command: graphics.set, params: { clip: $card.clip, layer: $headline.layer, props: { font_style: Bold, align: center, fill_color: "#ffffff", shadow: true } } }

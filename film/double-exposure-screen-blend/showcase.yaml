format: 1
id: film/double-exposure-screen-blend
title: Double Exposure Screen Blend
summary: An aurora laid over a misty forest with the Screen blend mode, making an in-camera style double exposure for a documentary title.
category: Effects & Color
tags: [blend-modes, opacity, double-exposure, titles, demo-footage]
features: [film.effects.basics, film.graphics.text-basics]
description: |
  The forest is on V1 and the aurora on V2. The aurora's Opacity effect uses the Screen blend
  mode at 85 %, so its dark sky drops away and only the light of the aurora lands on the trees,
  like two exposures on one frame of film. Brightness & Contrast on the forest deepens the trunks
  so the colour reads; the title sits on top.
document: { name: double-exposure-screen-blend.kfilm, width: 1920, height: 1080 }
prelude: demo-footage
steps:
  - { command: file.newSequence, params: { name: Lights Over The Woods, width: 1920, height: 1080, fps: 24, video: 3, audio: 1 } }
  - { command: timeline.place, params: { item: 9, track: V1, seconds: 0, audio: false }, as: forest }
  - { command: effects.apply, params: { clips: [$forest.clips.0], effect: brightness_contrast } }
  - { command: effects.setParam, params: { clip: $forest.clips.0, effect: brightness_contrast, param: brightness, value: -20 } }
  - { command: effects.setParam, params: { clip: $forest.clips.0, effect: brightness_contrast, param: contrast, value: 30 } }
  - { command: timeline.place, params: { item: 6, track: V2, seconds: 0, duration: 3048192000000, audio: false }, as: aurora }
  - { command: effects.setParam, params: { clip: $aurora.clips.0, effect: opacity, param: blend, value: Screen } }
  - { command: effects.setParam, params: { clip: $aurora.clips.0, effect: opacity, param: opacity, value: 85 } }
  - { command: graphics.newText, params: { text: WHERE THE LIGHTS LIVE, position: [960, 860], size: 96, seconds: 12, track: 2, time: 0 }, as: title }
  - { command: graphics.set, params: { clip: $title.clip, props: { font_style: Bold, align: center, tracking: 220, fill_color: "#f2fbf7", shadow: true } } }
  - { command: graphics.newText, params: { clip: $title.clip, text: A FILM ABOUT THE LONG NIGHT, position: [960, 930], size: 34 } }
  - { command: graphics.set, params: { clip: $title.clip, props: { align: center, tracking: 400, fill_color: "#a9f0d1", shadow: true } } }
thumbnail: { at: 3 }
preview: { from: 0, to: 3, fps: 8, max: 400 }
expected:
  - actual: inspect
    values:
      sequence.video.1.items.0.effects.1: { effect: opacity, params: { blend: { option: Screen }, opacity: { value: 85 } } }
      sequence.video.0.items.0.effects.0: { effect: brightness_contrast, params: { brightness: { value: -20 }, contrast: { value: 30 } } }
      sequence.video.2.items.0.name: WHERE THE LIGHTS LIVE
diagnostics: []
since: "2026-11-09"

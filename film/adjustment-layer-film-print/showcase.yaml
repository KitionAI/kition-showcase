  - actual: inspect
    values:
      sequence.video.0.items.0.effects.0: { effect: crop, params: { left: { value: 33.33 }, right: { value: 33.33 } } }
      sequence.video.0.items.0.effects.1.params.position.value: [320, 540]
      sequence.video.1.items.0.effects.0: { effect: crop, params: { left: { value: 33.33 }, right: { value: 33.33 } } }
      sequence.video.2.items.0.effects.0: { effect: crop, params: { left: { value: 33.33 }, right: { value: 33.33 } } }
      sequence.video.2.items.0.effects.1.params.position.value: [1600, 540]
      sequence.video.3.items: { count: 1 }
      sequence.video.3.items.0.effects.0.effect: lumetri
      sequence.video.3.items.0.effects.1: { effect: vignette, params: { amount: { value: -55 } } }
      sequence.video.0.items.0.effects: { none: { effect: lumetri } }

format: 1
id: film/dusk-clock-wipe
title: Dusk Clock Wipe
summary: A time-lapse sweeps from the afternoon dunes to the aurora night with a clock wipe that turns like a dial.
category: Transitions
tags: [transitions, wipe, clock-wipe, demo-footage]
features: [film.transitions.basics, film.timeline.basics]
description: |
  A Clock Wipe two seconds long sits on the cut at 4 s; the hand sweeps once around the centre of
  the frame with a thin pale border, the classic way to say that hours have passed. The thumbnail is
  a little past the middle of the sweep.
document: { name: dusk-clock-wipe.kfilm, width: 1280, height: 720 }
prelude: demo-footage
steps:
  - { command: file.newSequence, params: { name: Hours Pass, width: 1280, height: 720, fps: 24, video: 1, audio: 1 }, as: sequence }
  - { command: timeline.place, params: { item: 8, track: V1, seconds: 0, sourceIn: 0, duration: 1016064000000 }, as: outgoing }
  - { command: timeline.place, params: { item: 6, track: V1, seconds: 4, sourceIn: 254016000000, duration: 1016064000000 }, as: incoming }
  - { command: sequence.applyVideoTransition, params: { clip: $incoming.clips.0, edge: in, effect: clock_wipe, frames: 48, params: { border_width: 4, border_color: "#fff1c9" } }, as: transition }
thumbnail: { at: 4.2 }
preview: { from: 2.5, to: 6, fps: 10, max: 400 }
expected:
  - actual: inspect
    values:
      sequence.video.0.items: { count: 2 }
      sequence.video.0.items.1.name: Aurora_Timelapse.mp4
      sequence.video.0.transitions: { count: 1 }
      sequence.video.0.transitions.0.effect: clock_wipe
      sequence.video.0.transitions.0.duration: 508032000000
      sequence.video.0.transitions.0.params.border_width: { value: 4 }
diagnostics: []
since: "2026-11-09"

format: 1
id: film/city-escape-iris-reveal
title: City Escape Iris Reveal
summary: A weekend-getaway promo opens a round iris in the middle of the night traffic to reveal the sea at sunset.
category: Transitions
tags: [transitions, iris, wipe, demo-footage]
features: [film.transitions.basics, film.timeline.basics]
description: |
  An Iris Round 30 frames long sits on the cut at 4 s. The circle opens from the centre of the
  frame with a 6 px warm border, so for the length of the transition the sunset shows through a
  porthole in the city. The thumbnail is the middle of the iris.
document: { name: city-escape-iris-reveal.kfilm, width: 1280, height: 720 }
prelude: demo-footage
steps:
  - { command: file.newSequence, params: { name: Weekend Escape, width: 1280, height: 720, fps: 24, video: 1, audio: 1 }, as: sequence }
  - { command: timeline.place, params: { item: 7, track: V1, seconds: 0, sourceIn: 0, duration: 1016064000000 }, as: outgoing }
  - { command: timeline.place, params: { item: 5, track: V1, seconds: 4, sourceIn: 508032000000, duration: 1016064000000 }, as: incoming }
  - { command: sequence.applyVideoTransition, params: { clip: $incoming.clips.0, edge: in, effect: iris_round, frames: 30, params: { border_width: 6, border_color: "#ffd9a0" } }, as: transition }
thumbnail: { at: 4 }
preview: { from: 2.5, to: 5.5, fps: 10, max: 400 }

      sequence.video.0.transitions.0.effect: push
      sequence.video.0.transitions.0.duration: 190512000000
      sequence.video.0.transitions.0.params.direction: { value: 1, option: From East }
      sequence.video.0.transitions.0.params.motion_blur: { value: 25 }

format: 1
id: film/waves-first-j-and-l-cuts
title: Waves First J and L Cuts
summary: A coastal short lets the sound of the sea arrive a second before its picture and linger a second after it.
category: Editing & Timeline
tags: [j-cut, l-cut, linked-clips, roll, demo-footage]
features: [film.timeline.edit, film.timeline.basics]
description: |
  Three scenes are placed with their sound, so each video clip is linked to its audio clip. Two
  rolling edits on Audio 1 only then split the cuts: the ocean's sound rolls 24 frames earlier
  under the night drive (a J-cut, heard before it is seen), and 24 frames later under the forest
  (an L-cut, still heard after the picture has moved on). The picture cuts stay at 5 s and 10 s and
  the total length does not change. The short's title sits on Video 2 over the ocean. The thumbnail is the ocean, the scene whose sound overlaps both
  of its neighbours.
document: { name: waves-first-j-and-l-cuts.kfilm, width: 1280, height: 720 }
prelude: demo-footage
steps:
  - { command: file.newSequence, params: { name: Coastal Short, width: 1280, height: 720, fps: 24, video: 1, audio: 1 }, as: sequence }
  - { command: timeline.place, params: { item: 7, track: V1, seconds: 0, sourceIn: 254016000000, duration: 1270080000000 }, as: city }
  - { command: timeline.place, params: { item: 5, track: V1, seconds: 5, sourceIn: 762048000000, duration: 1270080000000 }, as: ocean }
  - { command: timeline.place, params: { item: 9, track: V1, seconds: 10, sourceIn: 254016000000, duration: 1270080000000 }, as: forest }
  - { command: sequence.addTracks, params: { video: 1 } }
  - { command: graphics.newText, params: { text: LOW TIDE, position: [640, 196], size: 64, seconds: 4, track: 1, time: 1397088000000 }, as: title }
  - { command: graphics.set, params: { clip: $title.clip, props: { font_style: Bold, align: center, tracking: 600, fill_color: "#fff4e6", shadow: true } } }
  - { command: timeline.roll, params: { left: $city.clips.1, right: $ocean.clips.1, deltaFrames: -24 }, as: jcut }
  - { command: timeline.roll, params: { left: $ocean.clips.1, right: $forest.clips.1, deltaFrames: 24 }, as: lcut }
thumbnail: { at: 7.5 }
preview: { from: 3, to: 12, fps: 5, max: 400 }

format: 1
id: film/vertical-blur-backdrop
title: Vertical Blur Backdrop
summary: A landscape clip fitted into a 9:16 vertical frame over a blurred, enlarged copy of itself instead of black bars.
category: Effects & Color
tags: [blur, vertical, social, motion, demo-footage]
features: [film.effects.basics, film.graphics.text-basics]
description: |
  The usual fix for horizontal footage in a vertical story: the clip is placed twice. The copy on
  V1 is scaled to 178 % so it fills the 1080 × 1920 frame, then softened with Gaussian Blur and
  darkened with Brightness & Contrast; the sharp copy on V2 is scaled to 56.25 % so its width
  matches the frame. A caption names the moment.
document: { name: vertical-blur-backdrop.kfilm, width: 1080, height: 1920 }
prelude: demo-footage
steps:
  - { command: file.newSequence, params: { name: Ferry Story, width: 1080, height: 1920, fps: 30, video: 3, audio: 1 } }
  - { command: timeline.place, params: { item: 5, track: V1, seconds: 0, audio: false }, as: backdrop }
  - { command: effects.setParam, params: { clip: $backdrop.clips.0, effect: motion, param: scale, value: 178 } }
  - { command: effects.apply, params: { clips: [$backdrop.clips.0], effect: gaussian_blur } }
  - { command: effects.setParam, params: { clip: $backdrop.clips.0, effect: gaussian_blur, param: blurriness, value: 80 } }
  - { command: effects.setParam, params: { clip: $backdrop.clips.0, effect: gaussian_blur, param: repeat_edge, value: true } }
  - { command: effects.apply, params: { clips: [$backdrop.clips.0], effect: brightness_contrast } }
  - { command: effects.setParam, params: { clip: $backdrop.clips.0, effect: brightness_contrast, param: brightness, value: -25 } }
  - { command: timeline.place, params: { item: 5, track: V2, seconds: 0, audio: false }, as: picture }
  - { command: effects.setParam, params: { clip: $picture.clips.0, effect: motion, param: scale, value: 56.25 } }
  - { command: graphics.newText, params: { text: golden hour from the ferry, position: [540, 560], size: 64, seconds: 18, track: 2, time: 0 }, as: caption }
  - { command: graphics.set, params: { clip: $caption.clip, props: { font_style: Bold, align: center, fill_color: "#ffffff", shadow: true } } }
  - { command: graphics.newText, params: { clip: $caption.clip, text: day 4 · somewhere west, position: [540, 1440], size: 44 } }
  - { command: graphics.set, params: { clip: $caption.clip, props: { align: center, fill_color: "#f6dcc0" } } }
thumbnail: { at: 4 }
preview: { from: 0, to: 3, fps: 8, max: 300 }
expected:
  - actual: inspect
    values:
      sequence.settings.width: 1080
      sequence.settings.height: 1920
      sequence.video.0.items.0.effects.0: { effect: gaussian_blur, params: { blurriness: { value: 80 }, repeat_edge: { value: true } } }
      sequence.video.0.items.0.effects.1: { effect: brightness_contrast, params: { brightness: { value: -25 } } }
      sequence.video.0.items.0.effects.2: { effect: motion, params: { scale: { value: 178 } } }
      sequence.video.1.items.0.effects.0: { effect: motion, params: { scale: { value: 56.25 } } }
diagnostics: []
since: "2026-11-09"

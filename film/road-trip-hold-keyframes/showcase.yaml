format: 1
id: film/road-trip-hold-keyframes
title: Road Trip Hold Keyframes
summary: A travel-map graphic where a marker jumps from town to town on hold keyframes instead of sliding between them.
category: Keyframes & Motion
tags: [keyframes, motion, hold, shapes, graphics]
features: [film.effects.keyframes, film.graphics.text-basics, film.file.new-items]
description: |
  The map is built from graphics: a sand-coloured Color Matte, a route path, four town
  pins with names. The red marker is its own graphic clip whose Motion position has a keyframe
  on each town, one second apart. Every keyframe uses hold interpolation, so the marker stays
  put for a second and then jumps to the next town, the stop-motion look of a travel recap.
document: { name: road-trip-hold-keyframes.kfilm, width: 1920, height: 1080 }
steps:
  - { command: sequence.settings, params: { name: Route Recap, fps: 24 } }
  - { command: file.newColorMatte, params: { color: "#efe4cc", seconds: 6 }, as: matte }
  - { command: timeline.place, params: { item: $matte.item, track: V1, seconds: 0 } }
  # The route is a thin filled path in frame pixels: out along the towns and back 12 px to the side.
  - { command: graphics.newShape, params: { shape: path, points: [[363.9, 764.6], [760.8, 427.2], [1180.9, 647.2], [1564, 304.5], [1556, 295.5], [1179.1, 632.8], [759.2, 412.8], [356.1, 755.4]], seconds: 6, track: 1, time: 0 }, as: map }
  - { command: graphics.set, params: { clip: $map.clip, props: { fill_color: "#c9b48c" } } }
  - { command: graphics.newEllipse, params: { clip: $map.clip, position: [360, 760], size: [36, 36] } }
  - { command: graphics.set, params: { clip: $map.clip, props: { fill_color: "#3d5a6c" } } }

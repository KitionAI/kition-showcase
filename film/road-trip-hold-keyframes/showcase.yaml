  - { command: graphics.newEllipse, params: { clip: $map.clip, position: [1560, 300], size: [36, 36] } }
  - { command: graphics.set, params: { clip: $map.clip, props: { fill_color: "#3d5a6c" } } }
  - { command: graphics.newText, params: { clip: $map.clip, text: Saltmarsh, position: [360, 840], size: 40 } }

    values:
      sequence.video.0.items.0.effects.0.params.look_lut.value: { contains: look-warm-film }
      sequence.video.0.items.0.effects.1.params: { scale: { value: 49.6 } }
      sequence.video.1.items.0.effects.0.params.look_lut.value: { contains: look-cool-blue }
      sequence.video.1.items.0.effects.1.params: { scale: { value: 49.6 } }
      sequence.video.2.items.0.effects.0.params.look_lut.value: { contains: look-bleach-bypass }
      sequence.video.2.items.0.effects.1.params: { scale: { value: 49.6 } }
      sequence.video.3.items.0.effects.0.params.look_lut.value: { contains: look-night }
      sequence.video.3.items.0.effects.1.params: { scale: { value: 49.6 } }
      sequence.video.4.items.0.effects: { count: 7 }

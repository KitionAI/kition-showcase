format: 1
id: film/two-host-podcast-mixer
title: Two-Host Podcast Mixer
summary: A video podcast's audio mix set in the track mixer, with the two hosts panned apart, a voices submix with compression and a limiter on the master.
category: Audio
tags: [audio, mixer, submix, panning, podcast]
features: [film.audio.mixing, film.audio.basics, film.graphics.text-basics]
description: |
  Three audio tracks are set up the way a podcast editor would: Host on A1 at −1 dB panned 35 %
  left, Guest on A2 at +1.5 dB panned 35 % right, Music on A3 at −14 dB. Both voices are routed
  to a Voices submix (mixer.addSubmix, mixer.setStrip output) carrying Dynamics Processing as an
  insert, and the Mix has a Hard Limiter at −1 dB. The demo project's ambience recordings stand
  in for the voices. The card on screen mirrors the mix: who sits on which side, and at what level.
document: { name: two-host-podcast-mixer.kfilm, width: 1920, height: 1080 }
prelude: demo-footage
steps:
  - { command: file.newSequence, params: { name: The Long Table 31, width: 1920, height: 1080, fps: 30, video: 2, audio: 3 } }
  - { command: timeline.place, params: { item: 9, track: A1, seconds: 0, video: false, duration: 2540160000000 }, as: host }
  - { command: timeline.place, params: { item: 7, track: A2, seconds: 0, video: false, duration: 2540160000000 }, as: guest }
  - { command: timeline.place, params: { item: 11, track: A3, seconds: 0, video: false, duration: 2540160000000 }, as: music }
  - { command: mixer.setStrip, params: { strip: A1, name: Host, volumeDb: -1, pan: -0.35 } }
  - { command: mixer.setStrip, params: { strip: A2, name: Guest, volumeDb: 1.5, pan: 0.35 } }
  - { command: mixer.setStrip, params: { strip: A3, name: Music, volumeDb: -14 } }
  - { command: mixer.addSubmix, params: { name: Voices }, as: voices }
  - { command: mixer.setStrip, params: { strip: A1, output: S1 } }
  - { command: mixer.setStrip, params: { strip: A2, output: S1 } }
  - { command: mixer.addInsert, params: { strip: S1, effect: dynamics }, as: compressor }
  - { command: mixer.addInsert, params: { strip: Mix, effect: hard_limiter }, as: limiter }
  - { command: mixer.setInsert, params: { strip: Mix, slot: 0, params: { max: -1, boost: 2 } } }
  - { command: mixer.inspect, as: mixer }
  - { command: file.newColorMatte, params: { color: "#1f1b2e", seconds: 10 }, as: matte }
  - { command: timeline.place, params: { item: $matte.item, track: V1, seconds: 0 } }
  - { command: graphics.newText, params: { text: THE LONG TABLE · EPISODE 31, position: [960, 170], size: 52, seconds: 10, track: 1, time: 0 }, as: card }
  - { command: graphics.set, params: { clip: $card.clip, props: { font_style: Bold, align: center, tracking: 220, fill_color: "#ffffff" } } }

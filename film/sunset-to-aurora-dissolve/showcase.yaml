      sequence.video.0.transitions: { count: 1 }
      sequence.video.0.transitions.0.effect: cross_dissolve
      sequence.video.0.transitions.0.duration: 381024000000
      sequence.video.0.transitions.0.start: 1079568000000
      sequence.duration: 2540160000000

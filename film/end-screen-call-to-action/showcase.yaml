format: 1
id: film/end-screen-call-to-action
title: End Screen Call to Action
summary: A channel end screen with two watch-next slots, a round channel badge and a subscribe prompt.
category: Titles & Graphics
tags: [titles, end-card, shapes, effects, demo-footage]
features: [film.graphics.titles, film.effects.basics]
description: |
  The last twenty seconds of a maker channel's video, laid out for the platform's end-screen
  elements: two 16:9 slots with rounded corners and an inner white stroke where the watch-next
  videos will appear, and a round pink channel badge (an ellipse with a stroke and a three-sided
  polygon turned 90° as its play mark) beside the subscribe prompt. Behind it the city footage
  is softened with Gaussian Blur (36, repeat edge pixels) and a navy shade.
document: { name: end-screen-call-to-action.kfilm, width: 1280, height: 720 }
prelude: demo-footage
steps:
  - { command: file.newSequence, params: { name: End Screen, width: 1280, height: 720, fps: 30, video: 3, audio: 1 }, as: sequence }
  - { command: timeline.place, params: { item: 7, track: V1, seconds: 0, audio: false }, as: footage }
  - { command: effects.apply, params: { clips: [$footage.clips.0], effect: gaussian_blur } }
  - { command: effects.setParam, params: { clip: $footage.clips.0, effect: gaussian_blur, param: blurriness, value: 36 } }
  - { command: effects.setParam, params: { clip: $footage.clips.0, effect: gaussian_blur, param: repeat_edge, value: true } }
  - { command: graphics.newRectangle, params: { position: [640, 360], size: [1280, 720], seconds: 10, track: 1, time: 0 }, as: card }
  - { command: graphics.set, params: { clip: $card.clip, layer: 0, props: { name: Shade, fill_color: "#0c0a1a", opacity: 55 } } }
  - { command: graphics.newText, params: { clip: $card.clip, text: THANKS FOR WATCHING, position: [640, 132], size: 46, fontStyle: Bold } }
  - { command: graphics.set, params: { clip: $card.clip, layer: 1, props: { name: Heading, align: center, tracking: 200, fill_color: "#ffffff" } } }
  - { command: graphics.newRectangle, params: { clip: $card.clip, position: [400, 340], size: [416, 234] } }
  - { command: graphics.set, params: { clip: $card.clip, layer: 2, props: { name: Slot Left, fill_color: "#05040c", opacity: 85, corner_radius: 14, stroke: true, stroke_color: "#ffffff", stroke_width: 3, stroke_type: Inner } } }
  - { command: graphics.newRectangle, params: { clip: $card.clip, position: [880, 340], size: [416, 234] } }
  - { command: graphics.set, params: { clip: $card.clip, layer: 3, props: { name: Slot Right, fill_color: "#05040c", opacity: 85, corner_radius: 14, stroke: true, stroke_color: "#ffffff", stroke_width: 3, stroke_type: Inner } } }
  - { command: graphics.newText, params: { clip: $card.clip, text: WATCH NEXT, position: [400, 348], size: 26, fontStyle: Bold } }
  - { command: graphics.set, params: { clip: $card.clip, layer: 4, props: { name: Slot Left Label, align: center, tracking: 160, fill_color: "#ffffff", opacity: 80 } } }
  - { command: graphics.newText, params: { clip: $card.clip, text: BEST OF THE SERIES, position: [880, 348], size: 26, fontStyle: Bold } }
  - { command: graphics.set, params: { clip: $card.clip, layer: 5, props: { name: Slot Right Label, align: center, tracking: 160, fill_color: "#ffffff", opacity: 80 } } }
  - { command: graphics.newEllipse, params: { clip: $card.clip, position: [452, 568], size: [92, 92] } }
  - { command: graphics.set, params: { clip: $card.clip, layer: 6, props: { name: Badge, fill_color: "#ff3e7f", stroke: true, stroke_color: "#ffffff", stroke_width: 4 } } }
  - { command: graphics.newPolygon, params: { clip: $card.clip, position: [456, 568], size: [38, 38], sides: 3 } }
  - { command: graphics.set, params: { clip: $card.clip, layer: 7, props: { name: Badge Mark, fill_color: "#ffffff", rotation: 90 } } }
  - { command: graphics.newText, params: { clip: $card.clip, text: New builds every Friday, position: [522, 562], size: 30, fontStyle: Bold } }
  - { command: graphics.set, params: { clip: $card.clip, layer: 8, props: { name: Prompt, fill_color: "#ffffff" } } }
  - { command: graphics.newText, params: { clip: $card.clip, text: SUBSCRIBE, position: [522, 598], size: 20, fontStyle: Bold } }
  - { command: graphics.set, params: { clip: $card.clip, layer: 9, props: { name: Button, tracking: 200, fill_color: "#ffffff", background: true, background_color: "#ff3e7f", background_opacity: 100, background_size: 8, background_radius: 6 } } }
  - { command: effects.setParam, params: { clip: $card.clip, effect: opacity, param: opacity, value: 0, seconds: 0 } }
  - { command: effects.setParam, params: { clip: $card.clip, effect: opacity, param: opacity, value: 100, seconds: 0.6 } }
  - { command: graphics.list, params: { clip: $card.clip }, as: list }
thumbnail: { at: 3 }
preview: { from: 0, to: 2, fps: 10, max: 400 }

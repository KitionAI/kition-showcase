format: 1
id: film/testimonial-quote-card
title: Testimonial Quote Card
summary: A customer quote in a serif face on a floating card with a shadow, over a warm matte.
category: Titles & Graphics
tags: [titles, quote, typography, shapes]
features: [film.graphics.titles, film.graphics.text-basics, film.file.new-items]
description: |
  A testimonial for a product video or a social post. The card is a rounded rectangle with a
  soft, warm drop shadow cast straight down (angle 90°, 18 px, blur 60); the quote is set in
  Lora from kition-fonts with extra leading, under a large orange curly quote mark, and Inter
  carries the name and the tracked role line. The card rises 30 px while it fades in.
document: { name: testimonial-quote-card.kfilm, width: 1280, height: 720 }
fonts: [lora/Lora-Variable.ttf]
steps:
  - { command: sequence.settings, params: { name: Testimonial, width: 1280, height: 720, fps: 24 } }
  - { command: file.newColorMatte, params: { color: "#e9dccb", seconds: 6 }, as: matte }
  - { command: timeline.place, params: { item: $matte.item, track: V1, seconds: 0 } }
  - { command: graphics.newRectangle, params: { position: [640, 360], size: [760, 450], seconds: 6, track: 1, time: 0 }, as: card }
  - { command: graphics.set, params: { clip: $card.clip, layer: 0, props: { name: Card, fill_color: "#fffaf3", corner_radius: 24, shadow: true, shadow_color: "#6b4a2b", shadow_opacity: 35, shadow_blur: 60, shadow_distance: 18, shadow_angle: 90 } } }
  - { command: graphics.newText, params: { clip: $card.clip, text: "“", position: [318, 330], size: 220, font: Lora } }
  - { command: graphics.set, params: { clip: $card.clip, layer: 1, props: { name: Mark, fill_color: "#d9623b" } } }
  - { command: graphics.newText, params: { clip: $card.clip, text: "We cut our edit time in half,\nand the first cut finally felt\nlike the film we had in mind.", position: [378, 296], size: 40, font: Lora } }
  - { command: graphics.set, params: { clip: $card.clip, layer: 2, props: { name: Quote, fill_color: "#2b2420", leading: 14 } } }
  - { command: graphics.newRectangle, params: { clip: $card.clip, position: [402, 478], size: [48, 3] } }
  - { command: graphics.set, params: { clip: $card.clip, layer: 3, props: { name: Rule, fill_color: "#d9623b" } } }
  - { command: graphics.newText, params: { clip: $card.clip, text: Noor Haddad, position: [378, 520], size: 26, fontStyle: Bold } }
  - { command: graphics.set, params: { clip: $card.clip, layer: 4, props: { name: Name, fill_color: "#2b2420" } } }
  - { command: graphics.newText, params: { clip: $card.clip, text: EDITOR  ·  BRIGHTWATER DOCS, position: [378, 552], size: 17 } }
  - { command: graphics.set, params: { clip: $card.clip, layer: 5, props: { name: Role, tracking: 160, fill_color: "#8a7563" } } }
  - { command: effects.setParam, params: { clip: $card.clip, effect: motion, param: position, value: [640, 390], seconds: 0 } }
  - { command: effects.setParam, params: { clip: $card.clip, effect: motion, param: position, value: [640, 360], seconds: 0.7 } }
  - { command: effects.setParam, params: { clip: $card.clip, effect: opacity, param: opacity, value: 0, seconds: 0 } }
  - { command: effects.setParam, params: { clip: $card.clip, effect: opacity, param: opacity, value: 100, seconds: 0.7 } }
  - { command: graphics.list, params: { clip: $card.clip }, as: list }
thumbnail: { at: 3 }
preview: { from: 0, to: 1.5, fps: 12, max: 400 }
expected:
  - actual: results
    values:
      list.layers: { count: 6 }
      list.layers.2: { name: Quote, text: { contains: first cut finally felt } }
      list.layers.4: { name: Name, text: Noor Haddad }
  - actual: inspect
    values:
      sequence.video.1.items.0.effects.3.params: { corner_radius: { value: 24 }, shadow: { value: true }, shadow_angle: { value: 90 }, shadow_distance: { value: 18 }, shadow_blur: { value: 60 } }
      sequence.video.1.items.0.effects.5.params.font.value: Lora
      sequence.video.1.items.0.effects.7.params: { font: { value: Inter }, font_style: { value: Bold } }
      # the card rises 30 px while it fades in over 0.7 s (ticks)
      sequence.video.1.items.0.effects.0.params.position.keyframes: [{ time: 0, value: [640, 390] }, { time: 177811200000, value: [640, 360] }]
      sequence.video.1.items.0.effects.1.params.opacity.keyframes: [{ time: 0, value: 0 }, { time: 177811200000, value: 100 }]
diagnostics: []
since: "2026-11-09"

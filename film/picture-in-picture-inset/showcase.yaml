format: 1
id: film/picture-in-picture-inset
title: Picture-in-Picture Inset
summary: A second shot slides into the corner as a rounded, bordered inset with a soft drop shadow over the main picture.
category: Effects & Color
tags: [picture-in-picture, drop-shadow, crop, motion, keyframes, demo-footage]
features: [film.effects.basics, film.effects.keyframes, film.graphics.text-basics]
description: |
  The coast shot on V2 is scaled to 38 % and given Rounded Crop (a few percent trimmed from each edge,
  rounded corners and a 10 px white border) and Drop Shadow, which falls into the trimmed margin; then its Motion position is keyframed so the inset glides in
  from the right edge in the first second with an ease-out. A small label names the inset.
document: { name: picture-in-picture-inset.kfilm, width: 1920, height: 1080 }
prelude: demo-footage
steps:
  - { command: file.newSequence, params: { name: Inset, width: 1920, height: 1080, fps: 24, video: 3, audio: 1 } }
  - { command: timeline.place, params: { item: 9, track: V1, seconds: 0, audio: false }, as: main }
  - { command: timeline.place, params: { item: 5, track: V2, seconds: 0, duration: 2540160000000, audio: false }, as: inset }
  - { command: effects.apply, params: { clips: [$inset.clips.0], effect: rounded_crop } }
  - { command: effects.setParam, params: { clip: $inset.clips.0, effect: rounded_crop, param: left, value: 4 } }
  - { command: effects.setParam, params: { clip: $inset.clips.0, effect: rounded_crop, param: top, value: 6 } }
  - { command: effects.setParam, params: { clip: $inset.clips.0, effect: rounded_crop, param: right, value: 4 } }
  - { command: effects.setParam, params: { clip: $inset.clips.0, effect: rounded_crop, param: bottom, value: 6 } }
  - { command: effects.setParam, params: { clip: $inset.clips.0, effect: rounded_crop, param: radius, value: 70 } }
  - { command: effects.setParam, params: { clip: $inset.clips.0, effect: rounded_crop, param: border, value: 10 } }
  - { command: effects.apply, params: { clips: [$inset.clips.0], effect: drop_shadow } }
  - { command: effects.setParam, params: { clip: $inset.clips.0, effect: drop_shadow, param: opacity, value: 85 } }
  - { command: effects.setParam, params: { clip: $inset.clips.0, effect: drop_shadow, param: distance, value: 45 } }
  - { command: effects.setParam, params: { clip: $inset.clips.0, effect: drop_shadow, param: softness, value: 30 } }
  - { command: effects.setParam, params: { clip: $inset.clips.0, effect: motion, param: scale, value: 38 } }
  - { command: effects.setParam, params: { clip: $inset.clips.0, effect: motion, param: position, value: [2300, 760], seconds: 0 } }
  - { command: effects.setParam, params: { clip: $inset.clips.0, effect: motion, param: position, value: [1500, 760], seconds: 1 } }
  - { command: effects.setInterpolation, params: { clip: $inset.clips.0, effect: motion, param: position, mediaTime: 0, interpolation: easeOut } }
  - { command: effects.setInterpolation, params: { clip: $inset.clips.0, effect: motion, param: position, mediaTime: 254016000000, interpolation: easeIn } }
  - { command: graphics.newText, params: { text: "MEANWHILE, ON THE COAST", position: [1500, 540], size: 32, seconds: 9, track: 2, frame: 24 }, as: label }
  - { command: graphics.set, params: { clip: $label.clip, props: { font_style: Bold, align: center, tracking: 160, fill_color: "#ffffff", shadow: true } } }
thumbnail: { at: 3 }
preview: { from: 0, to: 3, fps: 10, max: 400 }
expected:
  - actual: inspect
    values:
      sequence.video.1.items.0.effects.0.effect: rounded_crop
      sequence.video.1.items.0.effects.0.params: { left: { value: 4 }, top: { value: 6 }, radius: { value: 70 }, border: { value: 10 } }
      sequence.video.1.items.0.effects.1: { effect: drop_shadow, params: { opacity: { value: 85 }, distance: { value: 45 } } }
      sequence.video.1.items.0.effects.2.effect: motion
      # off the right edge to its place in the first second (ticks), eased at both ends
      sequence.video.1.items.0.effects.2.params.position.keyframes: [{ time: 0, value: [2300, 760], interpolation: easeOut }, { time: 254016000000, value: [1500, 760], interpolation: easeIn }]
      sequence.video.1.items.0.effects.2.params.scale.value: 38
diagnostics: []
since: "2026-11-09"

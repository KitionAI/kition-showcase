      sequence.video.0.items.0.effects.7.params.scale.keyframes: [{ time: 177811200000, value: 0 }, { time: 228614400000, value: 130 }, { time: 266716800000, value: 100 }]
      sequence.video.0.items.0.effects.8.params.background.value: true

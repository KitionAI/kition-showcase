      sequence.video.0.items.0.effects.4.params.position.keyframes: [{ time: 0, value: [-760, 0] }, { time: 152409600000, value: [0, 0] }]
      sequence.video.0.items.0.effects.6.params: { fill: { value: false }, stroke: { value: true } }
      sequence.video.0.items.0.effects.7.params.stroke2.value: true

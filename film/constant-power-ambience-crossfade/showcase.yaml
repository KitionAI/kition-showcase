format: 1
id: film/constant-power-ambience-crossfade
title: Constant Power Ambience Crossfade
summary: Sea ambience hands over to forest ambience with a one-second Constant Power crossfade, under a matching cross dissolve.
category: Audio
tags: [audio, crossfade, transitions, ambience, demo-footage]
features: [film.audio.basics, film.transitions.basics, film.graphics.text-basics]
description: |
  Two scenes are cut back to back with their own sound: the sea from 0 to 6 s, the forest from
  6 to 12 s. sequence.applyAudioTransition puts a 24-frame Constant Power crossfade on the
  forest's sound at the cut, so the combined loudness holds steady through the change (a
  Constant Gain fade would dip in the middle), and a cross dissolve of the same length blends the
  pictures. The frame shown is the middle of both transitions.
document: { name: constant-power-ambience-crossfade.kfilm, width: 1920, height: 1080 }
prelude: demo-footage
steps:
  - { command: file.newSequence, params: { name: Coast To Forest, width: 1920, height: 1080, fps: 24, video: 2, audio: 1 } }
  - { command: timeline.place, params: { item: 5, track: V1, audioTrack: A1, seconds: 0, sourceIn: 762048000000, duration: 1524096000000 }, as: sea }
  - { command: timeline.place, params: { item: 9, track: V1, audioTrack: A1, seconds: 6, sourceIn: 254016000000, duration: 1524096000000 }, as: forest }
  - { command: sequence.applyVideoTransition, params: { clip: $forest.clips.0, edge: in, effect: cross_dissolve, frames: 24 }, as: dissolve }
  - { command: sequence.applyAudioTransition, params: { clip: $forest.clips.1, effect: constant_power, frames: 24 }, as: crossfade }
  - { command: graphics.newText, params: { text: "SEA → FOREST", position: [120, 940], size: 44, seconds: 12, track: 1, time: 0 }, as: label }
  - { command: graphics.set, params: { clip: $label.clip, props: { font_style: Bold, tracking: 200, fill_color: "#ffffff", shadow: true } } }
  - { command: graphics.newText, params: { clip: $label.clip, text: ambience crossfade · Constant Power · 24 frames, position: [120, 990], size: 32 } }
  - { command: graphics.set, params: { clip: $label.clip, props: { fill_color: "#e9f1ea", shadow: true } } }

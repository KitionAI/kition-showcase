format: 1
id: film/bars-and-tone-lineup
title: Bars and Tone Line-Up
summary: A delivery master's head build of colour bars with a 1 kHz reference tone at −20 dBFS, an ident box and a counting leader.
category: Audio
tags: [audio, bars-and-tone, leader, delivery, broadcast]
features: [film.audio.basics, film.file.new-items, film.graphics.text-basics]
description: |
  Broadcast and festival deliveries start with a line-up: ten seconds of Bars and Tone so the
  receiving facility can set picture and sound levels, then a Universal Counting Leader. The
  reference tone peaks at −20 dBFS; clip.audioPeak measures it on the timeline and
  clip.audioGain normalizes the peak to exactly that level. An ident box over the bars names the
  programme and the audio layout.
document: { name: bars-and-tone-lineup.kfilm, width: 1920, height: 1080 }
steps:
  - { command: sequence.settings, params: { name: Harbour Lights TX Master, fps: 25 } }
  - { command: file.newBarsAndTone, params: { seconds: 10 }, as: bars }
  - { command: timeline.place, params: { item: $bars.item, track: V1, seconds: 0 }, as: lineup }
  - { command: clip.audioGain, params: { clips: [$lineup.clips.1], mode: normalizeMax, db: -20 } }
  - { command: clip.audioPeak, params: { clips: [$lineup.clips.1] }, as: tone }
  - { command: file.newCountingLeader, as: leader }
  - { command: timeline.place, params: { item: $leader.item, track: V1, seconds: 10 }, as: countdown }
  - { command: graphics.newRectangle, params: { position: [960, 560], size: [980, 300], seconds: 10, track: 1, time: 0 }, as: ident }
  - { command: graphics.set, params: { clip: $ident.clip, props: { fill_color: "#000000", opacity: 96, stroke: true, stroke_color: "#ffffff", stroke_width: 4, stroke_type: Inner } } }
  - { command: graphics.newText, params: { clip: $ident.clip, text: HARBOUR LIGHTS · EPISODE 2, position: [960, 520], size: 52 } }
  - { command: graphics.set, params: { clip: $ident.clip, props: { font_style: Bold, align: center, tracking: 120, fill_color: "#ffffff" } } }
  - { command: graphics.newText, params: { clip: $ident.clip, text: "TX MASTER · 1920×1080 25p · 00:47:12:00", position: [960, 590], size: 34 } }
  - { command: graphics.set, params: { clip: $ident.clip, props: { align: center, fill_color: "#d0d0d0" } } }
  - { command: graphics.newText, params: { clip: $ident.clip, text: "TONE 1 kHz at −20 dBFS · STEREO A1/A2", position: [960, 650], size: 34 } }
  - { command: graphics.set, params: { clip: $ident.clip, props: { align: center, fill_color: "#ffd84d" } } }
thumbnail: { at: 3 }
expected:
  - actual: results
    values:
      tone.peakDb: { approx: -20, tol: 0.01 }
      lineup.clips: { count: 2 }
  - actual: inspect
    values:
      sequence.video.0.items: { count: 2 }
      sequence.video.0.items.0.name: Bars and Tone
      sequence.video.0.items.1: { name: { matches: Leader }, startFrame: 250 }
      sequence.audio.0.items.0.name: Bars and Tone
      sequence.video.1.items.0.effects.3.params: { stroke: { value: true }, stroke_type: { option: Inner } }
diagnostics: []
since: "2026-11-09"

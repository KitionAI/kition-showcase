format: 1
id: film/documentary-chapter-cards
title: Documentary Chapter Cards
summary: Three chapters of a travel documentary, each opening with a numbered chapter card.
category: Titles & Graphics
tags: [titles, chapters, typography, demo-footage]
features: [film.graphics.titles, film.graphics.text-basics, film.timeline.basics]
description: |
  Three four-second shots (sea, forest, city) cut together, each with its own chapter card on
  the track above, starting on the same frame as its shot. A card is one graphic clip: a large
  outlined numeral (text with its fill off and a centered stroke), a gold tracked kicker, the
  chapter name with a soft shadow and an italic line. Every card fades in after the cut and
  fades out before the next one, so the cuts stay clean.
document: { name: documentary-chapter-cards.kfilm, width: 1280, height: 720 }
prelude: demo-footage
steps:
  - { command: file.newSequence, params: { name: Three Places, width: 1280, height: 720, fps: 24, video: 2, audio: 1 }, as: sequence }
  - { command: timeline.place, params: { item: 5, track: V1, seconds: 0, duration: 1016064000000, audio: false }, as: shot1 }
  - { command: timeline.place, params: { item: 9, track: V1, seconds: 4, duration: 1016064000000, audio: false }, as: shot2 }
  - { command: timeline.place, params: { item: 7, track: V1, seconds: 8, duration: 1016064000000, audio: false }, as: shot3 }
  - { command: graphics.newText, params: { text: "01", position: [120, 470], size: 220, fontStyle: Bold, seconds: 4, track: 1, time: 0 }, as: card1 }
  - { command: graphics.set, params: { clip: $card1.clip, layer: 0, props: { name: Number, fill: false, stroke: true, stroke_color: "#ffffff", stroke_width: 3, stroke_type: Center, opacity: 85 } } }
  - { command: graphics.newText, params: { clip: $card1.clip, text: CHAPTER 01, position: [128, 520], size: 22, fontStyle: Bold } }
  - { command: graphics.set, params: { clip: $card1.clip, layer: 1, props: { name: Kicker, tracking: 300, fill_color: "#ffd27a" } } }
  - { command: graphics.newText, params: { clip: $card1.clip, text: The Shore, position: [124, 590], size: 64, fontStyle: Bold } }
  - { command: graphics.set, params: { clip: $card1.clip, layer: 2, props: { name: Chapter, fill_color: "#ffffff", shadow: true, shadow_opacity: 60, shadow_blur: 30, shadow_distance: 2 } } }
  - { command: graphics.newText, params: { clip: $card1.clip, text: "Where the tide keeps time", position: [128, 630], size: 24 } }
  - { command: graphics.set, params: { clip: $card1.clip, layer: 3, props: { name: Subtitle, fill_color: "#e8edf2", faux_italic: true } } }
  - { command: effects.setParam, params: { clip: $card1.clip, effect: opacity, param: opacity, value: 0, seconds: 0.3 } }
  - { command: effects.setParam, params: { clip: $card1.clip, effect: opacity, param: opacity, value: 100, seconds: 1 } }
  - { command: effects.setParam, params: { clip: $card1.clip, effect: opacity, param: opacity, value: 100, seconds: 3.2 } }
  - { command: effects.setParam, params: { clip: $card1.clip, effect: opacity, param: opacity, value: 0, seconds: 3.8 } }
  - { command: graphics.newText, params: { text: "02", position: [120, 470], size: 220, fontStyle: Bold, seconds: 4, track: 1, time: 1016064000000 }, as: card2 }
  - { command: graphics.set, params: { clip: $card2.clip, layer: 0, props: { name: Number, fill: false, stroke: true, stroke_color: "#ffffff", stroke_width: 3, stroke_type: Center, opacity: 85 } } }
  - { command: graphics.newText, params: { clip: $card2.clip, text: CHAPTER 02, position: [128, 520], size: 22, fontStyle: Bold } }
  - { command: graphics.set, params: { clip: $card2.clip, layer: 1, props: { name: Kicker, tracking: 300, fill_color: "#ffd27a" } } }
  - { command: graphics.newText, params: { clip: $card2.clip, text: The Forest, position: [124, 590], size: 64, fontStyle: Bold } }
  - { command: graphics.set, params: { clip: $card2.clip, layer: 2, props: { name: Chapter, fill_color: "#ffffff", shadow: true, shadow_opacity: 60, shadow_blur: 30, shadow_distance: 2 } } }
  - { command: graphics.newText, params: { clip: $card2.clip, text: "Fog, moss and old trees", position: [128, 630], size: 24 } }
  - { command: graphics.set, params: { clip: $card2.clip, layer: 3, props: { name: Subtitle, fill_color: "#e8edf2", faux_italic: true } } }
  - { command: effects.setParam, params: { clip: $card2.clip, effect: opacity, param: opacity, value: 0, seconds: 4.3 } }
  - { command: effects.setParam, params: { clip: $card2.clip, effect: opacity, param: opacity, value: 100, seconds: 5 } }
  - { command: effects.setParam, params: { clip: $card2.clip, effect: opacity, param: opacity, value: 100, seconds: 7.2 } }
  - { command: effects.setParam, params: { clip: $card2.clip, effect: opacity, param: opacity, value: 0, seconds: 7.8 } }
  - { command: graphics.newText, params: { text: "03", position: [120, 470], size: 220, fontStyle: Bold, seconds: 4, track: 1, time: 2032128000000 }, as: card3 }
  - { command: graphics.set, params: { clip: $card3.clip, layer: 0, props: { name: Number, fill: false, stroke: true, stroke_color: "#ffffff", stroke_width: 3, stroke_type: Center, opacity: 85 } } }
  - { command: graphics.newText, params: { clip: $card3.clip, text: CHAPTER 03, position: [128, 520], size: 22, fontStyle: Bold } }
  - { command: graphics.set, params: { clip: $card3.clip, layer: 1, props: { name: Kicker, tracking: 300, fill_color: "#ffd27a" } } }
  - { command: graphics.newText, params: { clip: $card3.clip, text: The City, position: [124, 590], size: 64, fontStyle: Bold } }
  - { command: graphics.set, params: { clip: $card3.clip, layer: 2, props: { name: Chapter, fill_color: "#ffffff", shadow: true, shadow_opacity: 60, shadow_blur: 30, shadow_distance: 2 } } }
  - { command: graphics.newText, params: { clip: $card3.clip, text: "Lights that never sleep", position: [128, 630], size: 24 } }
  - { command: graphics.set, params: { clip: $card3.clip, layer: 3, props: { name: Subtitle, fill_color: "#e8edf2", faux_italic: true } } }
  - { command: effects.setParam, params: { clip: $card3.clip, effect: opacity, param: opacity, value: 0, seconds: 8.3 } }
  - { command: effects.setParam, params: { clip: $card3.clip, effect: opacity, param: opacity, value: 100, seconds: 9 } }
  - { command: effects.setParam, params: { clip: $card3.clip, effect: opacity, param: opacity, value: 100, seconds: 11.2 } }
  - { command: effects.setParam, params: { clip: $card3.clip, effect: opacity, param: opacity, value: 0, seconds: 11.8 } }
  - { command: graphics.list, params: { clip: $card2.clip }, as: list }

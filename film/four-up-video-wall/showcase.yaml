format: 1
id: film/four-up-video-wall
title: Four-Up Video Wall
summary: Four shots pop into a 2×2 grid one after another, each scaling up from nothing with an ease-out, before a title lands in the middle.
category: Keyframes & Motion
tags: [keyframes, motion, easing, split-screen, demo-footage]
features: [film.effects.keyframes, film.file.new-items, film.graphics.text-basics]
description: |
  A dark Color Matte fills V1 and four shots sit on V2–V5, each moved into a quadrant with Motion
  position. Their Motion scale is keyframed from 0 % to 48.5 % over three quarters of a second,
  starting a quarter second apart, and the first keyframe of each eases out so every tile lands
  softly. The gap between 48.5 % and 50 % leaves thin gutters of the matte between the tiles.
  The title fades in once the wall is complete.
document: { name: four-up-video-wall.kfilm, width: 1920, height: 1080 }
prelude: demo-footage
steps:
  - { command: file.newSequence, params: { name: Year In Places, width: 1920, height: 1080, fps: 24, video: 6, audio: 1 } }
  - { command: file.newColorMatte, params: { color: "#101418", seconds: 10 }, as: matte }
  - { command: timeline.place, params: { item: $matte.item, track: V1, seconds: 0 } }
  - { command: timeline.place, params: { item: 5, track: V2, seconds: 0, duration: 2540160000000, audio: false }, as: sea }
  - { command: effects.setParam, params: { clip: $sea.clips.0, effect: motion, param: position, value: [480, 270] } }
  - { command: effects.setParam, params: { clip: $sea.clips.0, effect: motion, param: scale, value: 0, seconds: 0.0 } }
  - { command: effects.setParam, params: { clip: $sea.clips.0, effect: motion, param: scale, value: 48.5, seconds: 0.75 } }
  - { command: effects.setInterpolation, params: { clip: $sea.clips.0, effect: motion, param: scale, mediaTime: 0, interpolation: easeOut } }
  - { command: timeline.place, params: { item: 6, track: V3, seconds: 0, duration: 2540160000000, audio: false }, as: aurora }
  - { command: effects.setParam, params: { clip: $aurora.clips.0, effect: motion, param: position, value: [1440, 270] } }
  - { command: effects.setParam, params: { clip: $aurora.clips.0, effect: motion, param: scale, value: 0, seconds: 0.25 } }
  - { command: effects.setParam, params: { clip: $aurora.clips.0, effect: motion, param: scale, value: 48.5, seconds: 1.0 } }
  - { command: effects.setInterpolation, params: { clip: $aurora.clips.0, effect: motion, param: scale, mediaTime: 63504000000, interpolation: easeOut } }
  - { command: timeline.place, params: { item: 8, track: V4, seconds: 0, duration: 2540160000000, audio: false }, as: dunes }
  - { command: effects.setParam, params: { clip: $dunes.clips.0, effect: motion, param: position, value: [480, 810] } }
  - { command: effects.setParam, params: { clip: $dunes.clips.0, effect: motion, param: scale, value: 0, seconds: 0.5 } }
  - { command: effects.setParam, params: { clip: $dunes.clips.0, effect: motion, param: scale, value: 48.5, seconds: 1.25 } }
  - { command: effects.setInterpolation, params: { clip: $dunes.clips.0, effect: motion, param: scale, mediaTime: 127008000000, interpolation: easeOut } }
  - { command: timeline.place, params: { item: 9, track: V5, seconds: 0, duration: 2540160000000, audio: false }, as: forest }
  - { command: effects.setParam, params: { clip: $forest.clips.0, effect: motion, param: position, value: [1440, 810] } }
  - { command: effects.setParam, params: { clip: $forest.clips.0, effect: motion, param: scale, value: 0, seconds: 0.75 } }
  - { command: effects.setParam, params: { clip: $forest.clips.0, effect: motion, param: scale, value: 48.5, seconds: 1.5 } }
  - { command: effects.setInterpolation, params: { clip: $forest.clips.0, effect: motion, param: scale, mediaTime: 190512000000, interpolation: easeOut } }
  - { command: graphics.newText, params: { text: ONE YEAR · FOUR PLACES, position: [960, 556], size: 44, seconds: 8.75, track: 5, frame: 30 }, as: title }
  - { command: graphics.set, params: { clip: $title.clip, props: { font_style: Bold, align: center, tracking: 250, fill_color: "#101418", background: true, background_color: "#ffffff", background_opacity: 100, background_size: 24, background_radius: 8 } } }
  - { command: effects.setParam, params: { clip: $title.clip, effect: opacity, param: opacity, value: 0, frame: 30 } }
  - { command: effects.setParam, params: { clip: $title.clip, effect: opacity, param: opacity, value: 100, frame: 42 } }

format: 1
id: note/reading-list-tracker
title: Reading List Tracker
summary: A year's reading list kept as a Markdown table that grows row by row, with a status column, star ratings and a short reviews section.
category: Knowledge Base
tags: [tables, reading-list, table-editing, tags]
features: [note.tables, note.text.edit, note.structure]
description: |
  The table is built with the table commands rather than typed: `table.create` makes the header
  alone (`rows: 0`), `table.insertRow` adds each book, `table.setCell` updates a status when a book
  is finished, `table.moveRow` puts the current reads on top, and `table.format` pads the source so
  the columns line up. The checks read the finished table back cell by cell.
document: { name: reading-list-tracker.md, width: 816, height: 1056 }
steps:
  - command: note.write
    params:
      markdown: |
        # Reading List 2027

        Twelve books this year, at least four of them non-fiction. #reading

        ## Books

        ## Short reviews

        > [!QUOTE] The Salt Road
        > Slow for fifty pages, then impossible to put down. The chapter on the lighthouse keeper's ledger is the best thing I read all winter.

        > [!SUCCESS] Goal check
        > Five finished by May, two of them non-fiction. On track.
  - { command: table.create, params: { heading: [Reading List 2027, Books], position: start, columns: 4, rows: 0, header: [Title, Author, Status, Rating] } }
  - { command: table.insertRow, params: { table: 0, at: 1, cells: [The Salt Road, Ines Carvalho, Finished, ★★★★★] } }
  - { command: table.insertRow, params: { table: 0, at: 2, cells: [Rivers of Iron, T. M. Achebe-Lund, Finished, ★★★★] } }
  - { command: table.insertRow, params: { table: 0, at: 3, cells: [A Field Guide to Clouds, Harriet Vale, Finished, ★★★] } }
  - { command: table.insertRow, params: { table: 0, at: 4, cells: [The Long Quiet, Oskar Brenner, Reading, ""] } }
  - { command: table.insertRow, params: { table: 0, at: 5, cells: [Small Machines, Leilani Park, To read, ""] } }
  - { command: table.insertRow, params: { table: 0, at: 6, cells: [Letters from the Fen, Mary Ashdown, To read, ""] } }
  - { command: table.setCell, params: { table: 0, row: 3, column: 2, text: Finished, expected: Finished } }
  - { command: table.setCell, params: { table: 0, row: 5, column: 2, text: Reading, expected: To read } }
  - { command: table.moveRow, params: { table: 0, from: 4, to: 1 } }
  - { command: table.moveRow, params: { table: 0, from: 5, to: 2 } }
  - { command: table.align, params: { table: 0, column: 3, align: center } }
  - { command: table.format, params: { table: 0 } }
  - { command: table.read, params: { table: 0 }, as: books }
thumbnail: { area: [0, 0, 816, 760] }
expected:
  - actual: inspect
    values:
      tables: { count: 1, all: { columns: 4, rows: 7 } }
      callouts: 2
  - actual: results
    values:
      books.header: [Title, Author, Status, Rating]
      books.rows: { count: 6 }
      books.rows.0: [The Long Quiet, Oskar Brenner, Reading, ""]
      books.rows.1: [Small Machines, Leilani Park, Reading, ""]
      books.align: [none, none, none, center]
diagnostics: []
since: "2026-11-09"

description: |
  The README is written once with `note.write`; then the way a maintainer edits it: `section.insert`
  adds a Contributing section after Configuration, `table.insertRow` adds an option to the
  configuration table and `table.format` pads the table so its columns line up in the source.
  Code blocks carry their languages (shell, Rust, TOML) for highlighting.

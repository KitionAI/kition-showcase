format: 1
id: photo/app-icon-grid
title: App Icon Grid
summary: Twelve rounded-square app icons for a fictional suite, with gradient fills, soft shadows and simple vector glyphs on a home-screen grid.
category: UI & Web Design
tags: [ui, icons, gradient, shapes, layer-styles]
features: [photo.path.shapes, photo.paint.gradients, photo.layer.style-basics, photo.layer.basics]
description: |
  An icon family for a made-up productivity suite. Every tile is a rounded-rectangle shape with a
  two-stop gradient fill and the same Drop Shadow; the glyphs are built from live shapes: combined
  and subtracted sub-paths (the cog's hole, the inbox tray), dashed and curved strokes (the trail,
  the waves) and type. The wallpaper is a gradient fill layer.
document: { name: app-icon-grid.psd, width: 1200, height: 900 }

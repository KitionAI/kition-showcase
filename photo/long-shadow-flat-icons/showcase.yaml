format: 1
id: photo/long-shadow-flat-icons
title: Long Shadow Flat Icons
summary: Four flat app icons with fading 45° long shadows, each a Multiply shape with a Gradient Overlay clipped to its circle.
category: Layer Styles
tags: [shapes, clipping-mask, icons, flat-design]
features: [photo.path.shapes, photo.layer.masks, photo.layer.basics]
description: |
  The long shadow is the classic flat-design trick done with live layers: a polygon that sweeps the
  glyph's outline down and to the right, set to Multiply and clipped to the circle below it so
  it stops at the edge. A dark-to-white Gradient Overlay on the polygon makes the shadow fade out
  along its length, since white multiplies to nothing. The glyphs are shapes and type on top, so the colours,
  the angle and the length stay editable.
document: { name: long-shadow-flat-icons.psd, width: 1400, height: 620 }

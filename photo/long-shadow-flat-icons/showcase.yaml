  - { command: shape.create, params: { kind: path, fill: "#000000", name: Mail Long Shadow, path: { subpaths: [ { knots: [[186, 276], [314, 276], [504, 466], [504, 554], [376, 554], [186, 364]] } ] } }, as: s0 }

format: 1
id: photo/cinematic-color-grade
title: Cinematic Teal & Orange Grade
summary: A dusk seascape graded like a film still with a stack of curves, color balance, selective color and vibrance layers.
category: Adjustments & Color
tags: [adjustment-layers, color-grading, curves, render-filters, landscape]
features: [photo.layer.adjustment, photo.layer.adjustment-basics, photo.filter.blur]
featured: true
description: |
  The scene underneath is procedural: a gradient sky, rendered clouds softened in Overlay, a sea of
  motion-blurred noise, a lens flare on a Screen layer and a cliff with a lighthouse. The look comes
  from four editable adjustment layers on top: an S-curve for contrast, Color Balance pushing the
  shadows to teal and the highlights to orange, Selective Color cooling the blues and warming the
  yellows (two ranges in one layer), and a touch of Vibrance. Letterbox bars crop the frame to 2.39:1.
document: { name: cinematic-color-grade.psd, width: 1600, height: 900 }
steps:
  - { command: gradient.fill.create, params: { from: [0, 0], to: [0, 560], stops: [[0, "#2c4a5f"], [0.55, "#9c9a92"], [1, "#f2c48d"]] }, as: sky }
  - { command: layer.renameLayer, params: { layer: $sky.layer, name: Sky } }
  - { command: layer.new.layer, params: { name: Clouds }, as: clouds }
  - { command: tools.setColors, params: { foreground: "#000000", background: "#ffffff" } }
  - { command: filter.render.clouds, params: { seed: 11 } }
  - { command: filter.blur.motionBlur, params: { angle: 0, distance: 120 } }
  - { command: layer.setProps, params: { layer: $clouds.layer, blend: Overlay, opacity: 0.7 } }
  - { command: select.rect, params: { x: 0, y: 0, width: 1600, height: 560, feather: 20 } }
  - { command: layer.layerMask.revealSelection, params: { layer: $clouds.layer } }
  - { command: select.deselect }
  - { command: layer.new.layer, params: { name: Sea }, as: sea }
  - { command: select.rect, params: { x: 0, y: 556, width: 1600, height: 344 } }
  - { command: edit.fill, params: { contents: color, color: "#5d6f7a" } }
  - { command: filter.noise.addNoise, params: { amount: 40, distribution: gaussian, monochromatic: true, seed: 3 } }
  - { command: filter.blur.motionBlur, params: { angle: 0, distance: 160 } }
  - { command: select.deselect }
  - { command: gradient.fill.create, params: { from: [0, 556], to: [0, 900], stops: [[0, "#f4c58c"], [0.4, "#6d7f8a"], [1, "#22323d"]], mode: soft-light }, as: seaTone }
  - { command: layer.renameLayer, params: { layer: $seaTone.layer, name: Sea Tone } }
  - { command: layer.new.layer, params: { name: Sun Flare }, as: flare }
  - { command: edit.fill, params: { contents: color, color: "#000000" } }

  - { command: layer.renameLayer, params: { layer: $curves.layer, name: Contrast S-Curve } }
  - { command: layer.newAdjustmentLayer.colorBalance, params: { shadows: [-22, 0, 18], midtones: [8, 0, -12], highlights: [22, 0, -26] }, as: balance }
  - { command: layer.renameLayer, params: { layer: $balance.layer, name: Teal Shadows Orange Highlights } }
  - { command: layer.newAdjustmentLayer.selectiveColor, params: { method: relative, blues: [30, 0, -10, 10], yellows: [0, 10, 15, 0] }, as: selective }
  - { command: layer.renameLayer, params: { layer: $selective.layer, name: Cooler Blues } }
  - { command: layer.newAdjustmentLayer.vibrance, params: { vibrance: 25, saturation: 0 }, as: vibrance }
  - { command: layer.renameLayer, params: { layer: $vibrance.layer, name: Vibrance } }
  - { command: shape.create, params: { kind: rect, rect: [0, 0, 1600, 115], fill: "#000000", name: Letterbox Top } }
  - { command: shape.create, params: { kind: rect, rect: [0, 785, 1600, 115], fill: "#000000", name: Letterbox Bottom } }
  - { command: type.create, params: { x: 800, y: 852, text: "T H E   L A S T   L I G H T", font: Inter, size: 30, color: "#e9d8c4", align: center, name: Title } }

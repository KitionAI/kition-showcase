  - { command: shape.create, params: { kind: path, name: Lighthouse, fill: "#141b20", path: { subpaths: [ { knots: [[228, 470], [236, 360], [266, 360], [274, 470]] }, { knots: [[226, 360], [276, 360], [276, 350], [226, 350]] }, { knots: [[236, 350], [266, 350], [266, 326], [236, 326]] }, { knots: [[232, 326], [251, 306], [270, 326]] } ] } } }
  - { command: shape.create, params: { kind: rect, rect: [238, 330, 26, 18], fill: "#ffe2a8", name: Lamp }, as: lamp }
  - { command: layer.layerStyle.outerGlow, params: { layer: $lamp.layer, color: "#ffd38a", opacity: 90, size: 40 } }

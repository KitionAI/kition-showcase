format: 1
id: photo/book-launch-rich-text
title: Book Launch Rich Text
summary: A bookshop invitation whose whole message is one text layer with bold, italic, colour, strikethrough, superscript and small-caps runs.
category: Typography
tags: [type, paragraph-text, character-styles, shapes]
features: [photo.type.text, photo.type.styles, photo.path.shapes]
description: |
  Everything on the right is a single paragraph text layer. Ranges of it are restyled with
  `type.setStyle`: small caps for the opening, an italic coloured book title, a bold author and
  date, the old ticket price struck through, a raised footnote mark, an underlined RSVP line and
  a smaller footnote paragraph. The book cover on the left is drawn with shapes.
document: { name: book-launch-rich-text.psd, width: 1200, height: 900 }
fonts: [lora/Lora-Variable.ttf]
steps:
  - { command: layer.newFillLayer.solidColor, params: { color: "#efe9df" }, as: paper }
  - { command: shape.create, params: { kind: rect, rect: [110, 140, 400, 600], fill: { gradient: { stops: [[0, "#123a3a"], [1, "#1f5c55"]], angle: 90 } }, name: Cover }, as: cover }
  - { command: layer.layerStyle.dropShadow, params: { layer: $cover.layer, color: "#3d2f22", opacity: 40, distance: 22, size: 36, angle: 125 } }
  - { command: shape.create, params: { kind: rect, rect: [110, 140, 18, 600], fill: "#0c2a2a", name: Spine Edge } }
  - { command: shape.create, params: { kind: ellipse, rect: [230, 300, 160, 160], fill: "#f2b84b", name: Lantern Glow }, as: glow }
  - { command: layer.layerStyle.outerGlow, params: { layer: $glow.layer, color: "#f7c96b", opacity: 70, size: 70, spread: 0 } }
  - { command: shape.create, params: { kind: ellipse, rect: [286, 276, 48, 56], fill: null, stroke: { width: 6, color: "#0c2a2a" }, name: Lantern Handle } }
  - { command: shape.create, params: { kind: roundedRect, rect: [270, 330, 80, 110], radii: 14, fill: "#fff1c9", stroke: { width: 6, color: "#0c2a2a" }, name: Lantern } }
  - { command: shape.create, params: { kind: rect, rect: [292, 312, 36, 18], fill: "#0c2a2a", name: Lantern Cap } }
  - { command: shape.create, params: { kind: ellipse, rect: [300, 362, 20, 46], fill: "#f08a24", name: Flame } }
  - { command: type.create, params: { x: 318, y: 560, text: The Lantern Keeper, font: Lora, size: 34, weight: 700, color: "#f6efe2", align: center, name: Cover Title } }
  - { command: type.create, params: { x: 318, y: 680, text: MIRA OKONEDO-HALE, font: Inter, size: 16, weight: 600, tracking: 300, color: "#f2b84b", align: center, name: Cover Author } }
  - { command: type.create, params: { x: 600, y: 190, text: "AN EVENING AT FOLIO & FERN", font: Inter, size: 15, weight: 600, tracking: 300, color: "#1f5c55", name: Eyebrow } }
  - { command: shape.create, params: { kind: line, from: [600, 215], to: [680, 215], weight: 3, fill: "#c0612b", name: Eyebrow Rule } }
  - { command: type.create, params: { x: 600, y: 250, box: [600, 250, 500, 520], font: Lora, size: 30, leading: 44, spaceAfter: 18, color: "#2b2622", name: Invitation, text: "You are invited to the launch of The Lantern Keeper, the debut novel by Mira Okonedo-Hale.\nThursday 4 December, 7 pm at Folio & Fern Bookshop. Tickets £12 £8 for members*, including a signed copy.\nRSVP by 28 November.\n*Membership is free at the till." }, as: invite }
  - { command: type.setStyle, params: { layer: $invite.layer, range: [0, 15], caps: small, weight: 700, tracking: 30, color: "#1f5c55" } }
  - { command: type.setStyle, params: { layer: $invite.layer, range: [33, 51], italic: true, color: "#c0612b" } }
  - { command: type.setStyle, params: { layer: $invite.layer, range: [72, 89], weight: 700 } }
  - { command: type.setStyle, params: { layer: $invite.layer, range: [91, 116], weight: 700, color: "#1f5c55" } }
  - { command: type.setStyle, params: { layer: $invite.layer, range: [151, 154], strikethrough: true, color: "#9a8f83" } }
  - { command: type.setStyle, params: { layer: $invite.layer, range: [155, 157], weight: 700, color: "#c0612b" } }
  - { command: type.setStyle, params: { layer: $invite.layer, range: [169, 170], baselineShift: 12, size: 18 } }
  - { command: type.setStyle, params: { layer: $invite.layer, range: [197, 217], underline: true, weight: 600 } }
  - { command: type.setStyle, params: { layer: $invite.layer, range: [218, 250], size: 18, italic: true, color: "#7d7268" } }
  - { command: type.info, params: { layer: $invite.layer }, as: info }
expected:
  - actual: inspect
    values:
      layers: { count: 14, any: { name: Invitation, kind: Type } }
      layers.0: { name: Invitation, text: { font: Lora } }
  - actual: results
    values:
      info.runs: { min: 12, any: { start: 151, end: 154, style: { strikethrough: true } } }
      info.runs.0: { start: 0, end: 15, style: { caps: SmallCaps, weight: 700 } }
      info.text: { contains: "RSVP by 28 November." }
  - actual: results
    values:
      info.runs: { any: { start: 169, end: 170, style: { baseline_shift_pt: 12, size_pt: 18 } } }
diagnostics: []
since: "2026-11-09"

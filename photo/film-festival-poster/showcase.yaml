format: 1
id: photo/film-festival-poster
title: Film Festival Poster
summary: An outdoor film festival poster with a gold film reel, crossing spotlight beams, a perforated film strip and film grain.
category: Posters & Marketing
tags: [poster, shapes, layer-styles, blend-modes, noise, type]
features: [photo.path.shapes, photo.layer.styles, photo.layer.basics, photo.filter.noise-sharpen, photo.type.point-text]
description: |
  Everything graphic is a live shape with holes cut by subtraction: the reel is a circle minus a
  hub and six windows, and the film strip is a band minus 46 perforations, so the dark backdrop
  shows through. Two translucent searchlight beams in Screen mode rise from behind the reel, the reel takes a
  Gradient Overlay and a Bevel & Emboss, and an Overlay layer of monochrome noise adds film grain.
document: { name: film-festival-poster.psd, width: 1000, height: 1400 }
fonts: [inter/Inter-Variable.ttf, bricolage-grotesque/BricolageGrotesque-Variable.ttf]

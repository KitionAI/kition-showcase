format: 1
id: photo/concert-poster
title: Synthwave Concert Poster
summary: A retro night-concert poster with a striped gradient sun, smoky clouds, a lens flare and glowing headline type.
category: Posters & Marketing
tags: [poster, gradient, shapes, layer-styles, type, render-filters, groups]
features: [photo.layer.adjustment, photo.path.shapes, photo.layer.styles, photo.filter.stylize, photo.layer.manage, photo.type.point-text]
featured: true
description: |
  The sky is a gradient fill layer with Clouds rendered on a pixel layer set to Screen. The sun is
  one live shape, an ellipse with a gradient fill and four rectangles subtracted from it, with an
  Outer Glow. The perspective grid is a group of combined line shapes, and a lens flare on a black
  layer in Screen mode adds the stage light. The headline is Bricolage Grotesque with a pink Outer
  Glow; the lineup sits in its own group.
document: { name: concert-poster.psd, width: 1000, height: 1400 }
fonts: [bricolage-grotesque/BricolageGrotesque-Variable.ttf]
steps:
  - { command: layer.newFillLayer.gradient, params: { from: "#0d0826", to: "#4a1258", angle: 90, style: linear }, as: sky }
  - { command: layer.setProps, params: { layer: $sky.layer, name: Sky } }
  - { command: tools.setColors, params: { foreground: "#000000", background: "#b04fc8" } }
  - { command: layer.new.layer, params: { name: Haze }, as: haze }
  - { command: filter.render.clouds, params: { seed: 7 } }
  - { command: layer.setProps, params: { layer: $haze.layer, blend: Screen, opacity: 0.35 } }
  - { command: shape.create, params: { kind: ellipse, rect: [200, 300, 600, 600], fill: { gradient: { stops: [[0, "#ffd36e"], [0.55, "#ff6f91"], [1, "#c2338f"]], angle: -90, style: linear } }, name: Sun }, as: sun }
  - { command: shape.create, params: { kind: rect, rect: [180, 640, 640, 10], addTo: $sun.layer, op: subtract } }
  - { command: shape.create, params: { kind: rect, rect: [180, 700, 640, 16], addTo: $sun.layer, op: subtract } }
  - { command: shape.create, params: { kind: rect, rect: [180, 766, 640, 22], addTo: $sun.layer, op: subtract } }
  - { command: shape.create, params: { kind: rect, rect: [180, 836, 640, 30], addTo: $sun.layer, op: subtract } }
  - { command: layer.layerStyle.outerGlow, params: { layer: $sun.layer, color: "#ff5fa2", opacity: 60, size: 80, spread: 4 } }
  - { command: shape.create, params: { kind: rect, rect: [0, 880, 1000, 520], fill: { gradient: { stops: [[0, "#2b0d43"], [1, "#0a0618"]], angle: -90 } }, name: Horizon }, as: horizon }
  - { command: layer.new.group, params: { name: Grid }, as: grid }
  - { command: shape.create, params: { kind: line, from: [0, 880], to: [1000, 880], weight: 3, fill: "#ff4fa8", name: Horizon Line }, as: hline }
  - { command: shape.create, params: { kind: line, from: [0, 905], to: [1000, 905], weight: 2, fill: "#ff4fa8", name: Rows }, as: rows }
  - { command: shape.create, params: { kind: line, from: [0, 945], to: [1000, 945], weight: 2, fill: "#ff4fa8", addTo: $rows.layer, op: combine } }
  - { command: shape.create, params: { kind: line, from: [0, 1010], to: [1000, 1010], weight: 2, fill: "#ff4fa8", addTo: $rows.layer, op: combine } }
  - { command: shape.create, params: { kind: line, from: [0, 1110], to: [1000, 1110], weight: 2, fill: "#ff4fa8", addTo: $rows.layer, op: combine } }
  - { command: shape.create, params: { kind: line, from: [0, 1260], to: [1000, 1260], weight: 2, fill: "#ff4fa8", addTo: $rows.layer, op: combine } }
  - { command: shape.create, params: { kind: line, from: [500, 880], to: [500, 1400], weight: 2, fill: "#ff4fa8", name: Rays }, as: rays }
  - { command: shape.create, params: { kind: line, from: [440, 880], to: [140, 1400], weight: 2, fill: "#ff4fa8", addTo: $rays.layer, op: combine } }
  - { command: shape.create, params: { kind: line, from: [560, 880], to: [860, 1400], weight: 2, fill: "#ff4fa8", addTo: $rays.layer, op: combine } }
  - { command: shape.create, params: { kind: line, from: [380, 880], to: [-220, 1400], weight: 2, fill: "#ff4fa8", addTo: $rays.layer, op: combine } }
  - { command: shape.create, params: { kind: line, from: [620, 880], to: [1220, 1400], weight: 2, fill: "#ff4fa8", addTo: $rays.layer, op: combine } }
  - { command: layer.setProps, params: { layer: $grid.layer, opacity: 0.45 } }
  - { command: layer.new.layer, params: { name: Stage Light }, as: flare }
  - { command: layer.moveTo, params: { layer: $flare.layer, target: $grid.layer, position: above } }
  - { command: edit.fill, params: { contents: color, color: "#000000" } }
  - { command: filter.render.lensFlare, params: { centerX: 0.5, centerY: 0.628, brightness: 70, lens: prime105 } }
  - { command: layer.setProps, params: { layer: $flare.layer, blend: Screen, opacity: 0.8 } }
  - { command: type.create, params: { x: 500, y: 200, text: NEON TIDES, font: Bricolage Grotesque, weight: 800, size: 150, tracking: -20, color: "#fff4fb", align: center, name: Headline }, as: headline }
  - { command: layer.layerStyle.outerGlow, params: { layer: $headline.layer, color: "#ff3fa4", opacity: 80, size: 30, spread: 8 } }
  - { command: type.create, params: { x: 500, y: 258, text: "LIVE AT HARBOR HALL", font: Inter, weight: 600, size: 30, tracking: 420, color: "#ffc4e1", align: center, name: Venue } }
  - { command: layer.new.group, params: { name: Lineup }, as: lineup }
  - { command: type.create, params: { x: 500, y: 1030, text: "with Velvet Static · Lumen Drive · Kairo", font: Inter, size: 34, color: "#f3d9ff", align: center, name: Support }, as: support }
  - { command: shape.create, params: { kind: line, from: [400, 1080], to: [600, 1080], weight: 2, fill: "#ff6f91", name: Rule }, as: rule }
  - { command: type.create, params: { x: 500, y: 1170, text: "SAT 14 MARCH", font: Bricolage Grotesque, weight: 700, size: 72, color: "#ffffff", align: center, name: Date }, as: date }
  - { command: type.create, params: { x: 500, y: 1232, text: "DOORS 19:30  ·  SHOW 21:00", font: Inter, weight: 500, size: 28, tracking: 200, color: "#ffc4e1", align: center, name: Times }, as: times }
  - { command: type.create, params: { x: 500, y: 1330, text: "tickets at harborhall.example", font: Inter, size: 24, color: "#9c86b8", align: center, name: Tickets }, as: tickets }
expected:
  - actual: inspect
    values:
      layers: { count: 10, any: { name: Headline, kind: Type, text: { text: NEON TIDES, font: Bricolage Grotesque } } }
      layers.0: { name: Lineup, kind: Group, children: { count: 5 } }
      layers.2.effects.items: { any: { key: outerGlow } }
      layers.3: { name: Stage Light, kind: Pixel, blend: Screen, opacity: { approx: 0.8, tol: 0.01 } }
      layers.4: { name: Grid, kind: Group, opacity: { approx: 0.45, tol: 0.01 }, children: { count: 3, all: { kind: Shape } } }
      layers.4.children.1: { name: Rows, shape: { fill: "#ff4fa8" } }
      layers.6: { name: Sun, kind: Shape, shape: { fill: { gradient: { style: linear, stops: { count: 3 } } } }, effects: { items: { any: { key: outerGlow } } } }
      layers.7: { name: Haze, blend: Screen, opacity: { approx: 0.35, tol: 0.01 } }
      layers.8: { name: Sky, kind: Fill, fillContent: { gradient: { angle: 90, stops: [[0, "#0d0826"], [1, "#4a1258"]] } } }
diagnostics: []
since: "2026-11-09"

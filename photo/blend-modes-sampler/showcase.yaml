format: 1
id: photo/blend-modes-sampler
title: Blend Modes Sampler
summary: The same gradient disc over the same texture in twelve blend modes, from Multiply and Screen to Difference and Luminosity.
category: Masks & Compositing
tags: [blend-modes, shapes, render-filters, reference]
features: [photo.layer.basics, photo.path.shapes, photo.paint.gradients]
description: |
  A reference card for compositing. The base is one swatch, rendered clouds pushed through a
  gradient map with a dark-to-light ramp in Soft Light, saved with Define Pattern and laid under all
  twelve tiles as a pattern fill layer, so every tile starts from identical pixels. Each tile holds
  the same disc with a red-amber-blue gradient; only its blend mode changes. The page on top is a
  single shape with twelve rounded windows subtracted, and each label names its mode.
document: { name: blend-modes-sampler.psd, width: 1600, height: 1200 }
steps:
  - { command: layer.new.layer, params: { name: Swatch Source }, as: src }
  - { command: tools.setColors, params: { foreground: "#000000", background: "#ffffff" } }
  - { command: select.rect, params: { x: 0, y: 0, width: 347, height: 250 } }
  - { command: filter.render.clouds, params: { seed: 61 } }
  - { command: image.adjustments.gradientMap, params: { stops: [[0, "#0b132b"], [0.45, "#1f7a7a"], [0.8, "#e9b44c"], [1, "#fff3d6"]] } }
  - { command: select.deselect }
  - { command: gradient.fill.create, params: { from: [0, 0], to: [347, 0], stops: [[0, "#000000"], [1, "#ffffff"]], mode: soft-light, opacity: 90 }, as: ramp }
  - { command: select.rect, params: { x: 0, y: 0, width: 377, height: 330 } }
  - { command: edit.definePattern, params: { name: Blend Swatch }, as: swatch }
  - { command: select.deselect }
  - { command: layer.delete, params: { layer: $ramp.layer } }
  - { command: layer.delete, params: { layer: $src.layer } }
  - { command: layer.newFillLayer.pattern, params: { pattern: $swatch.pattern, phase: [60, 170] }, as: base }
  - { command: layer.renameLayer, params: { layer: $base.layer, name: Base Texture } }
  - { command: shape.create, params: { kind: ellipse, rect: [138, 200, 190, 190], fill: { gradient: { stops: [[0, "#ff4d6d"], [0.5, "#ffb703"], [1, "#3a86ff"]], angle: 0 } }, name: "Normal" }, as: d0 }
  - { command: shape.create, params: { kind: ellipse, rect: [515, 200, 190, 190], fill: { gradient: { stops: [[0, "#ff4d6d"], [0.5, "#ffb703"], [1, "#3a86ff"]], angle: 0 } }, name: "Multiply" }, as: d1 }
  - { command: layer.setProps, params: { layer: $d1.layer, blend: "Multiply" } }
  - { command: shape.create, params: { kind: ellipse, rect: [892, 200, 190, 190], fill: { gradient: { stops: [[0, "#ff4d6d"], [0.5, "#ffb703"], [1, "#3a86ff"]], angle: 0 } }, name: "Screen" }, as: d2 }
  - { command: layer.setProps, params: { layer: $d2.layer, blend: "Screen" } }
  - { command: shape.create, params: { kind: ellipse, rect: [1269, 200, 190, 190], fill: { gradient: { stops: [[0, "#ff4d6d"], [0.5, "#ffb703"], [1, "#3a86ff"]], angle: 0 } }, name: "Overlay" }, as: d3 }
  - { command: layer.setProps, params: { layer: $d3.layer, blend: "Overlay" } }
  - { command: shape.create, params: { kind: ellipse, rect: [138, 530, 190, 190], fill: { gradient: { stops: [[0, "#ff4d6d"], [0.5, "#ffb703"], [1, "#3a86ff"]], angle: 0 } }, name: "Soft Light" }, as: d4 }
  - { command: layer.setProps, params: { layer: $d4.layer, blend: "Soft Light" } }
  - { command: shape.create, params: { kind: ellipse, rect: [515, 530, 190, 190], fill: { gradient: { stops: [[0, "#ff4d6d"], [0.5, "#ffb703"], [1, "#3a86ff"]], angle: 0 } }, name: "Hard Light" }, as: d5 }
  - { command: layer.setProps, params: { layer: $d5.layer, blend: "Hard Light" } }
  - { command: shape.create, params: { kind: ellipse, rect: [892, 530, 190, 190], fill: { gradient: { stops: [[0, "#ff4d6d"], [0.5, "#ffb703"], [1, "#3a86ff"]], angle: 0 } }, name: "Color Dodge" }, as: d6 }
  - { command: layer.setProps, params: { layer: $d6.layer, blend: "Color Dodge" } }
  - { command: shape.create, params: { kind: ellipse, rect: [1269, 530, 190, 190], fill: { gradient: { stops: [[0, "#ff4d6d"], [0.5, "#ffb703"], [1, "#3a86ff"]], angle: 0 } }, name: "Color Burn" }, as: d7 }

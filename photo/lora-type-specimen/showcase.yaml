format: 1
id: photo/lora-type-specimen
title: Lora Type Specimen
summary: A one-page specimen for a serif family, with a display glyph, a weight ladder, a size waterfall and the character set.
category: Typography
tags: [type, specimen, variable-font]
features: [photo.type.point-text, photo.type.text, photo.path.shapes]
featured: true
description: |
  A foundry-style specimen sheet for Lora. Each weight on the ladder is the same variable font at a
  different `weight`, the waterfall steps the size from 72 pt down to 14 pt, and the character set
  is paragraph text wrapping inside a box. Everything stays live type.
document: { name: lora-type-specimen.psd, width: 1200, height: 900 }
fonts: [inter/Inter-Variable.ttf, lora/Lora-Variable.ttf]
steps:
  - { command: layer.newFillLayer.solidColor, params: { color: "#f4efe6" }, as: paper }
  - { command: shape.create, params: { kind: rect, rect: [0, 0, 440, 900], fill: "#1f2a44", name: Panel } }
  - { command: type.create, params: { x: 60, y: 92, text: "SPECIMEN · No. 04", font: Inter, size: 16, weight: 600, tracking: 200, color: "#e9c46a", name: Kicker } }
  - { command: type.create, params: { x: 220, y: 520, text: Aa, font: Lora, size: 300, weight: 500, color: "#f4efe6", align: center, name: Display Glyph }, as: glyph }
  - { command: type.create, params: { x: 60, y: 700, text: Lora, font: Lora, size: 64, weight: 700, color: "#f4efe6", name: Family Name } }
  - { command: type.create, params: { x: 60, y: 752, text: "Contemporary serif · variable wght 400–700", font: Inter, size: 15, color: "#aab4c8", name: Family Notes } }
  - { command: shape.create, params: { kind: line, from: [60, 800], to: [380, 800], weight: 2, fill: "#e9c46a", name: Accent Rule } }
  - { command: type.create, params: { x: 500, y: 92, text: WEIGHTS, font: Inter, size: 14, weight: 700, tracking: 250, color: "#8a7f6c", name: Weights Label } }
  - { command: type.create, params: { x: 500, y: 150, text: "Regular 400 — Quiet harbour light", font: Lora, size: 34, weight: 400, color: "#1f2a44", name: Weight 400 } }
  - { command: type.create, params: { x: 500, y: 200, text: "Medium 500 — Quiet harbour light", font: Lora, size: 34, weight: 500, color: "#1f2a44", name: Weight 500 } }
  - { command: type.create, params: { x: 500, y: 250, text: "SemiBold 600 — Quiet harbour light", font: Lora, size: 34, weight: 600, color: "#1f2a44", name: Weight 600 } }
  - { command: type.create, params: { x: 500, y: 300, text: "Bold 700 — Quiet harbour light", font: Lora, size: 34, weight: 700, color: "#1f2a44", name: Weight 700 }, as: bold }
  - { command: shape.create, params: { kind: line, from: [500, 340], to: [1140, 340], weight: 1, fill: "#cfc6b4", name: Divider 1 } }
  - { command: type.create, params: { x: 500, y: 384, text: WATERFALL, font: Inter, size: 14, weight: 700, tracking: 250, color: "#8a7f6c", name: Waterfall Label } }
  - { command: type.create, params: { x: 500, y: 460, text: Rivers bend, font: Lora, size: 72, color: "#1f2a44", name: Size 72 } }
  - { command: type.create, params: { x: 500, y: 520, text: Rivers bend toward the sea, font: Lora, size: 44, color: "#1f2a44", name: Size 44 } }
  - { command: type.create, params: { x: 500, y: 562, text: Rivers bend toward the sea in the slow autumn, font: Lora, size: 26, color: "#1f2a44", name: Size 26 } }
  - { command: type.create, params: { x: 500, y: 592, text: Rivers bend toward the sea in the slow autumn light of the northern coast, font: Lora, size: 18, color: "#1f2a44", name: Size 18 } }
  - { command: type.create, params: { x: 500, y: 618, text: "Rivers bend toward the sea in the slow autumn light of the northern coast, past the mills", font: Lora, size: 14, color: "#1f2a44", name: Size 14 } }
  - { command: shape.create, params: { kind: line, from: [500, 650], to: [1140, 650], weight: 1, fill: "#cfc6b4", name: Divider 2 } }
  - { command: type.create, params: { x: 500, y: 694, text: CHARACTER SET, font: Inter, size: 14, weight: 700, tracking: 250, color: "#8a7f6c", name: Charset Label } }
  - { command: type.create, params: { x: 500, y: 712, box: [500, 712, 640, 150], text: "ABCDEFGHIJKLMNOPQRSTUVWXYZ abcdefghijklmnopqrstuvwxyz 0123456789 & ! ? @ # % ( ) [ ] { } “ ” ‘ ’ — – · … fi fl ß æ œ ç é ñ ü", font: Lora, size: 26, leading: 38, color: "#1f2a44", name: Character Set }, as: charset }
  - { command: type.info, params: { layer: $bold.layer }, as: boldInfo }
  - { command: type.info, params: { layer: $charset.layer }, as: charsetInfo }
expected:
  - actual: inspect
    values:
      layers: { count: 23, any: { name: Display Glyph, kind: Type, text: { text: Aa } } }
      layers.0: { kind: Type, name: Character Set, text: { font: Lora, sizePt: 26 } }
      layers.-1: { name: Background, kind: Pixel }
  - actual: results
    values:
      boldInfo.runs.0.style: { font_family: Lora, weight: 700, size_pt: 34 }
      charsetInfo.shape.Box: { width: 640, height: 150 }
      charsetInfo.lines: { min: 3 }
diagnostics: []
since: "2026-11-09"

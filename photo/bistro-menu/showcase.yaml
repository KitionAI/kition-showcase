format: 1
id: photo/bistro-menu
title: Bistro Dinner Menu
summary: A printed dinner menu on fibre-textured paper, with serif headings, dotted price leaders and a double-rule border.
category: Print & Stationery
tags: [print, menu, typography, shapes, groups, render-filters]
features: [photo.type.point-text, photo.path.shapes, photo.filter.stylize, photo.layer.manage, photo.layer.solid-fill]
featured: true
description: |
  A one-page menu set in Lora and Inter. The paper is a solid fill layer under rendered Fibers in
  Multiply, the border is two stroked rectangles, and every dotted leader is an open path with a
  round-capped dashed stroke that starts where its dish name ends: it is drawn from the name's
  width (the step reads the name's bounds) and moved right by the 130 px margin the names start at.
  Each course is its own group of names, leaders, prices and notes.
document: { name: bistro-menu.psd, width: 1000, height: 1414 }
fonts: [lora/Lora-Variable.ttf]
steps:
  - { command: layer.newFillLayer.solidColor, params: { color: "#f6efe2" }, as: paper }
  - { command: layer.setProps, params: { layer: $paper.layer, name: Paper } }
  - { command: tools.setColors, params: { foreground: "#e2d3b5", background: "#f6efe2" } }
  - { command: layer.new.layer, params: { name: Paper Fibres }, as: fibres }
  - { command: filter.render.fibers, params: { variance: 20, strength: 6, seed: 4 } }
  - { command: layer.setProps, params: { layer: $fibres.layer, blend: Multiply, opacity: 0.4 } }
  - { command: shape.create, params: { kind: rect, rect: [40, 40, 920, 1334], fill: null, stroke: { width: 2, color: "#5d6b33" }, name: Border Outer } }
  - { command: shape.create, params: { kind: rect, rect: [52, 52, 896, 1310], fill: null, stroke: { width: 1, color: "#5d6b33" }, name: Border Inner } }
  - { command: layer.new.group, params: { name: Masthead }, as: mast }
  - { command: type.create, params: { x: 500, y: 170, text: Maison Olive, font: Lora, weight: 600, size: 96, color: "#2f3a17", align: center, name: Restaurant }, as: m1 }
  - { command: type.create, params: { x: 500, y: 220, text: "BISTRO · WINE BAR · EST. 2014", font: Inter, weight: 500, size: 18, tracking: 400, color: "#7a6a4f", align: center, name: Tagline }, as: m2 }
  - { command: shape.create, params: { kind: line, from: [330, 268], to: [470, 268], weight: 1.5, fill: "#5d6b33", name: Rule Left }, as: m3 }
  - { command: shape.create, params: { kind: polygon, rect: [490, 258, 20, 20], sides: 4, fill: "#5d6b33", name: Diamond }, as: m4 }
  - { command: shape.create, params: { kind: line, from: [530, 268], to: [670, 268], weight: 1.5, fill: "#5d6b33", name: Rule Right }, as: m5 }
  - { command: type.create, params: { x: 500, y: 314, text: Autumn dinner menu, font: Lora, italic: true, size: 28, color: "#7a6a4f", align: center, name: Season }, as: m6 }
  - { command: layer.new.group, params: { name: Starters }, as: starters }
  - { command: layer.moveTo, params: { layer: $starters.layer, target: $mast.layer, position: above } }
  - { command: type.create, params: { x: 500, y: 390, text: Starters, font: Lora, italic: true, weight: 500, size: 40, color: "#5d6b33", align: center, name: Starters Heading }, as: startersh }
  - { command: type.create, params: { x: 130, y: 450, text: "Burrata & roasted peaches", font: Lora, weight: 600, size: 28, color: "#2f3a17", name: "Burrata & roasted peaches" }, as: i1 }
  - { command: shape.create, params: { kind: path, path: { subpaths: [{ closed: false, knots: [[$i1.bounds.2, 446], [690, 446]] }] }, fill: null, stroke: { width: 3, color: "#b4a585", dashes: [0, 3], dashOffset: -2, cap: round }, name: Leader 1 }, as: l1 }

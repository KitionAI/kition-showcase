format: 1
id: photo/instagram-story-plant-market
title: Instagram Story Plant Market
summary: A vertical story for a weekend plant market, with an arched window, a bezier-leaf plant illustration and a sticker badge.
category: Social Media
tags: [social, instagram, story, shapes, illustration, layer-styles, type, emoji]
features: [photo.path.shapes, photo.layer.mask-basics, photo.layer.style-basics, photo.type.point-text, photo.layer.manage]
description: |
  A 9:16 story (900 × 1600, the 1080 × 1920 layout scaled down). The arch is a rounded rectangle
  with only its top corners rounded and a gradient fill; the sun disc is clipped to it.
  All seven leaves are one path shape layer drawn with bezier handles, the pot is a custom path
  with an Inner Shadow, and the sticker is a 14-point star with a Drop Shadow. The location pin is
  a colour emoji from Noto Color Emoji, set in the same line as the Inter text.
document: { name: instagram-story-plant-market.psd, width: 900, height: 1600 }
fonts: [inter/Inter-Variable.ttf, lora/Lora-Variable.ttf, bricolage-grotesque/BricolageGrotesque-Variable.ttf, noto-color-emoji/Noto-COLRv1.ttf]
steps:
  - { command: layer.newFillLayer.solidColor, params: { color: "#e6eddf" }, as: bg }
  - { command: layer.setProps, params: { layer: $bg.layer, name: Sage } }
  - { command: type.create, params: { x: 450, y: 140, text: "SAT & SUN · 10:00–16:00", font: Inter, weight: 600, size: 26, tracking: 300, color: "#4f6b55", align: center, name: When } }
  - { command: type.create, params: { x: 450, y: 270, text: Weekend, font: Lora, italic: true, weight: 500, size: 112, color: "#c8693f", align: center, name: Title Script } }
  - { command: type.create, params: { x: 450, y: 390, text: Plant Market, font: Bricolage Grotesque, weight: 800, size: 116, tracking: -30, color: "#1f3d2b", align: center, name: Title } }
  - { command: layer.new.group, params: { name: Illustration }, as: illo }
  - { command: shape.create, params: { kind: roundedRect, rect: [150, 470, 600, 760], radii: [300, 300, 28, 28], fill: { gradient: { stops: [[0, "#f6b98f"], [1, "#fbe8cc"]], angle: -90 } }, name: Arch }, as: arch }
  - { command: shape.create, params: { kind: ellipse, rect: [330, 600, 240, 240], fill: "#fff3dc", name: Sun }, as: sun }
  - { command: layer.createClippingMask, params: { layer: $sun.layer } }
  - { command: shape.create, params: { kind: path, path: {"subpaths": [{"closed": true, "knots": [{"anchor": [450.0, 1000.0], "in": [362.2, 1023.5], "out": [420.4, 914.0]}, {"anchor": [282.2, 910.8], "in": [358.8, 888.3], "out": [306.4, 986.8]}]}, {"closed": true, "knots": [{"anchor": [450.0, 1000.0], "in": [348.5, 975.5], "out": [443.5, 895.8]}, {"anchor": [295.7, 816.1], "in": [384.8, 835.4], "out": [299.3, 907.2]}]}, {"closed": true, "knots": [{"anchor": [450.0, 1000.0], "in": [360.8, 926.0], "out": [478.7, 887.6]}, {"anchor": [363.5, 733.7], "in": [442.5, 796.3], "out": [336.4, 830.8]}]}, {"closed": true, "knots": [{"anchor": [450.0, 1000.0], "in": [388.0, 895.0], "out": [512.0, 895.0]}, {"anchor": [450.0, 700.0], "in": [505.8, 790.0], "out": [394.2, 790.0]}]}, {"closed": true, "knots": [{"anchor": [450.0, 1000.0], "in": [420.2, 891.0], "out": [538.2, 929.3]}, {"anchor": [533.4, 743.2], "in": [561.5, 837.5], "out": [455.3, 803.0]}]}, {"closed": true, "knots": [{"anchor": [450.0, 1000.0], "in": [455.4, 897.1], "out": [550.4, 976.8]}, {"anchor": [601.1, 820.0], "in": [598.5, 909.9], "out": [513.0, 838.1]}]}, {"closed": true, "knots": [{"anchor": [450.0, 1000.0], "in": [478.1, 914.9], "out": [536.3, 1024.3]}, {"anchor": [613.3, 913.1], "in": [590.5, 988.5], "out": [538.1, 889.9]}]}]}, fill: { gradient: { stops: [[0, "#2f6b45"], [1, "#6fae6a"]], angle: 90 } }, name: Leaves }, as: leaves }
  - { command: shape.create, params: { kind: path, path: { subpaths: [{ knots: [[350, 1020], [550, 1020], [522, 1200], [378, 1200]] }] }, fill: "#c8693f", name: Pot }, as: pot }
  - { command: layer.layerStyle.innerShadow, params: { layer: $pot.layer, color: "#7a3418", opacity: 45, distance: 10, size: 18, angle: 180 } }
  - { command: shape.create, params: { kind: roundedRect, rect: [330, 990, 240, 44], radii: 10, fill: "#b25732", name: Pot Rim }, as: rim }
  - { command: layer.new.group, params: { name: Sticker }, as: sticker }
  - { command: layer.moveTo, params: { layer: $sticker.layer, target: $illo.layer, position: above } }
  - { command: shape.create, params: { kind: star, rect: [600, 470, 210, 210], sides: 14, starRatio: 0.84, fill: "#ff7b54", name: Badge }, as: badge }
  - { command: layer.layerStyle.dropShadow, params: { layer: $badge.layer, color: "#7a3418", opacity: 30, distance: 8, size: 14 } }
  - { command: type.create, params: { x: 705, y: 568, text: FREE, font: Bricolage Grotesque, weight: 800, size: 46, color: "#ffffff", align: center, name: Badge Line 1 }, as: b1 }
  - { command: type.create, params: { x: 705, y: 606, text: ENTRY, font: Inter, weight: 700, size: 24, tracking: 200, color: "#ffffff", align: center, name: Badge Line 2 }, as: b2 }
  - { command: type.create, params: { x: 450, y: 1320, text: "📍 Old Tram Depot · Riverside", font: Inter, weight: 500, size: 30, color: "#1f3d2b", align: center, name: Where }, as: where }
  - { command: layer.moveTo, params: { layer: $where.layer, target: $sticker.layer, position: above } }
  - { command: shape.create, params: { kind: roundedRect, rect: [230, 1380, 440, 96], radii: 48, fill: "#1f3d2b", name: Button }, as: button }
  - { command: type.create, params: { x: 450, y: 1440, text: "Get directions  →", font: Inter, weight: 700, size: 32, color: "#ffffff", align: center, name: Button Label } }
  - { command: type.create, params: { x: 450, y: 1540, text: "@greenhouse.collective", font: Inter, size: 24, color: "#6c8571", align: center, name: Handle } }

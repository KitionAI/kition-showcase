format: 1
id: photo/variable-font-axes-poster
title: Variable Font Axes Poster
summary: A design-week poster that steps one word through the weight and width axes of a variable font.
category: Typography
tags: [type, variable-font, poster]
features: [photo.type.features, photo.type.point-text]
featured: true
description: |
  Every SHIFT is the same Bricolage Grotesque variable font with different `variations`: weight
  climbs from 200 to 800 while width opens from 75 to 100, and each line carries its axis values
  as a caption. The colours walk from peach to plum down the stack.
document: { name: variable-font-axes-poster.psd, width: 900, height: 1200 }
fonts: [bricolage-grotesque/BricolageGrotesque-Variable.ttf]
steps:
  - { command: layer.newFillLayer.solidColor, params: { color: "#1d1530" }, as: ground }
  - { command: type.create, params: { x: 80, y: 120, text: "TYPE IN MOTION", font: Inter, size: 18, weight: 600, tracking: 300, color: "#ffd6a5", name: Eyebrow } }
  - { command: type.create, params: { x: 820, y: 120, text: "Design Week · Hall C", font: Inter, size: 18, color: "#c9bfd6", align: right, name: Venue } }
  - { command: shape.create, params: { kind: line, from: [80, 150], to: [820, 150], weight: 2, fill: "#3b2f55", name: Top Rule } }
  - { command: type.create, params: { x: 80, y: 290, text: SHIFT, font: Bricolage Grotesque, size: 150, variations: { wght: 200, wdth: 75.0, opsz: 96 }, color: "#ffd6a5", name: "SHIFT wght 200" }, as: w200 }
  - { command: type.create, params: { x: 820, y: 228, text: "wght 200  wdth 75", font: Inter, size: 15, weight: 500, color: "#c9bfd6", align: right, name: "Axis Label 200" } }
  - { command: type.create, params: { x: 80, y: 408, text: SHIFT, font: Bricolage Grotesque, size: 150, variations: { wght: 300, wdth: 79.2, opsz: 96 }, color: "#ffb38a", name: "SHIFT wght 300" }, as: w300 }
  - { command: type.create, params: { x: 820, y: 346, text: "wght 300  wdth 79.2", font: Inter, size: 15, weight: 500, color: "#c9bfd6", align: right, name: "Axis Label 300" } }
  - { command: type.create, params: { x: 80, y: 526, text: SHIFT, font: Bricolage Grotesque, size: 150, variations: { wght: 400, wdth: 83.3, opsz: 96 }, color: "#ff8f70", name: "SHIFT wght 400" }, as: w400 }
  - { command: type.create, params: { x: 820, y: 464, text: "wght 400  wdth 83.3", font: Inter, size: 15, weight: 500, color: "#c9bfd6", align: right, name: "Axis Label 400" } }
  - { command: type.create, params: { x: 80, y: 644, text: SHIFT, font: Bricolage Grotesque, size: 150, variations: { wght: 500, wdth: 87.5, opsz: 96 }, color: "#f76a6a", name: "SHIFT wght 500" }, as: w500 }
  - { command: type.create, params: { x: 820, y: 582, text: "wght 500  wdth 87.5", font: Inter, size: 15, weight: 500, color: "#c9bfd6", align: right, name: "Axis Label 500" } }
  - { command: type.create, params: { x: 80, y: 762, text: SHIFT, font: Bricolage Grotesque, size: 150, variations: { wght: 600, wdth: 91.7, opsz: 96 }, color: "#e04f7c", name: "SHIFT wght 600" }, as: w600 }
  - { command: type.create, params: { x: 820, y: 700, text: "wght 600  wdth 91.7", font: Inter, size: 15, weight: 500, color: "#c9bfd6", align: right, name: "Axis Label 600" } }
  - { command: type.create, params: { x: 80, y: 880, text: SHIFT, font: Bricolage Grotesque, size: 150, variations: { wght: 700, wdth: 95.8, opsz: 96 }, color: "#b23a8a", name: "SHIFT wght 700" }, as: w700 }
  - { command: type.create, params: { x: 820, y: 818, text: "wght 700  wdth 95.8", font: Inter, size: 15, weight: 500, color: "#c9bfd6", align: right, name: "Axis Label 700" } }
  - { command: type.create, params: { x: 80, y: 998, text: SHIFT, font: Bricolage Grotesque, size: 150, variations: { wght: 800, wdth: 100.0, opsz: 96 }, color: "#7a2e8e", name: "SHIFT wght 800" }, as: w800 }
  - { command: type.create, params: { x: 820, y: 936, text: "wght 800  wdth 100", font: Inter, size: 15, weight: 500, color: "#c9bfd6", align: right, name: "Axis Label 800" } }
  - { command: shape.create, params: { kind: line, from: [80, 1050], to: [820, 1050], weight: 2, fill: "#3b2f55", name: Bottom Rule } }
  - { command: type.create, params: { x: 80, y: 1110, text: "One font file. Every weight in between.", font: Bricolage Grotesque, size: 30, variations: { wght: 600, wdth: 100, opsz: 30 }, color: "#f4eefb", name: Tagline } }
  - { command: type.create, params: { x: 820, y: 1110, text: "12–16 MAR", font: Inter, size: 24, weight: 600, color: "#ffb38a", align: right, name: Dates } }
  - { command: type.info, params: { layer: $w200.layer }, as: thin }
  - { command: type.info, params: { layer: $w800.layer }, as: heavy }
expected:
  - actual: inspect
    values:
      layers: { count: 22, any: { name: SHIFT wght 800, kind: Type, text: { font: Bricolage Grotesque, text: SHIFT } } }
      layers.-2: { kind: Fill, fillContent: "#1d1530" }
  - actual: results
    values:
      thin.runs.0.style.variations: { any: { axis: wght, value: 200 } }
      heavy.runs.0.style.variations: { count: 3, any: { axis: wdth, value: 100 } }
      heavy.bounds.2: { min: 340 }
      thin.bounds.2: { max: 220 }
diagnostics: []
since: "2026-11-09"

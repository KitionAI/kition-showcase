format: 1
id: photo/double-exposure-portrait
title: Double Exposure Portrait
summary: A forest at dusk seen through a profile silhouette, built from layers clipped to one head-shaped path.
category: Masks & Compositing
tags: [clipping-mask, blend-modes, shapes, render-filters, poster]
features: [photo.layer.mask-basics, photo.path.shapes, photo.paint.gradients, photo.type.point-text]
featured: true
description: |
  The classic double-exposure look without a photograph. A profile drawn as one smooth path is the
  base of a clipping group; above it, clipped, sit a dusk sky gradient, a moon, rendered clouds in
  Screen mode, three rows of pine silhouettes fading into mist, and a few birds. Nothing spills
  outside the head (three more birds, unclipped, fly free of it), and the cream page shows through where the clipped layers are transparent.
document: { name: double-exposure-portrait.psd, width: 1100, height: 1400 }
fonts: [lora/Lora-Variable.ttf]

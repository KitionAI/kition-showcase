format: 1
id: photo/wood-grain-type-clipping
title: Wood Grain Type Clipping
summary: A workshop sign whose letters show a wood texture through a clipping mask; the wood is a smart object with editable smart filters.
category: Masks & Compositing
tags: [clipping-mask, smart-filters, smart-objects, type, textures]
features: [photo.layer.mask-basics, photo.filter.smart, photo.layer.smart-objects, photo.layer.style-basics]
description: |
  The wood is rendered Fibers in two browns, converted to a smart object so that a Wave, a Motion
  Blur and a touch of Noise stay editable as smart filters. Clipped to the heavy headline below it,
  the texture shows only inside the letters, and the type layer's own bevel and drop shadow carve
  the letters out of the dark wall. Edit the text and the wood follows.
document: { name: wood-grain-type-clipping.psd, width: 1600, height: 900 }
fonts: [bricolage-grotesque/BricolageGrotesque-Variable.ttf]
steps:
  - { command: edit.fill, params: { contents: color, color: "#1f1a17" } }
  - { command: gradient.fill.create, params: { from: [800, 420], to: [800, 1100], style: radial, stops: [[0, "#000000"], [1, "#000000"]], transparency: [[0, 0], [1, 70]] }, as: vignette }
  - { command: layer.renameLayer, params: { layer: $vignette.layer, name: Vignette } }
  - { command: type.create, params: { x: 800, y: 560, text: TIMBER, font: Bricolage Grotesque, size: 330, weight: 800, tracking: 10, color: "#000000", align: center, name: Headline }, as: word }
  - { command: layer.layerStyle.bevelEmboss, params: { layer: $word.layer, style: innerBevel, depth: 120, size: 10, soften: 2, angle: 120, altitude: 35 } }
  - { command: layer.layerStyle.dropShadow, params: { layer: $word.layer, add: true, color: "#000000", opacity: 70, distance: 14, size: 26, angle: 120 } }
  - { command: layer.new.layer, params: { name: Oak Grain }, as: wood }
  - { command: select.rect, params: { x: 220, y: 300, width: 1160, height: 300 } }
  - { command: filter.render.fibers, params: { variance: 24, strength: 10, seed: 3, foreground: "#5b3518", background: "#c8915a" } }
  - { command: select.deselect }
  - { command: layer.smartObjects.convertToSmartObject, params: { layer: $wood.layer }, as: woodSo }
  - { command: filter.distort.wave, params: { generators: 3, wavelengthMin: 200, wavelengthMax: 420, amplitudeMin: 8, amplitudeMax: 22, type: sine, seed: 7 } }
  - { command: filter.blur.motionBlur, params: { angle: 90, distance: 18 } }
  - { command: filter.noise.addNoise, params: { amount: 3, distribution: gaussian, monochromatic: true, seed: 5 } }
  - { command: layer.createClippingMask, params: { layer: $woodSo.layer } }
  - { command: type.create, params: { x: 800, y: 700, text: "HAND-BUILT FURNITURE  ·  EST. 1987", font: Bricolage Grotesque, size: 40, weight: 600, tracking: 300, color: "#c8915a", align: center, name: Tagline } }
  - { command: shape.create, params: { kind: line, from: [420, 760], to: [1180, 760], weight: 2, fill: "#6d4a2c", name: Rule } }
expected:
  - actual: inspect
    values:
      layers: { count: 6 }
      layers.2: { name: Oak Grain, kind: Smart Object, clipped: true, smartFiltersEnabled: true, smartFilters: { count: 3, any: { command: filter.blur.motionBlur, params: { angle: 90, distance: 18 } } } }
      layers.2.smartFilters.0: { command: filter.distort.wave }
      layers.3: { name: Headline, kind: Type, clipped: false, text: { text: TIMBER }, effects: { items: { count: 2, any: { kind: Bevel & Emboss } } } }
diagnostics: []
since: "2026-11-09"

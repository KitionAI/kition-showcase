format: 1
id: photo/youtube-thumbnail
title: YouTube Video Thumbnail
summary: A bold build-vlog thumbnail with outlined headline type, a rendered tree, a glowing cabin and a red call-out arrow.
category: Social Media
tags: [social, youtube, thumbnail, layer-styles, type, shapes, render-filters]
features: [photo.layer.styles, photo.layer.style-basics, photo.path.shapes, photo.filter.stylize, photo.type.point-text, photo.layer.manage]
featured: true
description: |
  A 1280 × 720 thumbnail meant to read at phone size. The headline words carry a thick black
  Stroke and a hard Drop Shadow; the yellow "30 DAYS" adds a Gradient Overlay. The scene behind is
  built from path shapes (mountains, a cabin with a glowing window) and a tree from Render > Tree,
  and the red arrow is a single custom path with a white stroke.
document: { name: youtube-thumbnail.psd, width: 1280, height: 720 }
fonts: [inter/Inter-Variable.ttf, bricolage-grotesque/BricolageGrotesque-Variable.ttf]
steps:
  - { command: layer.newFillLayer.gradient, params: { from: "#ffb46b", to: "#3b5fc4", angle: 90, style: linear }, as: sky }
  - { command: layer.setProps, params: { layer: $sky.layer, name: Sky } }
  - { command: layer.new.group, params: { name: Scene }, as: scene }
  - { command: shape.create, params: { kind: path, path: { subpaths: [{ knots: [[0, 520], [160, 330], [300, 450], [470, 280], [650, 470], [820, 300], [1010, 430], [1150, 320], [1280, 410], [1280, 720], [0, 720]] }] }, fill: "#5a6fb8", name: Far Ridge }, as: far }
  - { command: shape.create, params: { kind: path, path: { subpaths: [{ knots: [[0, 600], [240, 470], [430, 560], [700, 430], [960, 540], [1280, 460], [1280, 720], [0, 720]] }] }, fill: "#34478a", name: Near Ridge }, as: near }
  - { command: shape.create, params: { kind: path, path: { subpaths: [{ knots: [[0, 640], [400, 610], [900, 600], [1280, 625], [1280, 720], [0, 720]] }] }, fill: "#1f3b2c", name: Meadow }, as: meadow }
  - { command: layer.new.layer, params: { name: Oak }, as: tree }
  - { command: filter.render.tree, params: { baseTreeType: 1, x: 0.93, y: 0.89, size: 0.5, leavesAmount: 80, seed: 3 } }
  - { command: shape.create, params: { kind: rect, rect: [850, 470, 260, 160], fill: "#7a4a2b", name: Cabin Walls }, as: walls }
  - { command: shape.create, params: { kind: path, path: { subpaths: [{ knots: [[820, 480], [980, 360], [1140, 480]] }] }, fill: "#3a2418", name: Roof }, as: roof }
  - { command: shape.create, params: { kind: rect, rect: [890, 540, 50, 90], fill: "#3a2418", name: Door } }
  - { command: shape.create, params: { kind: rect, rect: [990, 520, 80, 60], fill: "#ffd76a", name: Window }, as: window }
  - { command: layer.layerStyle.outerGlow, params: { layer: $window.layer, color: "#ffc24a", opacity: 85, size: 40, spread: 10 } }
  - { command: shape.create, params: { kind: path, path: { subpaths: [{ knots: [[640, 520], [760, 520], [760, 490], [830, 550], [760, 610], [760, 580], [640, 580]] }] }, fill: "#e8262b", stroke: { width: 6, color: "#ffffff", align: outside, join: round }, name: Arrow }, as: arrow }
  - { command: layer.moveTo, params: { layer: $arrow.layer, target: $scene.layer, position: above } }
  - { command: layer.layerStyle.dropShadow, params: { layer: $arrow.layer, color: "#000000", opacity: 60, distance: 6, size: 8 } }
  - { command: type.create, params: { x: 56, y: 190, text: TINY CABIN, font: Bricolage Grotesque, weight: 800, size: 130, tracking: -20, color: "#ffffff", name: Headline }, as: headline }
  - { command: layer.layerStyle.stroke, params: { layer: $headline.layer, size: 10, position: outside, color: "#111111" } }
  - { command: layer.layerStyle.dropShadow, params: { layer: $headline.layer, add: true, color: "#000000", opacity: 70, distance: 10, size: 0, spread: 100, angle: 135 } }
  - { command: type.create, params: { x: 50, y: 400, text: 30 DAYS, font: Bricolage Grotesque, weight: 800, size: 220, tracking: -30, color: "#ffd23f", name: Hook }, as: hook }
  - { command: layer.layerStyle.gradientOverlay, params: { layer: $hook.layer, from: "#ffe46b", to: "#ffb11f", angle: 90 } }
  - { command: layer.layerStyle.stroke, params: { layer: $hook.layer, add: true, size: 12, position: outside, color: "#111111" } }
  - { command: layer.layerStyle.dropShadow, params: { layer: $hook.layer, add: true, color: "#000000", opacity: 70, distance: 12, size: 0, spread: 100, angle: 135 } }
  - { command: shape.create, params: { kind: roundedRect, rect: [60, 460, 300, 64], radii: 12, fill: "#e8262b", name: Tag }, as: tag }
  - { command: type.create, params: { x: 210, y: 505, text: SOLO BUILD, font: Inter, weight: 800, size: 34, tracking: 100, color: "#ffffff", align: center, name: Tag Label } }
expected:
  - actual: inspect
    values:
      layers: { count: 8 }
      layers.2: { name: Hook, kind: Type, text: { text: 30 DAYS }, effects: { items: { count: 3, any: { key: stroke } } } }
      layers.3: { name: Headline, effects: { items: { count: 2 } } }
      layers.4: { name: Arrow, kind: Shape, shape: { fill: "#e8262b", stroke: { fill: "#ffffff", width: 6, align: outside } }, effects: { items: { any: { key: dropShadow } } } }
      layers.5: { name: Scene, kind: Group, children: { count: 8, any: { name: Oak, kind: Pixel } } }
      layers.5.children.0: { name: Window, shape: { fill: "#ffd76a" }, effects: { items: { any: { key: outerGlow } } } }
      layers.6: { name: Sky, kind: Fill, fillContent: { gradient: { angle: 90, stops: [[0, "#ffb46b"], [1, "#3b5fc4"]] } } }
diagnostics: []

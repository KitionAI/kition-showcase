format: 1
id: photo/isometric-city-block
title: Isometric City Block
summary: A tiny isometric town of towers, a cafe, a shop, trees and a road, every face a flat-shaded shape in true 30° projection.
category: Shapes & Illustration
tags: [shapes, illustration, isometric, layer-styles]
features: [photo.path.shapes, photo.layer.style-basics, photo.layer.basics]
description: |
  An isometric spot illustration for a city app's onboarding screen. Every block is three path
  shapes (a light top, a dark left face and a mid right face) projected at 30°, drawn back to front
  so nearer blocks overlap farther ones; the window grids are one compound shape per building,
  and each building, tree, the road and the platform are grouped. The
  tree crowns are ellipses with an inner shadow, and the whole block floats on a platform whose top
  casts a soft drop shadow over a gradient backdrop with two simple clouds.
document: { name: isometric-city-block.psd, width: 1600, height: 1000 }

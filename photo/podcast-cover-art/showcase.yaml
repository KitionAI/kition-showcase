format: 1
id: photo/podcast-cover-art
title: Podcast Cover Art
summary: Square podcast artwork with a halftone-textured gradient, a dark disc, a gradient waveform and a stacked bold title.
category: Social Media
tags: [social, podcast, cover-art, gradient, shapes, halftone, layer-styles]
features: [photo.layer.adjustment, photo.path.shapes, photo.layer.styles, photo.filter.stylize, photo.type.point-text]
description: |
  Cover art at 1400 × 1400, the smallest size podcast directories accept. A Color Halftone of
  rendered clouds, set to Soft Light, gives the gradient fill a printed texture. The waveform is
  27 rounded rectangles combined into one shape layer with a Gradient Overlay, sitting on a dark
  disc with an Outer Glow; the title words stack in Bricolage Grotesque.
document: { name: podcast-cover-art.psd, width: 1400, height: 1400 }
fonts: [inter/Inter-Variable.ttf, bricolage-grotesque/BricolageGrotesque-Variable.ttf]
steps:
  - { command: layer.newFillLayer.gradient, params: { from: "#ff3d6e", to: "#ff8a3d", angle: 45, style: linear }, as: bg }
  - { command: layer.setProps, params: { layer: $bg.layer, name: Gradient } }
  - { command: tools.setColors, params: { foreground: "#000000", background: "#ffffff" } }
  - { command: layer.new.layer, params: { name: Halftone }, as: halftone }
  - { command: filter.render.clouds, params: { seed: 21 } }
  - { command: filter.pixelate.colorHalftone, params: { maxRadius: 14 } }
  - { command: image.adjustments.desaturate }
  - { command: layer.setProps, params: { layer: $halftone.layer, blend: Soft Light, opacity: 0.45 } }
  - { command: shape.create, params: { kind: ellipse, rect: [300, 200, 800, 800], fill: "#1b1030", name: Disc }, as: disc }
  - { command: layer.layerStyle.outerGlow, params: { layer: $disc.layer, color: "#ffb347", opacity: 45, size: 80, spread: 0 } }
  - { command: shape.create, params: { kind: roundedRect, rect: [364.4, 580.0, 16, 40], radii: 8, fill: "#ffd166", name: Waveform }, as: wave }
  - { command: shape.create, params: { kind: roundedRect, rect: [389.6, 546.0, 16, 108], radii: 8, addTo: $wave.layer } }
  - { command: shape.create, params: { kind: roundedRect, rect: [414.8, 513.0, 16, 174], radii: 8, addTo: $wave.layer } }

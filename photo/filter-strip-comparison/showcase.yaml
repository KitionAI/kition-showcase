format: 1
id: photo/filter-strip-comparison
title: Filter Strip Comparison
summary: One harbor scene cut into six bands, each run through a different filter, from Gaussian Blur and Mosaic to Color Halftone, Emboss and Oil Paint.
category: Filters & Textures
tags: [filters, render-filters, selections, reference]
features: [photo.filter.blur, photo.filter.stylize, photo.select.make, photo.layer.basics]
description: |
  A harbor at sunset is drawn with shapes (sky, sun, sea, sailboats, gulls) plus rendered clouds,
  then merged into one pixel layer. Six rectangular selections split it into bands, and each band
  gets one filter applied inside its selection only: the original, Gaussian Blur, Mosaic, Color
  Halftone, Emboss and Oil Paint. The labels underneath name the filter and its main setting.
document: { name: filter-strip-comparison.psd, width: 1620, height: 1000 }
steps:
  - { command: gradient.fill.create, params: { from: [0, 0], to: [0, 600], stops: [[0, "#3d348b"], [0.55, "#e76f51"], [1, "#f4a261"]] }, as: sky }
  - { command: layer.new.layer, params: { name: Clouds }, as: clouds }
  - { command: tools.setColors, params: { foreground: "#000000", background: "#ffd6a5" } }
  - { command: filter.render.clouds, params: { seed: 90 } }
  - { command: image.adjustments.levels, params: { inBlack: 120 } }
  - { command: filter.blur.motionBlur, params: { angle: 0, distance: 90 } }
  - { command: layer.setProps, params: { layer: $clouds.layer, blend: Screen, opacity: 0.7 } }
  - { command: shape.create, params: { kind: ellipse, rect: [825, 380, 240, 240], fill: "#ffd166", name: Sun } }

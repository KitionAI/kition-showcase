format: 1
id: photo/painted-lavender-postcard
title: Painted Lavender Postcard
summary: A vector landscape turned into a gouache-style postcard by three smart filters on one smart object.
category: Filters & Textures
tags: [smart-filters, smart-objects, filters, illustration, print]
features: [photo.filter.smart, photo.layer.smart-objects, photo.filter.gallery, photo.path.shapes]
description: |
  The scene starts as clean shapes: a sky gradient, a sun, rolling hills, converging rows of
  lavender and a lone tree, plus a soft wash of rendered clouds over the sky in Soft Light. All of it is
  converted into one smart object, and the painting happens in smart filters: Spatter roughens the
  edges, Fresco pools the color into dabs, and Texturizer adds the paper's canvas tooth. All three
  stay editable and can be switched off to get the vector original back. A white border, a stamp
  and a caption make it a postcard.
document: { name: painted-lavender-postcard.psd, width: 1500, height: 1000 }
fonts: [inter/Inter-Variable.ttf, lora/Lora-Variable.ttf]
steps:
  - { command: gradient.fill.create, params: { from: [0, 60], to: [0, 600], stops: [[0, "#8fb8de"], [0.7, "#f7d9b9"], [1, "#fbe7c6"]] }, as: sky }
  - { command: layer.renameLayer, params: { layer: $sky.layer, name: Sky } }
  - { command: shape.create, params: { kind: ellipse, rect: [1020, 230, 170, 170], fill: "#fbd17a", name: Sun } }
  - { command: shape.create, params: { kind: path, name: Far Hills, fill: "#9fa8c9", path: { subpaths: [ { knots: [[0, 520], {anchor: [350, 440], in: [180, 450], out: [520, 430], smooth: true}, {anchor: [820, 500], in: [660, 470], out: [980, 530], smooth: true}, {anchor: [1250, 450], in: [1100, 450], out: [1400, 450], smooth: true}, [1500, 480], [1500, 1000], [0, 1000]] } ] } } }
  - { command: shape.create, params: { kind: path, name: Green Hill, fill: "#9cbf73", path: { subpaths: [ { knots: [[0, 600], {anchor: [600, 540], in: [300, 545], out: [900, 535], smooth: true}, {anchor: [1500, 590], in: [1200, 545], out: [1500, 590]}, [1500, 1000], [0, 1000]] } ] } } }
  - { command: shape.create, params: { kind: path, name: Lavender Rows, fill: "#8e6bbf", path: { subpaths: [ { knots: [[706, 560], [-715, 1000], [-825, 1000]] } ] } }, as: rows }

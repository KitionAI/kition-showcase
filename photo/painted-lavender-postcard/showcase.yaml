  - { command: filter.render.clouds, params: { seed: 12 } }
  - { command: filter.noise.addNoise, params: { amount: 20, distribution: gaussian, monochromatic: true, seed: 13 } }
  - { command: filter.blur.gaussianBlur, params: { radius: 2 } }
  - { command: select.deselect }
  - { command: layer.setProps, params: { layer: $wash.layer, blend: Soft Light, opacity: 0.6 } }
  - { command: select.allLayers }
  - { command: layer.smartObjects.convertToSmartObject, as: painting }
  - { command: layer.renameLayer, params: { layer: $painting.layer, name: Painting } }
  - { command: filter.gallery.spatter, params: { sprayRadius: 10, smoothness: 8 } }
  - { command: filter.gallery.fresco, params: { brushSize: 3, brushDetail: 7, texture: 1 } }
  - { command: filter.gallery.texturizer, params: { texture: canvas, scaling: 100, relief: 3, light: topLeft } }
  - { command: shape.create, params: { kind: path, name: Card Border, fill: "#fbf8f2", path: { subpaths: [ { knots: [[0, 0], [1500, 0], [1500, 1000], [0, 1000]] }, { op: subtract, knots: [[40, 40], [1460, 40], [1460, 960], [40, 960]] } ] } } }
  - { command: shape.create, params: { kind: roundedRect, rect: [1290, 80, 130, 160], radii: 6, fill: "#fbf8f2", stroke: { width: 4, color: "#8e6bbf", dashes: [2, 1.5], cap: round }, name: Stamp }, as: stamp }
  - { command: layer.layerStyle.dropShadow, params: { layer: $stamp.layer, color: "#3b2a55", opacity: 30, distance: 4, size: 8, angle: 120 } }
  - { command: shape.create, params: { kind: ellipse, rect: [1318, 120, 74, 74], fill: "#8e6bbf", name: Stamp Motif } }
  - { command: type.create, params: { x: 1355, y: 222, text: "45c", font: Inter, size: 20, weight: 700, color: "#3b2a55", align: center, name: Stamp Value } }
  - { command: type.create, params: { x: 100, y: 170, text: "Greetings from", font: Lora, size: 56, italic: true, color: "#2f2a4a", name: Greeting } }
  - { command: type.create, params: { x: 100, y: 270, text: "the Lavender Coast", font: Lora, size: 84, weight: 700, italic: true, color: "#2f2a4a", name: Place } }

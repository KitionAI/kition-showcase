format: 1
id: photo/summer-sale-wave-banner
title: Summer Sale Wave Banner
summary: A wide e-commerce banner with a red rising sun over a pattern of overlapping waves and a mixed-font discount headline.
category: Posters & Marketing
tags: [banner, web, shapes, pattern, masks, type]
features: [photo.path.shapes, photo.type.point-text, photo.type.styles, photo.layer.mask-basics, photo.layer.manage, photo.select.make]
description: |
  A 1500 × 600 store banner. The wave pattern is one row of concentric circles in a single shape
  layer, duplicated and nudged six times so each lower row overlaps the one above; the `Waves` group
  fades in on the left through a feathered layer mask. The discount line is one type layer with two
  fonts: "Up to" in Inter and the figure in Bricolage Grotesque.
document: { name: summer-sale-wave-banner.psd, width: 1500, height: 600 }
fonts: [inter/Inter-Variable.ttf, bricolage-grotesque/BricolageGrotesque-Variable.ttf]
steps:
  - { command: layer.newFillLayer.solidColor, params: { color: "#f6f0e3" }, as: paper }
  - { command: layer.setProps, params: { layer: $paper.layer, name: Washi } }
  - { command: shape.create, params: { kind: ellipse, rect: [960, 70, 380, 380], fill: { gradient: { stops: [[0, "#ef5a3c"], [1, "#d23a2c"]], angle: -90 } }, name: Rising Sun }, as: sun }
  - { command: layer.new.group, params: { name: Waves }, as: waves }
  - { command: shape.create, params: { kind: ellipse, rect: [580, 395, 120, 120], fill: "#1d3769", stroke: { width: 3, color: "#f4efe3", align: inside }, name: Wave Row 1 }, as: row1 }
  - { command: shape.create, params: { kind: ellipse, rect: [596, 411, 88, 88], addTo: $row1.layer } }

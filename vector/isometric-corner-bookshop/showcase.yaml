format: 1
id: vector/isometric-corner-bookshop
title: Isometric Corner Bookshop
summary: A small isometric building whose facades are drawn flat and projected onto the 30° grid with affine transforms.
category: Illustration
tags: [illustration, isometric, transform, groups]
features: [vector.object.transform, vector.shape.primitives, vector.path.edit, vector.object.arrange, vector.text.edit]
description: |
  Each facade is drawn as a flat elevation in a box at the origin — shop windows, door, the
  BOOKS & COFFEE sign band and its type — grouped, and projected with one `object.transform`
  matrix: the shop front with [0.866, 0.5, 0, 1], the side wall with [0.866, −0.5, 0, 1] and the
  roof with the full isometric matrix [0.866, 0.5, −0.866, 0.5]. The lawn slab and rooftop unit are
  plain paths on the same grid; the trees are flat shapes in front.
document: { name: isometric-corner-bookshop.kvector, width: 1000, height: 760 }
steps:
  - { command: layer.setProps, params: { name: Ground } }
  - { command: shape.rectangle, params: { x: 0, y: 0, width: 1000, height: 760 } }
  - { command: paint.setStroke, params: { none: true } }
  - { command: paint.setFill, params: { color: "#fbf3e6" } }
  - { command: path.create, params: { d: "M151.2 440 L549.3 670 L549.3 692 L151.2 462 Z" } }
  - { command: paint.setFill, params: { color: "#6f9a5b" } }
  - { command: path.create, params: { d: "M549.3 670 L851 490 L851 512 L549.3 692 Z" } }
  - { command: paint.setFill, params: { color: "#557d46" } }
  - { command: path.create, params: { d: "M462.7 260 L851 490 L549.3 670 L151.2 440 Z" }, as: lawn }
  - { command: paint.setFill, params: { color: "#9cc581" } }
  - { command: path.create, params: { d: "M436.7 505 L471.4 525 L384.8 575 L350.1 555 Z" }, as: walk }
  - { command: paint.setFill, params: { color: "#efe2c8" } }
  - { command: text.create, params: { x: 60, y: 668, text: Corner Bookshop, size: 40, font: Source Serif 4, color: "#3d405b" } }
  - { command: text.create, params: { x: 60, y: 702, text: "Isometric study  ·  30° projection", size: 17, font: Inter, color: "#8c8577" } }

  - { command: layer.new, params: { name: Building }, as: building }
  - { command: select.none, params: {} }
  # Shop front (the face toward the lower left), drawn flat in a 300 × 220 box at the origin.
  - { command: shape.rectangle, params: { x: 0, y: 0, width: 300, height: 220 }, as: lf }
  - { command: paint.setFill, params: { color: "#e07a5f" } }
  - { command: shape.rectangle, params: { x: 20, y: 72, width: 260, height: 34 }, as: lf1 }
  - { command: paint.setFill, params: { color: "#3d405b" } }
  - { command: shape.rectangle, params: { x: 20, y: 124, width: 110, height: 78 }, as: lf2 }
  - { command: paint.setFill, params: { color: "#cfe8ef" } }
  - { command: shape.rectangle, params: { x: 210, y: 124, width: 70, height: 78 }, as: lf3 }
  - { command: shape.rectangle, params: { x: 150, y: 120, width: 42, height: 100 }, as: lf4 }
  - { command: paint.setFill, params: { color: "#3d405b" } }
  - { command: shape.rectangle, params: { x: 30, y: 18, width: 50, height: 38 }, as: lf5 }
  - { command: paint.setFill, params: { color: "#f2cc8f" } }
  - { command: shape.rectangle, params: { x: 125, y: 18, width: 50, height: 38 }, as: lf6 }
  - { command: shape.rectangle, params: { x: 220, y: 18, width: 50, height: 38 }, as: lf7 }
  - { command: text.create, params: { x: 150, y: 96, text: BOOKS & COFFEE, size: 19, font: Inter, style: SemiBold, color: "#fbf3e6" }, as: sign }
  - { command: text.setStyle, params: { id: $sign.id, justify: center, tracking: 160 } }
  - { command: select.set, params: { ids: [$lf.id, $lf1.id, $lf2.id, $lf3.id, $lf4.id, $lf5.id, $lf6.id, $lf7.id, $sign.id] } }
  - { command: object.group, params: {}, as: leftFace }
  - { command: object.transform, params: { matrix: [0.866, 0.5, 0, 1, 306.8, 210] } }
  # Side wall (toward the lower right), 200 × 220 from the front corner.
  - { command: select.none, params: {} }
  - { command: shape.rectangle, params: { x: 0, y: 0, width: 200, height: 220 }, as: rf }
  - { command: paint.setFill, params: { color: "#b85c47" } }
  - { command: shape.rectangle, params: { x: 30, y: 18, width: 50, height: 38 }, as: rf1 }
  - { command: paint.setFill, params: { color: "#d9a86c" } }
  - { command: shape.rectangle, params: { x: 120, y: 18, width: 50, height: 38 }, as: rf2 }
  - { command: shape.rectangle, params: { x: 40, y: 120, width: 120, height: 70 }, as: rf3 }
  - { command: paint.setFill, params: { color: "#93b7c0" } }
  - { command: select.set, params: { ids: [$rf.id, $rf1.id, $rf2.id, $rf3.id] } }
  - { command: object.group, params: {}, as: rightFace }
  - { command: object.transform, params: { matrix: [0.866, -0.5, 0, 1, 566.6, 360] } }
  # Roof, 300 × 200 with a parapet inset.
  - { command: select.none, params: {} }
  - { command: shape.rectangle, params: { x: 0, y: 0, width: 300, height: 200 }, as: tf }
  - { command: paint.setFill, params: { color: "#f2e2c4" } }
  - { command: shape.rectangle, params: { x: 12, y: 12, width: 276, height: 176 }, as: tf1 }
  - { command: paint.setFill, params: { color: "#e3cfa8" } }
  - { command: select.set, params: { ids: [$tf.id, $tf1.id] } }
  - { command: object.group, params: {}, as: roof }
  - { command: object.transform, params: { matrix: [0.866, 0.5, -0.866, 0.5, 480, 110] } }
  # A rooftop unit.
  - { command: select.none, params: {} }
  - { command: path.create, params: { d: "M566.6 220 L618.6 250 L618.6 290 L566.6 260 Z" } }
  - { command: paint.setFill, params: { color: "#9aa3b5" } }
  - { command: path.create, params: { d: "M618.6 250 L670.5 220 L670.5 260 L618.6 290 Z" } }
  - { command: paint.setFill, params: { color: "#737c8f" } }
  - { command: path.create, params: { d: "M618.6 190 L670.5 220 L618.6 250 L566.6 220 Z" } }
  - { command: paint.setFill, params: { color: "#c5ccd9" } }

  - { command: layer.new, params: { name: Trees }, as: trees }
  - { command: select.none, params: {} }
  - { command: shape.rectangle, params: { x: 768, y: 430, width: 12, height: 70, radius: 4 } }
  - { command: paint.setFill, params: { color: "#7a5136" } }
  - { command: shape.ellipse, params: { x: 734, y: 372, width: 80, height: 80 } }
  - { command: paint.setFill, params: { color: "#4f8a3f" } }
  - { command: shape.ellipse, params: { x: 722, y: 410, width: 56, height: 56 } }
  - { command: paint.setFill, params: { color: "#5f9e4c" } }
  - { command: shape.rectangle, params: { x: 214, y: 380, width: 12, height: 62, radius: 4 } }
  - { command: paint.setFill, params: { color: "#7a5136" } }
  - { command: shape.ellipse, params: { x: 184, y: 326, width: 72, height: 72 } }
  - { command: paint.setFill, params: { color: "#5f9e4c" } }
  - { command: select.none, params: {} }

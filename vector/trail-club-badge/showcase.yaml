format: 1
id: vector/trail-club-badge
title: Trail Club Badge
summary: A round patch emblem with type set on two circular paths, a dashed stitch line and a sunset mountain scene clipped to a circle.
category: Icons & Logos
tags: [badge, emblem, type-on-path, clipping-mask]
features: [vector.text.edit, vector.object.clipping-mask, vector.shape.primitives, vector.paint.stroke, vector.layer.panel]
description: |
  The club name runs clockwise over the top on one arc with `text.createInPath {mode: onPath}`; the
  motto runs the other way along a wider arc below so it reads upright. The stitching is a dashed
  round-capped stroke. The scene layer (gradient sky, sun, ridges, snowcaps and three pines) is
  selected with `layer.selectAll` and clipped by its topmost circle in one clip group.
document: { name: trail-club-badge.kvector, width: 800, height: 800 }
steps:
  - { command: layer.setProps, params: { name: Badge } }
  - { command: shape.rectangle, params: { x: 0, y: 0, width: 800, height: 800 } }
  - { command: paint.setStroke, params: { none: true } }
  - { command: paint.setFill, params: { color: "#efe6d2" } }
  - { command: shape.ellipse, params: { x: 100, y: 100, width: 600, height: 600 }, as: outer }
  - { command: paint.setFill, params: { color: "#1e3a34" } }

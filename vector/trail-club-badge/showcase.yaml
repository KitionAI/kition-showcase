  - { command: paint.setFill, params: { none: true } }
  - { command: paint.setStroke, params: { color: "#e9c46a" } }
  - { command: stroke.set, params: { weight: 3, dash: [10, 7], cap: round } }
  - { command: select.none, params: {} }
  - { command: shape.ellipse, params: { x: 195, y: 195, width: 410, height: 410 }, as: innerRing }

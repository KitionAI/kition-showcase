  - { command: shape.rectangle, params: { x: 790, y: 760, width: 14, height: 14, radius: 3 } }
  - { command: paint.setFill, params: { color: "#1f4d3a" } }
  - { command: shape.rectangle, params: { x: 960, y: 760, width: 14, height: 14, radius: 3 } }
  - { command: paint.setFill, params: { color: "#4f9a6b" } }
  - { command: shape.rectangle, params: { x: 790, y: 790, width: 14, height: 14, radius: 3 } }
  - { command: paint.setFill, params: { color: "#9fd0a8" } }
  - { command: shape.rectangle, params: { x: 960, y: 790, width: 14, height: 14, radius: 3 } }
  - { command: paint.setFill, params: { color: "#f2a33a" } }

  - { command: layer.new, params: { name: Text, top: true }, as: words }
  - { command: select.none, params: {} }
  - { command: text.create, params: { x: 60, y: 92, text: Riverside Community Solar, size: 48, font: Source Sans 3, style: Bold, color: "#ffffff" } }
  - { command: text.create, params: { x: 60, y: 132, text: "First-half report  ·  January – June 2026", size: 20, font: Inter, color: "#bfdccb" } }
  - { command: text.create, params: { x: 90, y: 272, text: 176 MWh, size: 50, font: Source Sans 3, style: Bold, color: "#e08a1e" } }
  - { command: text.create, params: { x: 90, y: 306, text: generated by 1 240 rooftop panels, size: 16, font: Inter, color: "#6b7d72" } }

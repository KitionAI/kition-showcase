format: 1
id: vector/community-solar-infographic
title: Community Solar Infographic
summary: A half-year report infographic with live column and pie graphs restyled in the brand palette, stat cards and a sun icon.
category: Infographics
tags: [infographic, charts, graphs, report]
features: [vector.graph.data, vector.paint.fill-stroke, vector.select.object, vector.shape.primitives, vector.text.edit, vector.object.transform]
featured: true
description: |
  Both charts are live graph objects (`graph.create`): a column graph of monthly output and a pie
  of where the power went. Their series groups are recoloured through `document.node`, the axis
  lines given a light grey and the axis labels set in Inter; the pie's legend is turned off and
  redrawn as chips with percentages. The header sun's rays are one line rotated with copies.
document: { name: community-solar-infographic.kvector, width: 1200, height: 900 }
steps:
  - { command: layer.setProps, params: { name: Charts } }
  - { command: graph.create, params: { type: column, x: 110, y: 450, width: 560, height: 320, series: [MWh], categories: [Jan, Feb, Mar, Apr, May, Jun], rows: [[12], [18], [26], [34], [41], [45]] }, as: columns }
  - { command: graph.setType, params: { id: $columns.id, legend: false, columnWidth: 58, tickLength: full, ticks: 5, axisMin: 0, axisMax: 50 } }
  - { command: document.node, params: { id: $columns.id, summary: true, depth: 1 }, as: columnParts }
  - { command: paint.setFill, params: { ids: [$columnParts.children.0.id], color: "#f2a33a" } }
  - { command: paint.setStroke, params: { ids: [$columnParts.children.1.id], color: "#dfe5df" } }
  - { command: graph.create, params: { type: pie, x: 790, y: 455, width: 300, height: 300, series: [Homes, School, Library, Grid export], categories: [""], rows: [[48, 22, 10, 20]] }, as: pie }
  - { command: graph.setType, params: { id: $pie.id, legend: false } }
  - { command: document.node, params: { id: $pie.id, summary: true, depth: 1 }, as: pieParts }
  - { command: select.object.textObjects, params: {} }
  - { command: text.setStyle, params: { font: Inter, size: 15, fill: "#6b7d72" } }
  - { command: paint.setStroke, params: { none: true } }
  - { command: select.none, params: {} }
  - { command: paint.setFill, params: { ids: [$pieParts.children.3.id], color: "#1f4d3a" } }
  - { command: paint.setFill, params: { ids: [$pieParts.children.2.id], color: "#4f9a6b" } }
  - { command: paint.setFill, params: { ids: [$pieParts.children.1.id], color: "#9fd0a8" } }
  - { command: paint.setFill, params: { ids: [$pieParts.children.0.id], color: "#f2a33a" } }
  - { command: paint.setStroke, params: { ids: [$pie.id], color: "#ffffff" } }
  - { command: stroke.set, params: { ids: [$pie.id], weight: 3 } }

  - { command: layer.new, params: { name: Layout }, as: layout }
  - { command: layer.move, params: { ids: [$layout.id], target: 1, place: below } }
  - { command: layer.setCurrent, params: { id: $layout.id } }
  - { command: select.none, params: {} }
  - { command: shape.rectangle, params: { x: 0, y: 0, width: 1200, height: 900 } }
  - { command: paint.setStroke, params: { none: true } }
  - { command: paint.setFill, params: { color: "#f3f1ea" } }
  - { command: shape.rectangle, params: { x: 0, y: 0, width: 1200, height: 170 } }
  - { command: paint.setFill, params: { color: "#1f4d3a" } }
  - { command: shape.rectangle, params: { x: 60, y: 200, width: 330, height: 130, radius: 16 } }
  - { command: paint.setFill, params: { color: "#ffffff" } }
  - { command: shape.rectangle, params: { x: 435, y: 200, width: 330, height: 130, radius: 16 } }
  - { command: shape.rectangle, params: { x: 810, y: 200, width: 330, height: 130, radius: 16 } }
  - { command: shape.rectangle, params: { x: 60, y: 360, width: 660, height: 470, radius: 16 } }
  - { command: shape.rectangle, params: { x: 750, y: 360, width: 390, height: 470, radius: 16 } }
  - { command: shape.ellipse, params: { x: 1060, y: 50, width: 70, height: 70 }, as: sun }
  - { command: paint.setFill, params: { color: "#f2c14e" } }
  - { command: shape.line, params: { x1: 1095, y1: 38, x2: 1095, y2: 22 }, as: ray }
  - { command: paint.setStroke, params: { color: "#f2c14e" } }
  - { command: stroke.set, params: { weight: 6, cap: round } }
  - { command: object.rotate, params: { angle: 30, origin: [1095, 85], copy: true } }
  - { command: object.transformAgain, params: {} }
  - { command: object.transformAgain, params: {} }
  - { command: object.transformAgain, params: {} }
  - { command: object.transformAgain, params: {} }

  - { command: text.create, params: { x: 840, y: 272, text: 94 tonnes, size: 50, font: Source Sans 3, style: Bold, color: "#4f9a6b" } }
  - { command: text.create, params: { x: 840, y: 306, text: of CO₂ emissions avoided, size: 16, font: Inter, color: "#6b7d72" } }
  - { command: text.create, params: { x: 90, y: 408, text: Monthly generation, size: 22, font: Source Sans 3, style: Semibold, color: "#1f2f27" } }

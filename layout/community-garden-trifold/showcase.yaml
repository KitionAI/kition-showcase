format: 1
id: layout/community-garden-trifold
title: Community Garden Tri-Fold
summary: A letter-size tri-fold brochure, outside and inside, laid out on a three-panel column grid with tabbed price lists and dot leaders.
category: Brochures & Flyers
tags: [brochure, tri-fold, columns, tabs, paragraph-styles]
features: [layout.layout.pages-guides, layout.type.styles, layout.type.format, layout.object.fill-stroke, layout.color.swatches, layout.text.frames]
featured: true
description: |
  Two landscape Letter pages with three columns and a 54 pt gutter, so each column is one folded
  panel. The outside carries the inside flap, the back panel with opening hours and a little map,
  and the front cover; the inside, the story, membership prices and the season calendar. Hours and
  prices are tab-separated paragraphs in a "Leader Row" style with a right tab and dot leader;
  labels and quotes are styled by finding their paragraphs with GREP (`find.find {grep: true}`).
  The flowers are an ellipse, an eight-point star polygon and a centre, grouped and repeated with
  `edit.stepAndRepeat`.
document: { name: community-garden-trifold.klayout, width: 792, height: 612 }
fonts: [lora/Lora-Variable.ttf]
steps:
  - { command: layout.documentSetup, params: { pages: 2, bleed: 9 } }
  - { command: layout.marginsAndColumns, params: { margins: 27, columns: 3, gutter: 54 } }
  - { command: swatch.create, params: { name: Meadow, color: { c: 72, m: 22, y: 85, k: 22 } } }
  - { command: swatch.create, params: { name: Poppy, color: { c: 0, m: 72, y: 78, k: 0 } } }
  - { command: swatch.create, params: { name: Butter, color: { c: 0, m: 12, y: 62, k: 0 } } }
  - { command: swatch.create, params: { name: Cream, color: { c: 2, m: 4, y: 12, k: 0 } } }
  - { command: swatch.create, params: { name: Soil, color: { c: 45, m: 62, y: 72, k: 52 } } }
  - { command: style.paragraph.create, params: { name: Panel Head, para: { spaceAfter: 8, hyphenate: false }, chars: { fontFamily: Lora, fontStyle: Bold, size: 22, leading: { kind: points, value: 25 }, fill: Meadow } } }
  - { command: style.paragraph.create, params: { name: Label, para: { spaceBefore: 10, spaceAfter: 3 }, chars: { fontFamily: Inter, fontStyle: SemiBold, size: 8, tracking: 160, fill: Poppy, capitalization: allCaps } } }
  - { command: style.paragraph.create, params: { name: Copy, para: { spaceAfter: 6, hyphenate: true }, chars: { fontFamily: Inter, fontStyle: Regular, size: 10, leading: { kind: points, value: 15 }, fill: Soil } } }
  - { command: style.paragraph.create, params: { name: Leader Row, para: { spaceAfter: 3, spaceBefore: 0, tabs: [{ position: 210, align: right, leader: "." }] }, chars: { fontFamily: Inter, fontStyle: Regular, size: 9.5, leading: { kind: points, value: 15 }, fill: Soil } } }
  - { command: style.paragraph.create, params: { name: Cover Title, para: { spaceAfter: 12, hyphenate: false }, chars: { fontFamily: Lora, fontStyle: Bold, size: 36, leading: { kind: points, value: 38 }, fill: "[Paper]" } } }
  - { command: style.paragraph.create, params: { name: Cover Copy, chars: { fontFamily: Inter, fontStyle: Regular, size: 11, leading: { kind: points, value: 16 }, fill: Cream } } }
  - { command: style.paragraph.create, params: { name: Cover Tag, para: { spaceBefore: 24 }, chars: { fontFamily: Inter, fontStyle: SemiBold, size: 9, tracking: 160, fill: Butter, capitalization: allCaps } } }
  - { command: style.paragraph.create, params: { name: Quote, para: { spaceBefore: 12, hyphenate: false }, chars: { fontFamily: Lora, fontStyle: Regular, size: 15, leading: { kind: points, value: 20 }, fill: Meadow } } }


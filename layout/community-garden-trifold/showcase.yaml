  - { command: object.fill, params: { ids: [$band.id], swatch: Cream } }
  - { command: frame.create, params: { spread: 1, rect: [-9, 520, 801, 621], content: graphic }, as: meadow }
  - { command: object.fill, params: { ids: [$meadow.id], swatch: Meadow } }
  - { command: frame.create, params: { spread: 1, rect: [27, 54, 237, 500], text: "Our story\nIn 2019 the lot behind the tram depot was gravel, nettles and one shopping trolley. A dozen neighbours asked the council for a five-year lease, borrowed a skip and started digging.\nToday Wildflower Commons is run by its members: about ninety households, a primary school class and a Thursday group from the care home on Quarry Lane. Beds are shared, tools are shared, and so — mostly — is the harvest.\nWe compost everything, collect rain from the depot roof and keep a seed library in the old ticket office. Anyone can borrow seeds; we only ask that you bring some back in autumn." }, as: story }
  - { command: story.get, params: { frame: $story.id }, as: storyText }
  - { command: text.select, params: { story: $story.story, anchor: 0, focus: $storyText.length } }
  - { command: style.paragraph.apply, params: { name: Copy } }

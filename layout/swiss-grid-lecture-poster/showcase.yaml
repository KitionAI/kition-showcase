format: 1
id: layout/swiss-grid-lecture-poster
title: Swiss Grid Lecture Poster
summary: An A3 typographic poster built on a six-column, eight-row guide grid — a cropped red disc, a rotated side bar and a two-column lecture list.
category: Posters
tags: [poster, grid, guides, typography, rotation]
features: [layout.layout.pages-guides, layout.transform.objects, layout.text.frames, layout.type.format, layout.object.fill-stroke, layout.color.swatches]
description: |
  An A3 page with 36 pt margins, six columns and an eight-row guide grid from
  `layout.createGuides`; every element snaps to it. The page background is a CMYK stock swatch, the
  red disc is cropped by the trim, and the side label is a text frame rotated 90° and placed with
  `transform.set`. The lecture list is one two-column frame in "Lecture" and "Date" paragraph
  styles (dates found by GREP), split three and three with a column-break character, because
  Balance Columns is stored but not yet composed.
document: { name: swiss-grid-lecture-poster.klayout, width: 842, height: 1191 }
steps:
  - { command: layout.documentSetup, params: { bleed: 9 } }
  - { command: layout.marginsAndColumns, params: { margins: 36, columns: 6, gutter: 12 } }
  - { command: layout.createGuides, params: { rows: 8, columns: 6, rowGutter: 12, columnGutter: 12, fitTo: margins } }
  - { command: guide.list, params: {}, as: guides }
  - { command: swatch.create, params: { name: Signal Red, color: { c: 0, m: 90, y: 85, k: 0 } } }
  - { command: swatch.create, params: { name: Stock, color: { c: 2, m: 3, y: 7, k: 0 } } }
  - { command: swatch.create, params: { name: Ink, color: { c: 60, m: 50, y: 50, k: 95 } } }
  - { command: page.background, params: { color: Stock } }
  - { command: frame.create, params: { shape: ellipse, rect: [330, 168, 905, 743], content: graphic }, as: disc }
  - { command: object.fill, params: { ids: [$disc.id], swatch: Signal Red } }
  - { command: frame.create, params: { rect: [-9, 460.125, 154.33, 1200], content: graphic }, as: bar }
  - { command: object.fill, params: { ids: [$bar.id], swatch: Ink } }
  - { command: frame.create, params: { rect: [36, 96, 830, 470], text: "Modular\nWeek" }, as: title }
  - { command: text.select, params: { story: $title.story, anchor: 0, focus: 12 } }
  - { command: type.char, params: { attrs: { fontFamily: Inter, fontStyle: Bold, size: 168, leading: { kind: points, value: 148 }, tracking: -40, fill: Ink } } }
  - { command: text.exitToFrame, params: {} }
  - { command: frame.create, params: { rect: [480, 36, 806, 120], text: "Six evening lectures on grids, systems and the space between letters\nHall 4, Ostbahn Campus · Tuesdays 18:30 · Free entry" }, as: info }
  - { command: text.select, params: { story: $info.story, anchor: 0, focus: 130 } }
  - { command: type.char, params: { attrs: { fontFamily: Inter, fontStyle: Medium, size: 10, leading: { kind: points, value: 13 }, fill: Ink } } }
  - { command: type.align, params: { align: right } }
  - { command: text.exitToFrame, params: {} }
  - { command: frame.create, params: { rect: [40, 1000, 700, 1028], text: "TYPOGRAPHY LECTURES  ·  SPRING 2026" }, as: side }
  - { command: text.select, params: { story: $side.story, anchor: 0, focus: 40 } }
  - { command: type.char, params: { attrs: { fontFamily: Inter, fontStyle: SemiBold, size: 20, tracking: 220, fill: "[Paper]" } } }
  - { command: text.exitToFrame, params: {} }
  - { command: transform.rotate, params: { ids: [$side.id], angle: 90 } }
  - { command: transform.set, params: { ids: [$side.id], x: 80, y: 520 } }
  - { command: transform.info, params: { ids: [$side.id] }, as: sideInfo }
  - { command: frame.create, params: { rect: [296.67, 790, 806, 1155], text: "03 March\nThe Invisible Grid\nIlse Marten\n10 March\nCounting in Picas\nTomas Reiter\n17 March\nWhite Space as Material\nNoor Haddad\uE002\n24 March\nOne Typeface, Forty Weights\nJakob Lind\n31 March\nTables That Read\nAnnika Sauer\n07 April\nAfter the Grid\nPaul Verhoef" }, as: lectures }
  - { command: object.textFrameOptions, params: { ids: [$lectures.id], columns: 2, gutter: 12 } }
  - { command: style.paragraph.create, params: { name: Lecture, chars: { fontFamily: Inter, fontStyle: Regular, size: 13, leading: { kind: points, value: 17 }, fill: Ink } } }
  - { command: style.paragraph.create, params: { name: Date, basedOn: Lecture, para: { spaceBefore: 14 }, chars: { fontStyle: Bold, fill: Signal Red } } }
  - { command: story.get, params: { frame: $lectures.id }, as: lectureText }
  - { command: text.select, params: { story: $lectures.story, anchor: 0, focus: $lectureText.length } }
  - { command: style.paragraph.apply, params: { name: Lecture } }
  - { command: find.find, params: { find: "^[0-9]{2} [A-Za-z]+$", grep: true, story: $lectures.story, scope: story }, as: dates }
  - { command: text.select, params: { story: $lectures.story, anchor: $dates.0.start, focus: $dates.0.end } }
  - { command: style.paragraph.apply, params: { name: Date } }
  - { command: text.select, params: { story: $lectures.story, anchor: $dates.1.start, focus: $dates.1.end } }
  - { command: style.paragraph.apply, params: { name: Date } }
  - { command: text.select, params: { story: $lectures.story, anchor: $dates.2.start, focus: $dates.2.end } }
  - { command: style.paragraph.apply, params: { name: Date } }
  - { command: text.select, params: { story: $lectures.story, anchor: $dates.3.start, focus: $dates.3.end } }
  - { command: style.paragraph.apply, params: { name: Date } }
  - { command: text.select, params: { story: $lectures.story, anchor: $dates.4.start, focus: $dates.4.end } }
  - { command: style.paragraph.apply, params: { name: Date } }
  - { command: text.select, params: { story: $lectures.story, anchor: $dates.5.start, focus: $dates.5.end } }
  - { command: style.paragraph.apply, params: { name: Date } }
  - { command: text.exitToFrame, params: {} }
  - { command: path.create, params: { anchors: [{ p: [296.67, 772] }, { p: [806, 772] }] }, as: rule }
  - { command: object.stroke, params: { ids: [$rule.id], swatch: Ink, weight: 3 } }
thumbnail: { area: $inspect.canvas.spreads.0 }
expected:
  - actual: inspect
    values:
      pageCount: 1
      spreads.0.pages.0: { columns: 6, background: Stock }
      spreads.0.items: { any: { kind: <text frame>, columns: 2 } }
      paragraphStyles: { contains: Date }
      stories: { count: 4, all: { overset: false } }
  - actual: results
    values:
      guides: { count: 24 }
      sideInfo: { rotation: 90, x: 80, y: 520 }
      dates: { count: 6 }
diagnostics: []
since: "2026-11-09"

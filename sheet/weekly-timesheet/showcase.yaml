format: 1
id: sheet/weekly-timesheet
title: Weekly Timesheet
summary: Clock-in and clock-out times turned into daily hours, daily overtime past eight hours and the week's pay, with time arithmetic.
category: Business Templates
tags: [timesheet, template, date-functions, formulas, conditional-formatting]
features: [sheet.formulas.functions, sheet.edit.fill-clear, sheet.format.number, sheet.format.conditional]
description: |
  Times are typed as clock times and stored as fractions of a day, so a shift is end minus start,
  less the lunch break, times 24; MOD keeps a shift that crosses midnight positive and ROUND keeps
  quarter hours exact. Anything over eight hours in a day is overtime at time and a half. The dates
  follow from the week-start cell, TEXT names each day, the weekend rows are shaded, and the
  signature block is ready for printing.
document: { name: weekly-timesheet.xlsx, width: 1280, height: 800 }
fonts: [carlito/Carlito-Regular.ttf, carlito/Carlito-Bold.ttf, carlito/Carlito-Italic.ttf]
steps:
  - command: range.setValues
    params:
      range: A1
      values:
        - [Weekly Timesheet]
        - [Employee, Jordan Ellis, null, Week starting, "2027-06-14"]
        - [Role, Warehouse lead, null, Hourly rate, 24]
  - command: range.setValues
    params:
      range: A5
      values:
        - [Day, Date, Start, Lunch out, Lunch in, Finish, Hours, Regular, Overtime]
        - ["=TEXT(B6,\"dddd\")", "=$E$2", "08:00", "12:00", "12:30", "16:45", "=IF(C6=\"\",0,ROUND(MOD(F6-C6,1)*24-(E6-D6)*24,2))", "=MIN(G6,8)", "=G6-H6"]
        - ["=TEXT(B7,\"dddd\")", "=B6+1", "07:45", "12:00", "12:45", "17:15"]
        - [null, null, "08:00", "12:15", "12:45", "16:30"]
        - [null, null, "08:30", "12:30", "13:00", "18:00"]
        - [null, null, "08:00", "12:00", "12:30", "15:30"]
        - [null, null, "09:00", null, null, "13:00"]
        - [null, null, null, null, null, null]
        - [Total, null, null, null, null, null, "=SUM(G6:G12)", "=SUM(H6:H12)", "=SUM(I6:I12)"]
  - { command: edit.fillDown, params: { range: "A7:B12" } }
  - { command: edit.fillDown, params: { range: "G6:I12" } }
  - command: range.setValues
    params:
      range: F15
      values:
        - [Regular pay, null, "=H13", "=H15*$E$3"]
        - [Overtime pay (1.5×), null, "=I13", "=H16*$E$3*1.5"]
        - [Total pay, null, null, "=I15+I16"]
  - command: range.setValues
    params:
      range: A15
      values:
        - [Employee signature]
        - [null]
        - [Supervisor approval]
  - { command: home.fontSize, params: { range: A1, size: 20 } }
  - { command: home.bold, params: { range: A1 } }
  - { command: home.fontColor, params: { range: A1, color: "#155e75" } }
  - { command: home.fontColor, params: { range: "A2:A3", color: "#6b7280" } }
  - { command: home.fontColor, params: { range: "D2:D3", color: "#6b7280" } }
  - { command: home.bold, params: { range: "B2:B3" } }
  - { command: home.bold, params: { range: "E2:E3" } }
  - { command: home.fontColor, params: { range: "E2:E3", color: "#1d4ed8" } }
  - { command: home.numberFormat, params: { range: "E2", format: "d mmm yyyy" } }
  - { command: home.numberFormat, params: { range: "E3", format: "$$0.00" } }
  - { command: home.alignLeft, params: { range: "E2:E3" } }
  - { command: home.fillColor, params: { range: "A5:I5", color: "#155e75" } }
  - { command: home.fontColor, params: { range: "A5:I5", color: "#ffffff" } }
  - { command: home.bold, params: { range: "A5:I5" } }
  - { command: home.alignCenter, params: { range: "B5:I5" } }
  - { command: home.numberFormat, params: { range: "B6:B12", format: "d mmm" } }
  - { command: home.numberFormat, params: { range: "C6:F12", format: "h:mm AM/PM" } }
  - { command: home.alignCenter, params: { range: "B6:F12" } }
  - { command: home.fontColor, params: { range: "C6:F12", color: "#1d4ed8" } }
  - { command: home.numberFormat, params: { range: "G6:I13", format: "0.00;;\"\"" } }

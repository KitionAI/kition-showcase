format: 1
id: sheet/swim-club-attendance
title: Swim Club Attendance
summary: Twelve training sessions for 24 swimmers, with frozen names and dates, letter codes from a dropdown and colour-coded attendance rates.
category: Planners & Trackers
tags: [attendance, tracker, freeze-panes, data-validation, conditional-formatting]
features: [sheet.view.window, sheet.data.tools, sheet.format.conditional, sheet.formulas.functions]
description: |
  Each session takes one letter from a dropdown: P present, L late, A absent, E excused. The
  names and the two header rows are frozen, so the list scrolls under them. Text rules colour
  the letters, COUNTIF tallies each swimmer and each session, and the rate leaves excused
  sessions out of the count. Rates under 75% turn red; the bottom row shows turnout per
  session under a colour scale.
document: { name: swim-club-attendance.xlsx, width: 1280, height: 800 }
fonts: [carlito/Carlito-Regular.ttf, carlito/Carlito-Bold.ttf, carlito/Carlito-Italic.ttf]
steps:
  - { command: range.setValues, params: { range: A1, values: [["Swim Club Attendance"], ["Autumn block · Tuesday and Thursday evening training"], ["Key: P present · L late · A absent · E excused"]] } }
  - { command: range.setValues, params: { range: A4, values: [["Member", "Group", 46301, 46303, 46308, 46310, 46315, 46317, 46322, 46324, 46329, 46331, 46336, 46338, "Attended", "Absent", "Rate"], [null, null, "=C4", "=D4", "=E4", "=F4", "=G4", "=H4", "=I4", "=J4", "=K4", "=L4", "=M4", "=N4", null, null, null], ["Abbott, Lily", "Juniors", "P", "A", "A", "E", "P", "A", "L", "P", "A", "L", "P", "P", "=COUNTIF(C6:N6,\"P\")+COUNTIF(C6:N6,\"L\")", "=COUNTIF(C6:N6,\"A\")", "=O6/(COUNTA(C6:N6)-COUNTIF(C6:N6,\"E\"))"], ["Baptiste, Noah", "Juniors", "P", "P", "L", "A", "P", "A", "A", "P", "P", "P", "P", "A", "=COUNTIF(C7:N7,\"P\")+COUNTIF(C7:N7,\"L\")", "=COUNTIF(C7:N7,\"A\")", "=O7/(COUNTA(C7:N7)-COUNTIF(C7:N7,\"E\"))"], ["Chen, Ava", "Juniors", "P", "A", "P", "P", "P", "P", "P", "P", "P", "A", "A", "P", "=COUNTIF(C8:N8,\"P\")+COUNTIF(C8:N8,\"L\")", "=COUNTIF(C8:N8,\"A\")", "=O8/(COUNTA(C8:N8)-COUNTIF(C8:N8,\"E\"))"], ["Dimitrov, Leo", "Juniors", "A", "P", "L", "P", "P", "A", "A", "P", "P", "P", "A", "A", "=COUNTIF(C9:N9,\"P\")+COUNTIF(C9:N9,\"L\")", "=COUNTIF(C9:N9,\"A\")", "=O9/(COUNTA(C9:N9)-COUNTIF(C9:N9,\"E\"))"], ["Eze, Grace", "Juniors", "P", "P", "P", "P", "P", "P", "P", "P", "L", "P", "P", "P", "=COUNTIF(C10:N10,\"P\")+COUNTIF(C10:N10,\"L\")", "=COUNTIF(C10:N10,\"A\")", "=O10/(COUNTA(C10:N10)-COUNTIF(C10:N10,\"E\"))"], ["Fontaine, Hugo", "Juniors", "L", "L", "P", "P", "P", "L", "P", "P", "P", "P", "P", "P", "=COUNTIF(C11:N11,\"P\")+COUNTIF(C11:N11,\"L\")", "=COUNTIF(C11:N11,\"A\")", "=O11/(COUNTA(C11:N11)-COUNTIF(C11:N11,\"E\"))"], ["Garcia, Mia", "Juniors", "P", "P", "P", "A", "E", "P", "P", "L", "P", "L", "P", "P", "=COUNTIF(C12:N12,\"P\")+COUNTIF(C12:N12,\"L\")", "=COUNTIF(C12:N12,\"A\")", "=O12/(COUNTA(C12:N12)-COUNTIF(C12:N12,\"E\"))"], ["Holm, Oscar", "Juniors", "P", "P", "P", "P", "P", "P", "P", "P", "P", "P", "E", "P", "=COUNTIF(C13:N13,\"P\")+COUNTIF(C13:N13,\"L\")", "=COUNTIF(C13:N13,\"A\")", "=O13/(COUNTA(C13:N13)-COUNTIF(C13:N13,\"E\"))"], ["Iqbal, Zara
format: 1
id: sheet/team-skills-matrix
title: Team Skills Matrix
summary: An engineering team's skills grid with angled column headers, dot ratings from a number format and named cell styles.
category: Formatting & Styles
tags: [rotated-text, custom-formats, cell-styles, conditional-formatting, team]
features: [sheet.format.alignment, sheet.format.number, sheet.format.conditional, sheet.format.font]
description: |
  Ten skill names stand at 60 degrees so ten narrow columns fit beside the names. Every rating is
  a plain number from 1 to 3; the custom format `[=3]"●●●";[=2]"●●○";"●○○"` draws it as dots and
  two formula rules shade experts and grey out beginners. COUNTIF formulas count the experts per
  person and per skill, and a rule marks any skill with fewer than two experts in the Bad style.
document: { name: team-skills-matrix.xlsx, width: 1280, height: 800 }
fonts: [carlito/Carlito-Regular.ttf, carlito/Carlito-Bold.ttf, carlito/Carlito-Italic.ttf, jetbrains-mono/JetBrainsMono-Variable.ttf]
steps:
  - { command: range.setValues, params: { range: A1, values: [["Team Skills Matrix"], ["Platform engineering · self-assessed and reviewed with leads, Q4"]] } }
  - command: range.setValues
    params:
      range: A4
      values:
        - ["Team member", "Python", "SQL", "Cloud infra", "Kubernetes", "Data modeling", "Front-end", "Security", "Testing", "Code review", "Mentoring", "Expert in"]
        - ["Avery Lin", 3, 3, 2, 1, 3, 1, 2, 2, 3, 2, "=COUNTIF(B5:K5,3)"]
        - ["Bruno Okafor", 2, 3, 1, 1, 3, 1, 1, 2, 2, 1, "=COUNTIF(B6:K6,3)"]
        - ["Chiara Rossi", 1, 1, 1, 1, 1, 3, 1, 3, 2, 2, "=COUNTIF(B7:K7,3)"]
        - ["Dev Malhotra", 3, 2, 3, 2, 2, 1, 3, 2, 3, 3, "=COUNTIF(B8:K8,3)"]
        - ["Elena Varga", 2, 2, 1, 1, 2, 3, 1, 2, 1, 1, "=COUNTIF(B9:K9,3)"]
        - ["Farid Haddad", 1, 1, 3, 3, 1, 1, 3, 1, 2, 1, "=COUNTIF(B10:K10,3)"]
        - ["Grace Whitfield", 2, 3, 1, 1, 3, 2, 1, 3, 3, 3, "=COUNTIF(B11:K11,3)"]
        - ["Hiro Tanaka", 3, 2, 2, 2, 1, 1, 2, 3, 2, 1, "=COUNTIF(B12:K12,3)"]
        - ["Ines Duarte", 1, 2, 1, 1, 2, 3, 1, 2, 1, 2, "=COUNTIF(B13:K13,3)"]
        - ["Jonah Brooks", 2, 1, 2, 2, 1, 1, 2, 1, 2, 1, "=COUNTIF(B14:K14,3)"]
        - ["Experts per skill", "=COUNTIF(B5:B14,3)", "=COUNTIF(C5:C14,3)", "=COUNTIF(D5:D14,3)", "=COUNTIF(E5:E14,3)", "=COUNTIF(F5:F14,3)", "=COUNTIF(G5:G14,3)", "=COUNTIF(H5:H14,3)", "=COUNTIF(I5:I14,3)", "=COUNTIF(J5:J14,3)", "=COUNTIF(K5:K14,3)", "=SUM(L5:L14)"]
  - { command: range.setValues, params: { range: A17, values: [["Key", 3, "Expert", null, 2, "Practitioner", null, 1, "Learning"]] } }
  - { command: home.cellStyle, params: { range: A1, name: Title } }
  - { command: home.fontColor, params: { range: A1, color: "#0f4f4a" } }
  - { command: home.fontColor, params: { range: A2, color: "#6b7280" } }
  - { command: home.italic, params: { range: A2 } }
  - { command: home.cellStyle, params: { range: "A4:L4", name: Heading 4 } }
  - { command: home.bold, params: { range: "B4:L4" } }
  - { command: home.orientation, params: { range: "B4:L4", angle: 60 } }
  - { command: home.wrapText, params: { range: "B4:L4" } }
  - { command: home.fontSize, params: { range: "B4:L4", size: 10 } }
  - { command: home.alignBottom, params: { range: "A4:L4" } }
  - { command: home.numberFormat, params: { range: "B5:K14", format: "[=3]\"●●●\";[=2]\"●●○\";\"●○○\"" } }
  - { command: home.numberFormat, params: { range: "B17", format: "[=3]\"●●●\";[=2]\"●●○\";\"●○○\"" } }
  - { command: home.numberFormat, params: { range: "E17", format: "[=3]\"●●●\";[=2]\"●●○\";\"●○○\"" } }
  - { command: home.numberFormat, params: { range: "H17", format: "[=3]\"●●●\";[=2]\"●●○\";\"●○○\"" } }
  - { command: home.alignCenter, params: { range: "B5:L15" } }
  - { command: home.fontColor, params: { range: "B5:K14", color: "#0f766e" } }
  - { command: home.fontColor, params: { range: "B17:H17", color: "#0f766e" } }
  - { command: home.conditionalFormat, params: { range: "B5:K14", rule: { type: expression, formula: "=B5=3", style: { fill: { fg: { Rgb: 13431277 }, pattern: Solid } } } } }
  - { command: home.conditionalFormat, params: { range: "B5:K14", rule: { type: expression, formula: "=B5=1", style: { font: { color: { Rgb: 10066329 } } } } } }
  - { command: home.fillColor, params: { range: "B17", color: "#ccf0ed" } }
  - { command: home.fontColor, params: { range: "H17", color: "#999999" } }
  - { command: home.cellStyle, params: { range: "A15:L15", name: Total } }
  - { command: home.alignCenter, params: { range: "B15:L15" } }
  - { command: home.conditionalFormat, params: { range: "B15:K15", rule: { type: expression, formula: "=B15<2", preset: lightRedFillDarkRedText } } }
  - { command: home.bold, params: { range: "L5:L14" } }
  - { command: home.fillColor, params: { range: "L4:L15", color: "#f3f4f6" } }
  - { command: home.borders, params: { range: "A5:L14", preset: insideHorizontal, color: "#e5e7eb" } }
  - { command: home.bold, params: { range: A17 } }
  - { command: home.alignCenter, params: { range: "B17:H17" } }
  - { command: home.fontColor, params: { range: "C17:I17", color: "#4b5563" } }
  - { command: home.columnWidth, params: { cols: "A:A", width: 118 } }
  - { command: home.columnWidth, params: { cols: "B:L", width: 58 } }
  - { command: home.rowHeight, params: { rows: "4:4", height: 66 } }
  - { command: home.rowHeight, params: { rows: "5:15", height: 21 } }
  - { command: home.alignMiddle, params: { range: "A5:L17" } }
  - { command: cell.get, params: { cell: C4 }, as: header }
  - { command: sheet.read, params: { range: "B15:L15" }, as: experts }
  - { command: sheet.read, params: { range: "B8:F8", formatted: true }, as: dev }
  - { command: sheet.read, params: { range: "L5:L14" }, as: perPerson }
expected:
  - actual: results
    values:
      header.style.align.rotation: 60
      header.style.align.wrap: true
      experts.values.0: [3, 3, 2, 1, 3, 3, 2, 3, 3, 2, 25]
      dev.values.0: ["●●●", "●●○", "●●●", "●●○", "●●○"]
      perPerson.values: [[4], [2], [2], [5], [1], [3], [5], [2], [1], [0]]
diagnostics: []
thumbnail: { area: [0, 0, 850, 450] }
since: "2026-11-09"

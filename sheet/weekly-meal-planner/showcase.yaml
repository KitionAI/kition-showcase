format: 1
id: sheet/weekly-meal-planner
title: Weekly Meal Planner
summary: A seven-day meal grid with wrapped text, merged cells for batch-cooked meals and a costed shopping list.
category: Planners & Trackers
tags: [planner, merged-cells, wrap-text, home, shopping-list]
features: [sheet.format.alignment, sheet.format.font, sheet.formulas.functions, sheet.format.number]
description: |
  Breakfast, lunch and dinner run down the side and the days across. Longer dishes wrap inside
  taller rows, and a dinner cooked once for two nights is a single cell merged across both days,
  as are the leftovers lunches. Each meal row has its own soft colour. Below, the shopping list
  totals its estimated cost and counts what is already in the pantry.
document: { name: weekly-meal-planner.xlsx, width: 1280, height: 800 }
fonts: [carlito/Carlito-Regular.ttf, carlito/Carlito-Bold.ttf, carlito/Carlito-Italic.ttf]
steps:
  - { command: range.setValues, params: { range: A1, values: [["Weekly Meal Planner"], ["Week of 9 November · two adults, one child; batch-cook on Sunday"]] } }
  - command: range.setValues
    params:
      range: A4
      values:
        - [null, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday]
        - [Breakfast, Overnight oats with berries, Scrambled eggs on toast, Overnight oats with berries, Yogurt and granola, Banana pancakes, Shakshuka with crusty bread, Waffles and fruit]
        - [Lunch, Leftover lentil chili in wraps, null, Tomato soup and cheese toasties, Chickpea salad bowls, Pasta salad, Picnic in the park, Roast vegetable couscous]
        - [Dinner, Lentil chili with rice (cook once for two nights), null, Salmon traybake with greens, Chicken stir-fry and noodles, Homemade pizza night, Mushroom risotto, Sunday roast chicken]
        - [Snack, Apple slices and peanut butter, Hummus and carrots, Popcorn, Cheese and crackers, Fruit salad, Banana bread, Oat cookies]
  - command: range.setValues
    params:
      range: A10
      values:
        - [Shopping list, null, Aisle, Qty, Est. cost, In pantry]
        - [Red lentils, null, Dry goods, 1, 2.4, "No"]
        - [Salmon fillets, null, Fish, 4, 14.8, "No"]
        - [Chicken thighs, null, Meat, 1, 8.5, "No"]
        - [Arborio rice, null, Dry goods, 1, 2.9, "Yes"]
        - [Mixed berries, null, Frozen, 2, 6.0, "No"]
        - [Free-range eggs, null, Dairy, 12, 3.6, "Yes"]
        - [Greek yogurt, null, Dairy, 2, 4.2, "No"]
        - [Total, null, null, null, "=SUMIF(F11:F17,\"No\",E11:E17)", "=COUNTIF(F11:F17,\"Yes\")&\" in pantry\""]

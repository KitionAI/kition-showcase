  - { command: home.alignRight, params: { range: "A11:F11" } }
  - { command: home.alignRight, params: { range: "A12:A20" } }
  - { command: home.numberFormat, params: { range: "B12:F20", format: "#,##0;[Red](#,##0)" } }
  - { command: home.borders, params: { range: "A12:F20", preset: insideHorizontal, color: "#e5e7eb" } }
  - { command: home.conditionalFormat, params: { range: "A12:F20", rule: { type: expression, formula: "=AND($F12>=0,$F11<0)", style: { font: { bold: true }, fill: { fg: { Rgb: 16707722 }, pattern: Solid } } } } }
  - { command: home.columnWidth, params: { cols: "A:A", width: 130 } }

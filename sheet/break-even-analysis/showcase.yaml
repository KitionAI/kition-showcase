  - { command: chart.set, params: { title: Revenue meets cost, legend: bottom, xTitle: Units sold per month, at: H4, width: 440, height: 320 } }
  - { command: chart.formatSelection, params: { series: 0, color: "#0284c7" } }
  - { command: chart.formatSelection, params: { series: 1, color: "#f97316" } }
  - { command: sheet.read, params: { range: "E4:E9" }, as: results }
  - { command: sheet.read, params: { range: "A16:F16" }, as: row800 }
  - { command: sheet.read, params: { range: "B20:F20" }, as: row1600 }

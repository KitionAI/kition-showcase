format: 1
id: sheet/break-even-analysis
title: Break-Even Analysis
summary: How many coffee drippers a small pottery has to sell each month to cover its costs, with the revenue and cost lines crossing on a chart.
category: Finance & Budgets
tags: [break-even, formulas, chart, conditional-formatting, number-formats]
features: [sheet.formulas.functions, sheet.edit.fill-clear, sheet.format.number, sheet.charts.design, sheet.format.conditional]
description: |
  Price, unit cost, fixed costs and a planned volume give the contribution margin, the break-even
  volume and revenue, the margin of safety and the profit at plan. The volume table below steps
  from 0 to 1,600 units, losses show in red and the first profitable row is highlighted. The
  volumes are typed as text labels (a leading apostrophe) so the line chart takes them as its
  categories, while the formulas still multiply them as numbers; revenue and total cost cross at
  the break-even volume.
document: { name: break-even-analysis.xlsx, width: 1280, height: 800 }
fonts: [carlito/Carlito-Regular.ttf, carlito/Carlito-Bold.ttf]
steps:
  - { command: range.setValues, params: { range: A1, values: [["Break-Even Analysis"], ["Stoneware pour-over dripper · monthly view"]] } }
  - command: range.setValues
    params:
      range: A4
      values:
        - [Selling price, 42, null, Contribution per unit, "=B4-B5"]
        - [Variable cost per unit, 17.5, null, Contribution margin, "=E4/B4"]
        - [Fixed costs per month, 18400, null, Break-even units, "=B6/E4"]
        - [Planned units, 1100, null, Break-even revenue, "=E6*B4"]
        - [null, null, null, Margin of safety, "=(B7-E6)/B7"]
        - [null, null, null, Profit at plan, "=B7*E4-B6"]
  - command: range.setValues
    params:
      range: A11
      values:
        - [Units sold, Revenue, Total cost, Fixed cost, Variable cost, Profit]
        - ["'0", "=A12*$B$4", "=D12+E12", "=$B$6", "=A12*$B$5", "=B12-C12"]
        - ["'200", "=A13*$B$4", "=D13+E13", "=$B$6", "=A13*$B$5", "=B13-C13"]
        - ["'400", "=A14*$B$4", "=D14+E14", "=$B$6", "=A14*$B$5", "=B14-C14"]
        - ["'600", "=A15*$B$4", "=D15+E15", "=$B$6", "=A15*$B$5", "=B15-C15"]
        - ["'800", "=A16*$B$4", "=D16+E16", "=$B$6", "=A16*$B$5", "=B16-C16"]
        - ["'1,000", "=A17*$B$4", "=D17+E17", "=$B$6", "=A17*$B$5", "=B17-C17"]
        - ["'1,200", "=A18*$B$4", "=D18+E18", "=$B$6", "=A18*$B$5", "=B18-C18"]
        - ["'1,400", "=A19*$B$4", "=D19+E19", "=$B$6", "=A19*$B$5", "=B19-C19"]
        - ["'1,600", "=A20*$B$4", "=D20+E20", "=$B$6", "=A20*$B$5", "=B20-C20"]
  - { command: home.fontSize, params: { range: A1, size: 20 } }
  - { command: home.bold, params: { range: A1 } }
  - { command: home.fontColor, params: { range: A1, color: "#0c4a6e" } }
  - { command: home.fontColor, params: { range: A2, color: "#6b7280" } }
  - { command: home.fontColor, params: { range: "B4:B7", color: "#1d4ed8" } }
  - { command: home.fillColor, params: { range: "A4:B7", color: "#f0f9ff" } }
  - { command: home.borders, params: { range: "A4:B7", preset: outside, color: "#7dd3fc" } }
  - { command: home.numberFormat, params: { range: "B4:B5", format: "$$#,##0.00" } }
  - { command: home.numberFormat, params: { range: "B6", format: "$$#,##0" } }
  - { command: home.numberFormat, params: { range: "B7", format: "#,##0" } }
  - { command: home.fillColor, params: { range: "D4:E9", color: "#0c4a6e" } }
  - { command: home.fontColor, params: { range: "D4:E9", color: "#ffffff" } }
  - { command: home.bold, params: { range: "E4:E9" } }
  - { command: home.numberFormat, params: { range: "E4", format: "$$#,##0.00" } }
  - { command: home.numberFormat, params: { range: "E5", format: "0.0%" } }

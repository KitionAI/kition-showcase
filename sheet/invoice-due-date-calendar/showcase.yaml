format: 1
id: sheet/invoice-due-date-calendar
title: Invoice Due-Date Tracker
summary: Due dates that skip weekends and office holidays with WORKDAY, business days with NETWORKDAYS, and a status for every invoice.
category: Formulas & Functions
tags: [date-functions, formulas, named-ranges, conditional-formatting, number-formats]
features: [sheet.formulas.functions, sheet.formulas.names, sheet.format.conditional, sheet.format.number]
description: |
  Each invoice is due its payment terms after issue, moved to the next working day when that lands
  on a weekend or on one of the office holidays in the named range `Holidays`:
  `WORKDAY(issued+terms-1,1,Holidays)`. TEXT names the weekday, NETWORKDAYS counts the working
  days the client had, and IFS turns the paid date and the statement date into Paid, Overdue or
  Open. Due dates that moved are shown in italics. Below, SUMIFS, AVERAGEIFS and MINIFS
  summarise what is still owed and what falls due next.
document: { name: invoice-due-date-calendar.xlsx, width: 1280, height: 800 }
fonts: [carlito/Carlito-Regular.ttf, carlito/Carlito-Bold.ttf, carlito/Carlito-Italic.ttf, carlito/Carlito-BoldItalic.ttf]
steps:
  - { command: range.setValues, params: { range: A1, values: [["Receivables Calendar"], ["Small design studio · invoices issued January to March 2027"], [Statement date, "2027-03-31"]] } }
  - command: range.setValues
    params:
      range: M4
      values:
        - [Office holidays]
        - ["2027-01-01"]
        - ["2027-01-18"]
        - ["2027-02-15"]
        - ["2027-04-02"]
        - ["2027-05-31"]
  - { command: formulas.defineName, params: { name: Holidays, refersTo: "=Sheet1!$M$5:$M$9" } }
  - command: range.setValues
    params:
      range: A5
      values:
        - [Invoice, Client, Amount, Issued, Terms, Due, Day, Work days, Paid on, Days late, Status]
        - [INV-1041, Alder & Pine Studio, 1850, "2027-01-08", 30, "=WORKDAY(D6+E6-1,1,Holidays)", "=TEXT(F6,\"ddd\")", "=NETWORKDAYS(D6,F6,Holidays)", "2027-02-05", "=IF(I6=\"\",MAX(0,$B$3-F6),I6-F6)", "=IFS(I6<>\"\",\"Paid\",$B$3>F6,\"Overdue\",TRUE,\"Open\")"]
        - [INV-1042, Brightwater Clinic, 4200, "2027-01-15", 45, null, null, null, "2027-03-05"]
        - [INV-1043, Copperleaf Bakery, 960, "2027-01-29", 30, null, null, null, "2027-03-08"]
        - [INV-1044, Driftwood Books, 2375, "2027-02-05", 30]
        - [INV-1045, Elmstead Dental, 6400, "2027-02-12", 60]
        - [INV-1046, Foxglove Florists, 1180, "2027-02-26", 30, null, null, null, "2027-03-26"]
        - [INV-1047, Granite Peak Gym, 720, "2027-03-05", 15]
        - [INV-1048, Harbor Light Cafe, 3150, "2027-03-19", 30]
  - { command: edit.fillDown, params: { range: "F6:H13" } }
  - { command: edit.fillDown, params: { range: "J6:K13" } }
  - command: range.setValues
    params:
      range: A15
      values:
        - [Outstanding, "=SUMIFS(C6:C13,K6:K13,\"<>Paid\")"]
        - [Overdue, "=SUMIFS(C6:C13,K6:K13,\"Overdue\")"]
        - [Average days late (paid), "=AVERAGEIFS(J6:J13,K6:K13,\"Paid\")"]
        - [Next due date, "=MINIFS(F6:F13,K6:K13,\"Open\")"]
        - [Work days until then, "=NETWORKDAYS(B3,B18,Holidays)-1"]
  - { command: home.fontSize, params: { range: A1, size: 20 } }
  - { command: home.bold, params: { range: A1 } }
  - { command: home.fontColor, params: { range: A1, color: "#3730a3" } }
  - { command: home.fontColor, params: { range: A2, color: "#6b7280" } }
  - { command: home.bold, params: { range: "A3:B3" } }
  - { command: home.numberFormat, params: { range: "B3", format: "d mmmm yyyy" } }
  - { command: home.alignLeft, params: { range: "B3" } }
  - { command: home.fontColor, params: { range: "B3", color: "#1d4ed8" } }
  - { command: home.fillColor, params: { range: "A5:K5", color: "#3730a3" } }
  - { command: home.fontColor, params: { range: "A5:K5", color: "#ffffff" } }
  - { command: home.bold, params: { range: "A5:K5" } }
  - { command: home.alignCenter, params: { range: "D5:K5" } }
  - { command: home.alignRight, params: { range: "C5" } }
  - { command: home.numberFormat, params: { range: "C6:C13", format: "#,##0" } }
  - { command: home.numberFormat, params: { range: "D6:D13", format: "d mmm" } }
  - { command: home.numberFormat, params: { range: "F6:F13", format: "d mmm" } }
  - { command: home.numberFormat, params: { range: "I6:I13", format: "d mmm" } }
  - { command: home.numberFormat, params: { range: "J6:J13", format: "+0;-0;0" } }

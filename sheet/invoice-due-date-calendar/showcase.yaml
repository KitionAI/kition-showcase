  - { command: home.borders, params: { range: "A13:K13", preset: bottom, color: "#3730a3" } }
  - { command: home.conditionalFormat, params: { range: "F6:G13", rule: { type: expression, formula: "=$F6<>$D6+$E6", style: { font: { italic: true, color: { Rgb: 10105874 } } } } } }
  - { command: home.conditionalFormat, params: { range: "K6:K13", rule: { type: expression, formula: "=K6=\"Overdue\"", preset: lightRedFillDarkRedText } } }
  - { command: home.conditionalFormat, params: { range: "K6:K13", rule: { type: expression, formula: "=K6=\"Paid\"", preset: greenFillDarkGreenText } } }
  - { command: home.conditionalFormat, params: { range: "K6:K13", rule: { type: expression, formula: "=K6=\"Open\"", preset: yellowFillDarkYellowText } } }
  - { command: home.bold, params: { range: "A15:A19" } }
  - { command: home.numberFormat, params: { range: "B15:B16", format: "$$#,##0" } }
  - { command: home.numberFormat, params: { range: "B17", format: "0.00 \"days\"" } }

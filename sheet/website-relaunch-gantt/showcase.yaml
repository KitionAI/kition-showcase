format: 1
id: sheet/website-relaunch-gantt
title: Website Relaunch Gantt
summary: A seven-week project plan whose Gantt bars, progress fill and status-date column are all drawn by conditional formatting.
category: Planners & Trackers
tags: [gantt, project-plan, conditional-formatting, dates, workday]
features: [sheet.format.conditional, sheet.formulas.functions, sheet.format.number, sheet.view.window]
featured: true
description: |
  The timeline is thirty working days: the first date is the plan start and each next column is
  WORKDAY of the one before, with merged week labels above. End dates are WORKDAY formulas over
  start and length. Three formula rules colour the grid: a light bar between start and end, a
  dark bar for the share already done, and a pale stripe down the status-date column. Change a
  start, a length or a percentage and the chart redraws itself. Task names are frozen in place.
document: { name: website-relaunch-gantt.xlsx, width: 1280, height: 800 }
fonts: [carlito/Carlito-Regular.ttf, carlito/Carlito-Bold.ttf, carlito/Carlito-Italic.ttf]

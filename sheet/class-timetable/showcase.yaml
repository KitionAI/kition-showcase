format: 1
id: sheet/class-timetable
title: Class Timetable
summary: A secondary-school week with double lessons as merged cells, merged break rows and subject colours from text rules.
category: Planners & Trackers
tags: [timetable, merged-cells, conditional-formatting, school, planner]
features: [sheet.format.alignment, sheet.format.conditional, sheet.formulas.functions, sheet.format.font]
description: |
  Double lessons are single cells merged down two periods, and the morning break and lunch are
  merged across the whole week. Subjects are coloured by "text contains" rules, one per
  subject, grouped by department, so retyping a lesson recolours it. The side table counts
  lessons per subject with COUNTIF, where a merged double counts as one lesson.
document: { name: class-timetable.xlsx, width: 1280, height: 800 }
fonts: [carlito/Carlito-Regular.ttf, carlito/Carlito-Bold.ttf, carlito/Carlito-Italic.ttf]
steps:
  - { command: range.setValues, params: { range: A1, values: [["Class 9B Timetable"], ["Autumn term · room 214 unless noted · tutor Ms. Okoro"]] } }
  - { command: range.setValues, params: { range: A4, values: [["Period", "Time", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday"], ["1", "8:30 \u2013 9:20", "Mathematics", "English", "Biology", "Mathematics", "History"], ["2", "9:25 \u2013 10:15", null, null, null, "Geography", null], ["Break", "10:15 \u2013 10:35", "Morning break", null, null, null, null], ["3", "10:35 \u2013 11:25", "Physics", "Spanish", "Mathematics", "English", "Art"], ["4", "11:30 \u2013 12:20", "Spanish", "History", null, "Physics", null], ["Lunch", "12:20 \u2013 13:10", "Lunch", null, null, null, null], ["5", "13:10 \u2013 14:00", "Geography", "Physical education", "English", "Chemistry", "Music"], ["6", "14:05 \u2013 14:55", "Chemistry", null, "Spanish", null, "Mathematics"]] } }
  - { command: range.setValues, params: { range: I4, values: [["Department", "Lessons"]] } }
  - { command: range.setValues, params: { range: I5, values: [["Maths", "=COUNTIF($C$5:$G$12,\"Mathematics\")"], ["Sciences", "=SUM(COUNTIF($C$5:$G$12,{\"Physics\",\"Chemistry\",\"Biology\"}))"]] } }
  - { command: range.setValues, params: { range: I8, values: [["Languages", "=SUM(COUNTIF($C$5:$G$12,{\"English\",\"Spanish\"}))"], ["Humanities", "=SUM(COUNTIF($C$5:$G$12,{\"History\",\"Geography\"}))"]] } }
  - { command: range.setValues, params: { range: I11, values: [["Arts and PE", "=SUM(COUNTIF($C$5:$G$12,{\"Art\",\"Music\",\"Physical education\"}))"], ["All lessons", "=SUM(J5:J11)"]] } }

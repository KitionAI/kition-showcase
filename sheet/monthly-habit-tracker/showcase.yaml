format: 1
id: sheet/monthly-habit-tracker
title: Monthly Habit Tracker
summary: A November habit grid where a 1 becomes a dot through a number format, with completion rates, data bars and a daily heat row.
category: Planners & Trackers
tags: [tracker, habits, custom-formats, conditional-formatting, data-bars]
features: [sheet.format.number, sheet.format.conditional, sheet.formulas.functions, sheet.format.alignment]
description: |
  Mark a day by typing 1: the format `[=1]"●";;` turns it into a dot and a formula rule fills
  the cell green, while days after the logged-through date are greyed out by a second rule.
  COUNT gives each habit's tally, the rate divides it by the days so far, and a data bar shows
  it. The bottom row counts habits done each day under a colour scale, and weekends get a
  darker header.
document: { name: monthly-habit-tracker.xlsx, width: 1280, height: 800 }
fonts: [carlito/Carlito-Regular.ttf, carlito/Carlito-Bold.ttf, carlito/Carlito-Italic.ttf, jetbrains-mono/JetBrainsMono-Variable.ttf]
steps:

format: 1
id: sheet/sumifs-regional-sales
title: SUMIFS Regional Sales Summary
summary: A quarter's deal log rolled up by region and product with SUMIFS, COUNTIFS, AVERAGEIFS and MAXIFS.
category: Formulas & Functions
tags: [conditional-aggregation, formulas, tables, chart, conditional-formatting]
features: [sheet.formulas.functions, sheet.tables.design, sheet.charts.design, sheet.format.conditional, sheet.format.number]
description: |
  Twenty-four deals from the first quarter sit in a table on the left. The grid on the right adds
  them up by region and product with SUMIFS, using mixed references (`$H5`, `I$4`) so one formula
  fills the whole grid, and a colour scale shows where the money is. Below it, COUNTIFS,
  AVERAGEIFS and MAXIFS describe each region, and the March column adds a date criterion built
  from `">="&DATE(2027,3,1)`.
document: { name: sumifs-regional-sales.xlsx, width: 1280, height: 800 }
fonts: [carlito/Carlito-Regular.ttf, carlito/Carlito-Bold.ttf]
steps:
  - { command: range.setValues, params: { range: A1, values: [["Q1 Sales by Region"], ["Subscription deals closed January to March 2027"]] } }
  - command: range.setValues
    params:
      range: A4
      values:
        - [Date, Region, Rep, Plan, Seats, Revenue]
        - ["2027-01-04", West, K. Brennan, Pro, 15, 1935]
        - ["2027-01-07", South, J. Alvarez, Enterprise, 1, 399]
        - ["2027-01-09", West, K. Brennan, Basic, 3, 147]
        - ["2027-01-11", West, K. Brennan, Enterprise, 1, 399]
        - ["2027-01-13", North, A. Okafor, Basic, 5, 245]
        - ["2027-01-16", North, L. Haddad, Pro, 12, 1548]
        - ["2027-01-19", South, J. Alvarez, Pro, 2, 258]
        - ["2027-01-21", West, K. Brennan, Pro, 15, 1935]
        - ["2027-01-23", East, P. Novak, Basic, 15, 735]
        - ["2027-01-27", North, A. Okafor, Enterprise, 1, 399]
        - ["2027-02-01", North, L. Haddad, Pro, 3, 387]
        - ["2027-02-03", North, A. Okafor, Basic, 2, 98]
        - ["2027-02-08", West, K. Brennan, Pro, 3, 387]
        - ["2027-02-11", East, P. Novak, Basic, 6, 294]
        - ["2027-02-15", North, L. Haddad, Basic, 4, 196]
        - ["2027-02-18", North, A. Okafor, Basic, 12, 588]
        - ["2027-02-23", South, M. Lindqvist, Pro, 15, 1935]
        - ["2027-02-26", South, J. Alvarez, Enterprise, 3, 1197]
        - ["2027-02-28", West, K. Brennan, Basic, 2, 98]
        - ["2027-03-04", East, R. Tanaka, Basic, 4, 196]
        - ["2027-03-09", North, A. Okafor, Basic, 5, 245]
        - ["2027-03-14", East, R. Tanaka, Enterprise, 2, 798]
        - ["2027-03-18", West, S. Moreau, Basic, 3, 147]
        - ["2027-03-21", South, M. Lindqvist, Enterprise, 2, 798]
  - { command: home.formatAsTable, params: { range: "A4:F28", style: TableStyleMedium2 } }
  - { command: home.numberFormat, params: { range: "A5:A28", format: "d mmm" } }
  - { command: home.numberFormat, params: { range: "F5:F28", format: "#,##0" } }
  - command: range.setValues
    params:
      range: H4
      values:
        - [Revenue, Basic, Pro, Enterprise, Total]
        - [North, "=SUMIFS($F$5:$F$28,$B$5:$B$28,$H5,$D$5:$D$28,I$4)", "=SUMIFS($F$5:$F$28,$B$5:$B$28,$H5,$D$5:$D$28,J$4)", "=SUMIFS($F$5:$F$28,$B$5:$B$28,$H5,$D$5:$D$28,K$4)", "=SUM(I5:K5)"]
        - [South, "=SUMIFS($F$5:$F$28,$B$5:$B$28,$H6,$D$5:$D$28,I$4)", "=SUMIFS($F$5:$F$28,$B$5:$B$28,$H6,$D$5:$D$28,J$4)", "=SUMIFS($F$5:$F$28,$B$5:$B$28,$H6,$D$5:$D$28,K$4)", "=SUM(I6:K6)"]
        - [East, "=SUMIFS($F$5:$F$28,$B$5:$B$28,$H7,$D$5:$D$28,I$4)", "=SUMIFS($F$5:$F$28,$B$5:$B$28,$H7,$D$5:$D$28,J$4)", "=SUMIFS($F$5:$F$28,$B$5:$B$28,$H7,$D$5:$D$28,K$4)", "=SUM(I7:K7)"]
        - [West, "=SUMIFS($F$5:$F$28,$B$5:$B$28,$H8,$D$5:$D$28,I$4)", "=SUMIFS($F$5:$F$28,$B$5:$B$28,$H8,$D$5:$D$28,J$4)", "=SUMIFS($F$5:$F$28,$B$5:$B$28,$H8,$D$5:$D$28,K$4)", "=SUM(I8:K8)"]
        - [Total, "=SUM(I5:I8)", "=SUM(J5:J8)", "=SUM(K5:K8)", "=SUM(L5:L8)"]
  - command: range.setValues
    params:
      range: H12
      values:
        - [Region, Deals, Seats, Avg deal, Largest, March]
        - [North, "=COUNTIFS($B$5:$B$28,H13)", "=SUMIFS($E$5:$E$28,$B$5:$B$28,H13)", "=AVERAGEIFS($F$5:$F$28,$B$5:$B$28,H13)", "=MAXIFS($F$5:$F$28,$B$5:$B$28,H13)", "=SUMIFS($F$5:$F$28,$B$5:$B$28,H13,$A$5:$A$28,\">=\"&DATE(2027,3,1))"]
        - [South, "=COUNTIFS($B$5:$B$28,H14)", "=SUMIFS($E$5:$E$28,$B$5:$B$28,H14)", "=AVERAGEIFS($F$5:$F$28,$B$5:$B$28,H14)", "=MAXIFS($F$5:$F$28,$B$5:$B$28,H14)", "=SUMIFS($F$5:$F$28,$B$5:$B$28,H14,$A$5:$A$28,\">=\"&DATE(2027,3,1))"]
        - [East, "=COUNTIFS($B$5:$B$28,H15)", "=SUMIFS($E$5:$E$28,$B$5:$B$28,H15)", "=AVERAGEIFS($F$5:$F$28,$B$5:$B$28,H15)", "=MAXIFS($F$5:$F$28,$B$5:$B$28,H15)", "=SUMIFS($F$5:$F$28,$B$5:$B$28,H15,$A$5:$A$28,\">=\"&DATE(2027,3,1))"]
        - [West, "=COUNTIFS($B$5:$B$28,H16)", "=SUMIFS($E$5:$E$28,$B$5:$B$28,H16)", "=AVERAGEIFS($F$5:$F$28,$B$5:$B$28,H16)", "=MAXIFS($F$5:$F$28,$B$5:$B$28,H16)", "=SUMIFS($F$5:$F$28,$B$5:$B$28,H16,$A$5:$A$28,\">=\"&DATE(2027,3,1))"]
  - { command: home.fontSize, params: { range: A1, size: 20 } }
  - { command: home.bold, params: { range: A1 } }

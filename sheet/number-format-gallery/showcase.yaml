  - { command: sheet.read, params: { range: "C5:E15", formatted: true }, as: shown }
  - { command: sheet.read, params: { range: "I5:I15", formatted: true }, as: dates }
  - { command: sheet.read, params: { range: "C7:E7" }, as: raw }
